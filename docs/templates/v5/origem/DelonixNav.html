<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"><!--CS-->
</head>
<body>
<x-dc>
<div style="width:228px;flex:none;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:var(--raised);border-right:1px solid var(--border)">
  <div style="display:flex;align-items:center;gap:10px;padding:18px 18px 16px">
    <div style="width:28px;height:28px;flex:none;border-radius:2px;background:var(--accent-strong);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px"><svg viewBox="0 0 24 24" width="74%" height="74%" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="8.7"></circle><path d="M12 12 15.4 3.9M12 12 20.1 8.6M12 12 20.1 15.4M12 12 15.4 20.1M12 12 3.9 15.4M12 12 3.9 8.6"></path><g fill="currentColor" stroke="none"><circle cx="16.2" cy="3" r="1.4"></circle><circle cx="21" cy="7.8" r="1.4"></circle><circle cx="21" cy="16.2" r="1.4"></circle><circle cx="16.2" cy="21" r="1.4"></circle><circle cx="3" cy="16.2" r="1.4"></circle><circle cx="3" cy="7.8" r="1.4"></circle></g></svg></div>
    <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
      <div style="font-size:13px;font-weight:600;letter-spacing:-0.1px">Delonix Meet</div>
      <div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">v2.4 · WAT</div>
    </div>
  </div>
  <div style="padding:0 10px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
      <div style="position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:2px;font-size:12.5px;font-weight:500;cursor:pointer;background:{{ it.bg }};color:{{ it.fg }}">
        <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)"></div></sc-if>
        <div style="width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center">{{ it.icon }}</div>
        <span>{{ it.label }}</span>
        <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-family:'DM Mono',monospace;font-size:9.5px;font-weight:600;padding:2px 5px;border-radius:2px;background:var(--accent-strong);color:#fff">{{ it.badge }}</span></sc-if>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:2px;border:1px solid var(--border);font-size:10.5px;color:var(--muted)">
      <div style="width:6px;height:6px;border-radius:50%;background:var(--success);flex:none"></div>
      <span style="font-family:'DM Mono',monospace">On-Premise · Luanda</span>
    </div>
    <div style="display:flex;align-items:center;gap:9px">
      <div style="width:28px;height:28px;flex:none;border-radius:50%;background:#9e2026;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">AM</div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <div style="font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Ana Mbala</div>
        <div style="font-size:9.5px;color:var(--muted)">Odoo SSO · Delonix Angola</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{"$preview":{"width":228,"height":900},"active":{"editor":"enum","options":["home","agenda","calls","studio","rec","integ","mod","admin"],"default":"home","tsType":"string"}}">
const ic = (d, extra) => React.createElement('svg', {width:16,height:16,viewBox:'0 0 16 16',fill:'none',stroke:'currentColor',strokeWidth:1.4,strokeLinecap:'round',strokeLinejoin:'round'}, [React.createElement('path',{key:'p',d}), extra].filter(Boolean));

const ICONS = {
  home: ic('M2.5 7 8 2.5 13.5 7v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1Z'),
  agenda: ic('M2.5 4.5h11v9h-11zM2.5 7.5h11M5.5 2.5v3M10.5 2.5v3'),
  calls: ic('M3 3.5h3l1 3-1.5 1.5a7 7 0 0 0 3 3L10 9.5l3 1v3H11A8 8 0 0 1 3 5.5Z'),
  studio: ic('M1.5 4.5h8v7h-8zM10.5 7l4-2.5v7L10.5 9Z'),
  rec: ic('M2.5 3.5h11v9h-11zM6.5 6.5l4 2.5-4 2.5Z'),
  integ: ic('M2.5 6.5h4v-4h3v4h4v3h-4v4h-3v-4h-4Z'),
  mod: ic('M6 7.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM1.5 13.5c0-2.2 2-3.5 4.5-3.5s4.5 1.3 4.5 3.5M11 4.5h3.5M11 7h3.5'),
  admin: ic('M8 1.8 13.5 4v4c0 3-2.4 5.3-5.5 6.2C4.9 13.3 2.5 11 2.5 8V4Z', React.createElement('path',{key:'c',d:'M5.8 8l1.6 1.6L10.4 6.6'}))
};

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const defs = [
      ['home','Início','home'],
      ['agenda','Agenda','agenda',null],
      ['calls','Chamadas','calls'],
      ['studio','Estúdio','studio'],
      ['rec','Gravações','rec'],
      ['integ','Integrações','integ'],
      ['mod','Moderação','mod'],
      ['admin','Administração','admin']
    ];
    return {
      items: defs.map(([id,label,icon,badge]) => {
        const on = id === active;
        return {
          id, label, icon: ICONS[icon], active: on,
          badge: id === 'agenda' ? '3' : null,
          bg: on ? 'color-mix(in srgb, var(--accent) 14%, transparent)' : 'transparent',
          fg: on ? 'var(--accent)' : 'var(--muted)'
        };
      })
    };
  }
}
<!--CS-->
</body>
</html>
