<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--__SUPPORT__-->
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap"><style>body{margin:0}a{color:#e8232b;text-decoration:none}a:hover{color:#2f9e6a}</style></helmet>
<div style="--surface:#0d0d0f;--raised:#17171a;--stage:#000000;--border:#2a2a2e;--text:#f2f2f3;--muted:#9a9aa0;--accent:#ff5a60;--accent-strong:#ad1017;--live:#f0a32e;--record:#d41f27;--success:#2f9e6a;--warning:#f0a32e;--danger:#d41f27;width:1440px;height:900px;box-sizing:border-box;overflow:hidden;background:var(--stage);color:var(--text);font-family:'Archivo',system-ui,sans-serif;display:flex;flex-direction:column">

  <div style="height:54px;flex:none;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--border)">
    <div style="width:22px;height:22px;border-radius:2px;background:var(--accent);color:#1a0002;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px"><svg viewBox="0 0 24 24" width="74%" height="74%" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="8.7"></circle><path d="M12 12 15.4 3.9M12 12 20.1 8.6M12 12 20.1 15.4M12 12 15.4 20.1M12 12 3.9 15.4M12 12 3.9 8.6"></path><g fill="currentColor" stroke="none"><circle cx="16.2" cy="3" r="1.4"></circle><circle cx="21" cy="7.8" r="1.4"></circle><circle cx="21" cy="16.2" r="1.4"></circle><circle cx="16.2" cy="21" r="1.4"></circle><circle cx="3" cy="16.2" r="1.4"></circle><circle cx="3" cy="7.8" r="1.4"></circle></g></svg></div>
    <div style="font-size:13px;font-weight:600">Formação — Arquitectura de Voz Delonix</div>
    <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:2px;background:var(--raised);border:1px solid var(--border)">00:24:18</div>
    <div style="display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:2px;background:color-mix(in srgb,var(--record) 18%,transparent);border:1px solid var(--record);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:#ef9a9a"><div style="width:7px;height:7px;border-radius:50%;background:var(--record)"></div>REC 4K</div>
    <div style="display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:2px;background:color-mix(in srgb,var(--live) 18%,transparent);border:1px solid var(--live);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:#e8bb86"><div style="width:0;height:0;border-left:6px solid var(--live);border-top:4px solid transparent;border-bottom:4px solid transparent"></div>AO VIVO · 1 284 espectadores</div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:2px;border:1px solid var(--border);font-size:10.5px;color:var(--muted)"><span style="color:var(--success)">✓</span>Ligação estável · WAT 10:24</div>
    <div style="display:flex;gap:4px;padding:3px;border-radius:2px;background:var(--raised);border:1px solid var(--border)">
      <div style="padding:4px 9px;border-radius:2px;background:var(--accent-strong);color:#fff;font-size:10.5px;font-weight:600">Grelha</div>
      <div style="padding:4px 9px;border-radius:2px;font-size:10.5px;color:var(--muted)">Orador</div>
      <div style="padding:4px 9px;border-radius:2px;font-size:10.5px;color:var(--muted)">Estúdio</div>
    </div>
  </div>

  <div style="flex:1;min-height:0;padding:14px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
    <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="12">
        <div style="position:relative;border-radius:3px;overflow:hidden;background:{{ p.grad }};border:1px solid {{ p.ring }}">
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
            <div style="width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#fff;letter-spacing:0.5px">{{ p.initials }}</div>
          </div>
          <div style="position:absolute;top:8px;right:8px;display:flex;gap:5px">
            <sc-if value="{{ p.hand }}" hint-placeholder-val="{{ false }}"><div style="padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.74);border:1px solid var(--live);font-family:'DM Mono',monospace;font-size:9px;font-weight:600;color:#e8bb86">✋ MÃO</div></sc-if>
            <sc-if value="{{ p.weak }}" hint-placeholder-val="{{ false }}"><div style="padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.74);border:1px solid var(--warning);font-family:'DM Mono',monospace;font-size:9px;font-weight:600;color:#e8bb86">▲ FRACA</div></sc-if>
            <sc-if value="{{ p.pstn }}" hint-placeholder-val="{{ false }}"><div style="padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.74);font-family:'DM Mono',monospace;font-size:9px;color:#d6d6da">☏ +244</div></sc-if>
          </div>
          <div style="position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:center;gap:6px">
            <div style="display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:2px;background:rgba(0,0,0,.74);min-width:0">
              <sc-if value="{{ p.muted }}" hint-placeholder-val="{{ true }}"><span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)">⊘</span></sc-if>
              <sc-if value="{{ p.speaking }}" hint-placeholder-val="{{ false }}"><span style="font-size:9px;color:var(--success)">◉</span></sc-if>
              <span style="font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</span>
            </div>
            <sc-if value="{{ p.role }}" hint-placeholder-val="{{ false }}"><div style="padding:3px 6px;border-radius:2px;background:rgba(0,0,0,.74);font-family:'DM Mono',monospace;font-size:8.5px;font-weight:600;color:#2f9e6a">{{ p.role }}</div></sc-if>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="flex:none;display:flex;align-items:center;gap:12px">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:2px;background:var(--surface);border:1px solid var(--border)">
        <span style="font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted)">FONTE</span>
        <div style="display:flex;gap:3px">
          <div style="padding:3px 8px;border-radius:2px;background:var(--accent-strong);color:#fff;font-size:10px;font-weight:600">Câmara</div>
          <div style="padding:3px 8px;border-radius:2px;border:1px solid var(--border);font-size:10px;color:var(--muted)">HDMI</div>
        </div>
      </div>
      <div style="flex:1;display:flex;justify-content:center">
        <dc-import name="DelonixControls" set="room" hint-size="100%,66px"></dc-import>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:2px;background:var(--surface);border:1px solid var(--border)">
        <span style="font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted)">14 na sala · 2 em espera</span>
        <div style="padding:3px 8px;border-radius:2px;border:1px solid var(--accent);color:var(--accent);font-size:10px;font-weight:600">Admitir</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{"$preview":{"width":1440,"height":900}}">
const CAST = [
  ['Ana Mbala','AM','#7d1a1f','ANFITRIÃ',{speaking:true}],
  ['Teresa Kiala','TK','#7a4a68','ORADORA',{hand:true,muted:true}],
  ['Joaquim Ferreira','JF','#3c5a7a','CO-ANFITRIÃO',{muted:true}],
  ['Domingos Nzuzi','DN','#8a6a30',null,{muted:true,pstn:true}],
  ['Luísa Cardoso','LC','#5a5480',null,{muted:true}],
  ['Paulo Sebastião','PS','#3a6b73','EMISSÃO',{muted:true}],
  ['Esperança Tchivinda','ET','#9a4a44',null,{muted:true,weak:true}],
  ['Nuno Baptista','NB','#5c6b3a',null,{muted:true}],
  ['Cátia Mendes','CM','#7d5540',null,{muted:true}],
  ['Élio Kassoma','EK','#47617d',null,{muted:true}],
  ['Rita Domingas','RD','#6b4a74',null,{muted:true,hand:true}],
  ['Bento Quissanga','BQ','#3d6a5e',null,{muted:true}]
];
class Component extends DCLogic {
  renderVals() {
    return {
      people: CAST.map(([name, initials, color, role, f]) => ({
        name, initials, role,
        grad: 'linear-gradient(150deg, ' + color + ', #000000 78%)',
        ring: f.speaking ? '#2f9e6a' : '#2a2a2e',
        muted: !!f.muted, speaking: !!f.speaking, hand: !!f.hand, weak: !!f.weak, pstn: !!f.pstn
      }))
    };
  }
}
<!--CS-->
</body>
</html>
