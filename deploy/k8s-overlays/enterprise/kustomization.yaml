apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ============================================================
#  Edição Enterprise on-premise (ADR-0006 §2): uma organização, registo por
#  convite, uma réplica chega.
#
#    kubectl kustomize deploy/k8s-overlays/enterprise
#    kubectl apply -k deploy/k8s-overlays/enterprise
#
#  Diferenças para a base:
#   - DELONIX_EDITION=enterprise, REGISTRATION_MODE=invite, TENANCY_MODE=single;
#   - replicas: 1 e migrações no arranque (DELONIX_MIGRATE=1, sem Job);
#   - sem HPA. Para mais de uma réplica: Redis obrigatório (ADR-0006 §2) e a
#     afinidade do ADR-0001, que já vem da base;
#   - tudo o que vem de components/edition-common.
#
#  O PDB da base (maxUnavailable: 1) com uma réplica deixa o drain de nó
#  despejar o pod — é o comportamento certo para um nó em manutenção, e o
#  drain do servidor (DRAIN_GRACE_SECS) avisa as salas antes.
# ============================================================
resources:
  - ../../k8s

components:
  - ../components/edition-common

patches:
  - path: server-edition.yaml
