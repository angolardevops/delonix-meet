{{- $v := .Values -}}
{{- $c := $v.coturn -}}
{{- if $c.enabled }}
# coturn — relay de media. UMA réplica, de propósito: em relay-only dos dois
# lados o servidor e o browser relayam um pelo outro através de alocações no
# MESMO turnserver (hairpin). Duas réplicas partiam a media; escalar exige um
# redesenho (deploy/k8s/51-coturn.yaml). Por isso não há PDB nem HPA aqui.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  labels:
    app: coturn
    {{- include "dm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: coturn
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: coturn
        {{- include "dm.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9641"
    spec:
      # Prioridade de agendamento — OPCIONAL e nunca fixa no chart. Num
      # cluster PARTILHADO (ADR-0021) é o que decide quem é desalojado
      # quando um nó aperta; mas o nome da classe é do operador do cluster,
      # e um `priorityClassName` que não exista faz o API server RECUSAR o
      # pod. Por isso: vazio por omissão, e quem instala diz o nome.
      {{- with $c.priorityClassName | default $v.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- include "dm.imagePullSecrets" . | nindent 6 }}
      {{- if $c.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coturn
          image: {{ printf "%s:%s" $c.image.repository $c.image.tag | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          env:
            # O MESMO segredo com que o servidor assina as credenciais TURN.
            - name: TURN_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "dm.secretName" . }}, key: TURN_SECRET } }
            - name: EXTERNAL_IP
              {{- if $c.externalIP }}
              value: {{ $c.externalIP | quote }}
              {{- else }}
              valueFrom: { fieldRef: { fieldPath: {{ ternary "status.hostIP" "status.podIP" $c.hostNetwork }} } }
              {{- end }}
            {{- if $c.privateIP }}
            - name: PRIVATE_IP
              value: {{ $c.privateIP | quote }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            # allowed-peer-ip autoriza o hairpin (sem ele: 403 Forbidden IP e
            # vídeo preto). denied-peer-ip fecha o SSRF-por-TURN para os
            # metadados da cloud. NÃO negar RFC1918 em bloco: o relay vive lá.
            - >
              exec turnserver -n --no-cli --log-file=stdout --simple-log
              --use-auth-secret --static-auth-secret="$TURN_SECRET"
              {{- if $c.privateIP }}
              --realm={{ $c.realm }} --external-ip="$EXTERNAL_IP/$PRIVATE_IP"
              --allowed-peer-ip="$EXTERNAL_IP" --allowed-peer-ip="$PRIVATE_IP"
              {{- else }}
              --realm={{ $c.realm }} --external-ip="$EXTERNAL_IP"
              --allowed-peer-ip="$EXTERNAL_IP"
              {{- end }}
              --denied-peer-ip=169.254.0.0-169.254.255.255
              --no-multicast-peers
              --listening-port={{ $c.port }} --min-port={{ $c.relayPorts.min }} --max-port={{ $c.relayPorts.max }}
              --total-quota={{ $c.totalQuota }}
              --fingerprint --stale-nonce=3600
              --relay-threads={{ $c.relayThreads }}
              --no-tcp-relay --no-tls --no-dtls
              --no-rfc5780
              --prometheus
          ports:
            - { name: turn-udp, containerPort: {{ $c.port }}, protocol: UDP }
            - { name: metrics, containerPort: 9641, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: {{ $c.port }} }
            initialDelaySeconds: 2
            periodSeconds: 10
          # Um STUN binding a sério: apanha o turnserver preso com o socket aberto.
          #
          # UM pedido e UMA resposta, e é por isso que o coturn corre com
          # `--no-rfc5780`. Sem ele, o servidor anuncia um endereço alternativo
          # (OTHER-ADDRESS) e o `turnutils_stunclient` continua com os testes de
          # descoberta de NAT. Com o relay atrás de NAT esse endereço é o IP
          # PÚBLICO na porta seguinte: em produção, a 2026-10-13, a sonda recebeu
          # a primeira resposta, ficou pendurada nos testes seguintes, expirou
          # aos 5 s, e o kubelet reiniciou o relay de 70 em 70 segundos — a
          # derrubar todas as alocações. O WebRTC não usa a descoberta de NAT do
          # RFC 5780; desligá-la tira à sonda a dependência de um endereço a
          # que o nó pode não chegar.
          #
          # E É POR ISSO QUE A SONDA DEIXOU DE SER ESSE PEDIDO. O `--no-rfc5780`
          # é necessário e NÃO foi suficiente: a 2026-10-13, com a flag
          # confirmada nos argumentos do processo em produção (`kubectl get pod
          # -o jsonpath` sobre os `args`), a sonda continuou a receber
          # `Other addr: <público>:3479` e a expirar, e o relay continuou a
          # reiniciar — 4 reinícios em 3 minutos, até ao `helm rollback`. Duas
          # tentativas de reproduzir o bloqueio em laboratório falharam (com o
          # alternativo sem rota E com o alternativo silencioso, a sonda saiu
          # com 0 em milissegundos), por isso a causa exacta continua POR
          # EXPLICAR.
          #
          # Daí esta sonda: a vida do relay passa a ser medida por uma coisa que
          # NÃO atravessa a rede. Uma sonda de liveness que faz uma ida e volta
          # para fora do pod é uma sonda que mata um servidor saudável quando um
          # caminho alheio está lento — e foi exactamente isso que aconteceu.
          # O que ela prova é menor (o processo vive e tem o porto preso) e é o
          # que a de readiness já provava; o que ela ganha é não poder pendurar.
          livenessProbe:
            tcpSocket: { port: {{ $c.port }} }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          # `allowPrivilegeEscalation: true` não é descuido: o binário desta
          # imagem tem file-capabilities e com no-new-privs o exec dá EPERM
          # (deploy/k8s/51-coturn.yaml). Largam-se todas as outras.
          securityContext:
            allowPrivilegeEscalation: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  labels:
    app: coturn
    {{- include "dm.labels" . | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  {{- if and (eq $c.service.type "LoadBalancer") $c.service.loadBalancerIP }}
  loadBalancerIP: {{ $c.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if ne $c.service.type "ClusterIP" }}
  # `Cluster` enquanto houver UMA réplica: com `Local`, o tráfego que chegue a
  # um nó sem o pod é descartado.
  externalTrafficPolicy: {{ $c.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app: coturn
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: turn-udp, port: {{ $c.port }}, targetPort: {{ $c.port }}, protocol: UDP }
{{- end }}
