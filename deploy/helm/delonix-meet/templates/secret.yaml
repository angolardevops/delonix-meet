{{- /*
  SÓ laboratório (`secrets.create=true`, recusado com production=true).
  Os valores são aleatórios, gerados na instalação, e os que já existem no
  cluster são preservados (`lookup`) — um `helm upgrade` não roda segredos nem
  parte o DATABASE_URL. O chart não traz nenhum valor escrito.
  Nota: `helm template` não fala com o cluster, por isso mostra valores novos
  a cada execução; o que fica instalado é o que o `lookup` encontrar.
*/ -}}
{{- if .Values.secrets.create }}
{{- $antigo := (lookup "v1" "Secret" .Release.Namespace "delonix-secrets") | default dict -}}
{{- $d := get $antigo "data" | default dict -}}
{{- $pg := (get $d "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: delonix-secrets
  labels:
    {{- include "dm.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ get $d "JWT_SECRET" | default (randAlphaNum 64 | b64enc) }}
  TURN_SECRET: {{ get $d "TURN_SECRET" | default (randAlphaNum 40 | b64enc) }}
  VOICE_INTERNAL_SECRET: {{ get $d "VOICE_INTERNAL_SECRET" | default (randAlphaNum 64 | b64enc) }}
  PROVISIONING_SECRET: {{ get $d "PROVISIONING_SECRET" | default (randAlphaNum 48 | b64enc) }}
  # kid:base64 de 32 bytes (delonix-meet-core, secret_box::from_spec).
  DATA_ENCRYPTION_KEYS: {{ get $d "DATA_ENCRYPTION_KEYS" | default (printf "k1:%s" (randBytes 32) | b64enc) }}
  POSTGRES_PASSWORD: {{ $pg | b64enc }}
  DATABASE_URL: {{ printf "postgres://%s:%s@delonix-postgres.%s.svc.cluster.local:5432/%s" .Values.postgresql.username $pg .Release.Namespace .Values.postgresql.database | b64enc }}
{{- end }}
