{{- include "dm.validate" . -}}
{{- $v := .Values -}}
{{- /*
  Configuração NÃO secreta do servidor. O chart nunca liga o modo inseguro do
  servidor (a variável que aceita segredos de desenvolvimento): o portão
  scripts/check-helm.sh falha se ela aparecer no render.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: delonix-config
  labels:
    {{- include "dm.labels" . | nindent 4 }}
data:
  BIND_ADDR: "0.0.0.0:8180"
  LOG_FORMAT: json
  DELONIX_EDITION: {{ $v.edition | quote }}
  {{- with $v.registrationMode }}
  REGISTRATION_MODE: {{ . | quote }}
  {{- end }}
  {{- with $v.registrationDomains }}
  REGISTRATION_DOMAINS: {{ join "," . | quote }}
  {{- end }}
  {{- with $v.tenancyMode }}
  TENANCY_MODE: {{ . | quote }}
  {{- end }}
  DELONIX_MIGRATE: {{ ternary "0" "1" (eq $v.server.migrations.mode "job") | quote }}
  {{- /* O canónico primeiro: é a origem para onde o SSO devolve o browser. */}}
  {{- $origens := list -}}
  {{- range include "dm.hosts" . | fromJsonArray -}}
  {{- $origens = append $origens (printf "https://%s" .) -}}
  {{- end }}
  CORS_ORIGINS: {{ join "," $origens | quote }}
  PUBLIC_URL: {{ $v.publicUrl | default (printf "https://%s" $v.host) | trimSuffix "/" | quote }}
  RECORDINGS_DIR: /var/lib/delonix/recordings
  # Media relay-only pelo coturn: o IP do pod não é alcançável de fora.
  FORCE_TURN_RELAY: {{ ternary "1" "0" $v.server.forceTurnRelay | quote }}
  SFU_EXTERNAL_IP: ""
  {{- /*
    Admissão por capacidade (ADR-0017). SÓ entram quando declaradas: o servidor
    entra em pânico com um valor que não seja inteiro POSITIVO
    (`config.rs`: «NODE_PEER_CAPACITY: «0» não é um inteiro positivo»), por isso
    `0` aqui significa «não declarada» e não se renderiza nada.
  */}}
  {{- if gt (int $v.server.nodePeerCapacity) 0 }}
  NODE_PEER_CAPACITY: {{ $v.server.nodePeerCapacity | quote }}
  {{- end }}
  {{- if gt (int $v.server.orgMaxParticipants) 0 }}
  ORG_MAX_PARTICIPANTS: {{ $v.server.orgMaxParticipants | quote }}
  {{- end }}
  {{- with include "dm.turnHost" . }}
  TURN_HOST: {{ . | quote }}
  {{- end }}
  {{- with $v.server.turnHostBySite }}
  {{- $pares := list -}}
  {{- range $site := keys . | sortAlpha -}}
  {{- $pares = append $pares (printf "%s=%s" $site (index $v.server.turnHostBySite $site)) -}}
  {{- end }}
  TURN_HOST_BY_HOST: {{ join "," $pares | quote }}
  {{- end }}
  {{- with include "dm.redisUrl" . }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- if $v.server.internal.enabled }}
  INTERNAL_BIND_ADDR: "0.0.0.0:8181"
  {{- end }}
  {{- if $v.server.grpc.enabled }}
  GRPC_BIND_ADDR: "0.0.0.0:9180"
  GRPC_TLS_CERT: /etc/delonix/grpc-tls/tls.crt
  GRPC_TLS_KEY: /etc/delonix/grpc-tls/tls.key
  GRPC_CLIENT_CA: /etc/delonix/grpc-tls/ca.crt
  {{- end }}
  {{- if $v.server.phoneBridge.enabled }}
  PHONE_BRIDGE_SIP_BIND: {{ printf "0.0.0.0:%v" $v.server.phoneBridge.sipPort | quote }}
  PHONE_BRIDGE_FREESWITCH_IPS: {{ join "," $v.server.phoneBridge.freeswitchIPs | quote }}
  PHONE_BRIDGE_RTP_MIN: {{ $v.server.phoneBridge.rtp.min | quote }}
  PHONE_BRIDGE_RTP_MAX: {{ $v.server.phoneBridge.rtp.max | quote }}
  {{- end }}
  {{- with $v.server.telephony.eslAddr }}
  TELEPHONY_ESL_ADDR: {{ . | quote }}
  {{- end }}
  {{- with $v.server.telephony.kamailioRpcUrl }}
  TELEPHONY_KAMAILIO_RPC_URL: {{ . | quote }}
  {{- end }}
  {{- /*
    A IA local. O URL é DERIVADO do Service do chart e não um valor que o
    operador escreve: era exactamente aí que a produção se perdia — o Ollama
    existia no caminho kustomize, o `OLLAMA_URL` vivia noutro ficheiro, e o
    ConfigMap que foi para o cluster partilhado não o levava. Sem a chave, o
    servidor desliga a IA em silêncio (`Config.ollama_url = None`) e a ata de
    IA nunca nasce.

    Os nomes dos modelos saem da MESMA lista que o pod puxa (`ollama.models`),
    por isso não podem divergir dela.
  */}}
  {{- if $v.ollama.enabled }}
  OLLAMA_URL: {{ printf "http://delonix-ollama.%s.svc.cluster.local:11434" .Release.Namespace | quote }}
  OLLAMA_MODEL_SUMMARY: {{ $v.ollama.modelSummary | quote }}
  OLLAMA_MODEL_TRANSLATE: {{ $v.ollama.modelTranslate | quote }}
  {{- with $v.ollama.modelStudio }}
  OLLAMA_MODEL_STUDIO: {{ . | quote }}
  {{- end }}
  OLLAMA_TIMEOUT_SECS: {{ $v.ollama.timeoutSeconds | quote }}
  MOM_WINDOW_CHARS: {{ $v.ollama.momWindowChars | quote }}
  MOM_SUMMARY_TIMEOUT_SECS: {{ $v.ollama.momSummaryTimeoutSeconds | quote }}
  {{- end }}
  {{- range $k, $val := $v.server.config }}
  {{ $k }}: {{ $val | toString | quote }}
  {{- end }}
