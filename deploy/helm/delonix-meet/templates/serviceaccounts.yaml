# Contas de serviço dedicadas, SEM token da API do Kubernetes montado.
#
# Medido a 2026-10-07: nem o chart nem o `deploy/k8s/` tinham ServiceAccount
# nenhuma — tudo corria na `default`, com o token montado em cada pod. Nenhuma
# destas cargas fala com a API do Kubernetes; um token montado num pod que não
# precisa dele é só superfície de ataque, e é o primeiro que se usa a seguir a
# entrar num contentor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delonix-server
  labels: {{- include "dm.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delonix-web
  labels: {{- include "dm.labels" . | nindent 4 }}
automountServiceAccountToken: false
