# ============================================================
#  Delonix Meet — valores por omissão.
#
#  As omissões são FECHADAS: com este ficheiro sozinho o `helm template`
#  FALHA e diz o que falta (host, tag das imagens, Secret, IP do coturn…).
#  Nada aqui é um segredo, e nada aqui escolhe uma imagem `latest`.
#
#    values-production.yaml  — a topologia de meet.ngolacloud.com
#    values-local.yaml       — o cluster de laboratório (`make cluster`)
#
#  NOMES DOS RECURSOS: são fixos (delonix-server, delonix-server-ws,
#  delonix-server-internal, delonix-web, coturn, kamailio, freeswitch…), não
#  levam o nome da release. Razões medidas: o nginx da imagem web faz
#  `proxy_pass http://delonix-server:8180` (deploy/k8s/nginx.conf:74), o
#  dispatcher do Kamailio e o PBX de laboratório resolvem `freeswitch` e
#  `kamailio`, e os portões do repo procuram `delonix-server-ws`.
#  Consequência: UMA release por namespace.
# ============================================================

# `true`: recusa segredos gerados, tags `latest`, Postgres/Redis do chart,
# PBX de laboratório, e exige TLS e o IP público do coturn.
production: true

# O nome público. Entra no Ingress, no CORS_ORIGINS e no certificado.
host: ""

# Outros nomes pelos quais a MESMA instalação responde (p.ex. o `.ao` ao lado
# do `.com`). Entram nas HTTPRoutes e no CORS_ORIGINS, DEPOIS do `host`.
#
# O `host` continua a ser o nome CANÓNICO, e isso tem consequências que um
# segundo nome não apaga:
#   * a primeira origem do CORS_ORIGINS é para onde o SSO devolve o browser
#     (`sso_configured_origin`) — quem entra por SSO num nome extra acaba no
#     canónico;
#   * a sessão e as chaves de acesso (WebAuthn) são POR ORIGEM: quem entra num
#     nome não está autenticado no outro.
# Só em `gateway.mode: attach`: o certificado é do Gateway a que as rotas se
# colam, e é ele que tem de cobrir todos os nomes. Em `mode: own` e no Ingress
# o chart pede UM certificado para UM nome, e recusa a lista em vez de servir
# o segundo nome com o certificado do primeiro.
extraHosts: []

imagePullSecrets: []

# Tag partilhada pelo servidor e pela web (saem do mesmo commit: `make image`
# dá às duas a tag `git describe`). OBRIGATÓRIA; `latest` é recusada em produção.
image:
  tag: ""

# Edição (ADR-0006 §2): saas | enterprise | personal. Registo e tenancy seguem
# a edição quando ficam vazios (server/src/config.rs).
edition: saas
registrationMode: ""
registrationDomains: []
tenancyMode: ""

# ------------------------------------------------------------
#  SEGREDOS — o chart nunca traz valores.
#  Produção: `existingSecret` é obrigatório. As chaves estão no README.
#  Laboratório (production=false): `create: true` gera aleatórios e preserva
#  os que já existem no cluster (`lookup`).
# ------------------------------------------------------------
secrets:
  existingSecret: ""
  create: false

# ------------------------------------------------------------
#  Postgres e Redis
# ------------------------------------------------------------
# Externo: o DATABASE_URL vem da chave `DATABASE_URL` do Secret. O chart não
# cria utilizadores, não faz backup e não dá HA — isso é de quem opera a base.
postgresql:
  # Só laboratório: UM pod, sem réplica, sem backup. Recusado em produção.
  enabled: false
  image: { repository: postgres, tag: "17-alpine", pullPolicy: IfNotPresent }
  database: delonix_meet
  username: delonix
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  # Só laboratório: UM pod, sem persistência, sem password. Recusado em produção.
  enabled: false
  image: { repository: redis, tag: "7-alpine", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

externalRedis:
  # URL sem credenciais (vai para o ConfigMap) …
  url: ""
  # … ou, com password, a chave `REDIS_URL` do Secret.
  fromSecret: false

# ------------------------------------------------------------
#  Servidor (API + sinalização + SFU)
# ------------------------------------------------------------
server:
  image: { repository: delonix-server, tag: "", pullPolicy: IfNotPresent }
  replicas: 2
  # Tem de ser MAIOR que DRAIN_GRACE_SECS (40) + DRAIN_READINESS_SECS (12).
  terminationGracePeriodSeconds: 60
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # Vazio = as omissões do chart: espalhar por nó e por zona (ScheduleAnyway)
  # e anti-afinidade preferida entre réplicas.
  topologySpreadConstraints: []
  affinity: {}

  # O que o BROWSER usa para chegar ao TURN (`host:porta`). Vazio = o
  # `coturn.externalIP` e a porta do coturn deste chart.
  #
  # É UM valor para dois leitores: o browser recebe-o, e o SFU usa-o para as
  # suas próprias alocações. Com `coturn.privateIP` (relay atrás de NAT) põe
  # aqui um NOME (`turn.exemplo.ao:3478`): o chart dá aos pods do servidor um
  # `hostAliases` desse nome para o IP privado, e o SFU fala com o relay por
  # dentro enquanto o browser lhe chega pelo IP público.
  turnHost: ""
  # Media em Kubernetes é relay-only: o IP do pod não é alcançável de fora.
  forceTurnRelay: true

  migrations:
    # startup — o servidor migra ao arrancar (uma réplica, ou laboratório).
    # job     — Job `pre-install,pre-upgrade` com a MESMA imagem e
    #           DELONIX_MIGRATE=0 no Deployment. Exige base externa e
    #           `secrets.existingSecret` (o Job corre antes de o chart criar
    #           o que quer que seja).
    mode: startup

  # Listener interno (:8181 — /internal/v1/*, /metrics). Só no Service
  # `delonix-server-internal`, que nenhum Ingress refere.
  internal:
    enabled: true

  # gRPC interno (:9180), mTLS obrigatório — o servidor recusa arrancar com
  # GRPC_BIND_ADDR e sem os três ficheiros.
  grpc:
    enabled: false
    # Secret com tls.crt, tls.key e ca.crt …
    tlsSecretName: ""
    # … ou a cadeia do cert-manager (CA interna do namespace), como em
    # deploy/k8s-overlays/components/edition-common/grpc-mtls.yaml.
    certManager:
      enabled: false

  # Ponte telefone↔sala (ADR-0010). Ler o README §«Ponte telefone↔sala» antes
  # de ligar: a allowlist é por IP EXACTO e um pod não tem IP fixo.
  phoneBridge:
    enabled: false
    sipPort: 5090
    # `host:porta` que o FreeSWITCH marca. Vazio = o IP do próprio pod.
    advertise: ""
    # PHONE_BRIDGE_FREESWITCH_IPS — IPs exactos, sem CIDR. Vazia = o chart falha.
    freeswitchIPs: []
    rtp: { min: 20200, max: 20400 }

  # Telefonia de troncos (ADR-0009). `eslAddr` (ex.:
  # freeswitch.<namespace>.svc.cluster.local:8021) exige a chave
  # TELEPHONY_ESL_PASSWORD no Secret (o servidor recusa arrancar sem ela); com
  # a voz do chart o FreeSWITCH abre-lhe o ESL com a mesma chave. É por aqui
  # que um tronco alterado ou apagado chega ao FreeSWITCH e que a consola vê o
  # registo.
  telephony:
    eslAddr: ""
    kamailioRpcUrl: ""

  # Mais variáveis para o ConfigMap (OLLAMA_URL, WEBAUTHN_RP_ID,
  # NODE_PEER_CAPACITY…). NUNCA segredos: esses vão no Secret.
  config: {}
  # Variáveis com valueFrom (chaves extra do Secret, p.ex. SMS_*_SMPP).
  extraEnv: []

  autoscaling:
    # Só é seguro com a afinidade por sala, que este chart põe sempre.
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    maxUnavailable: 1

# Gravações — um volume montado em TODAS as réplicas do servidor.
recordings:
  # Vazio = o chart cria o PVC `delonix-recordings`.
  existingClaim: ""
  size: 10Gi
  storageClassName: ""
  # ReadWriteOnce com mais de uma réplica é recusado (README §Gravações).
  accessMode: ReadWriteOnce
  # Só para um cluster de UM nó, onde RWO chega porque os pods partilham o nó.
  allowReadWriteOnceWithReplicas: false

# ------------------------------------------------------------
#  Web (SPA + nginx sem privilégios)
# ------------------------------------------------------------
web:
  image: { repository: delonix-web, tag: "", pullPolicy: IfNotPresent }
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  pdb:
    enabled: true
    maxUnavailable: 1

# ------------------------------------------------------------
#  Ingress (ingress-nginx — a afinidade por sala é uma anotação dele)
# ------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations: {}
  proxyTimeoutSeconds: 3600
  tls:
    # Um dos dois é obrigatório em produção:
    #  - clusterIssuer: o cert-manager emite para `secretName`;
    #  - existingSecret: um Secret kubernetes.io/tls que já existe.
    clusterIssuer: ""
    existingSecret: ""
    secretName: delonix-tls-secret
  # Serviço de transcrição de FORA do chart. Com `whisper.enabled` isto fica
  # vazio e a rota `/asr` sai do Service do chart (o render é o mesmo, o
  # destino é o `delonix-whisper`): são exclusivos, e o chart recusa os dois.
  # Lido pelo `gateway.yaml` mesmo com o Ingress desligado.
  asr:
    serviceName: ""
    servicePort: 8000

# ------------------------------------------------------------
#  NetworkPolicy do servidor: :8181/:9180 e a ponte só para o FreeSWITCH.
#  Precisa de um CNI que a aplique.
# ------------------------------------------------------------
networkPolicy:
  enabled: false
  sfuUdp: { min: 50000, max: 50200 }
  # Namespace do Prometheus que raspa o /metrics no :8181. Vazio = ninguém.
  metricsNamespace: monitoring
  # Mais origens para as portas internas (lista de `from` de NetworkPolicy),
  # p.ex. o ipBlock de um FreeSWITCH em hostNetwork ou fora do cluster.
  extraInternalFrom: []

# ------------------------------------------------------------
#  coturn — relay de media. UMA réplica, de propósito (hairpin; README §Media).
# ------------------------------------------------------------
coturn:
  enabled: true
  image: { repository: coturn/coturn, tag: "4.6", pullPolicy: IfNotPresent }
  # O IP por onde o browser E o servidor chegam ao coturn (o do LoadBalancer,
  # ou o do nó em hostNetwork). Obrigatório em produção. Fora de produção,
  # vazio = o IP do nó (hostNetwork) ou do pod.
  externalIP: ""
  # RELAY ATRÁS DE NAT: o IP do nó (ou do pod) onde o coturn ESCUTA, quando o
  # `externalIP` é um endereço público que não é dele — o do router que lhe
  # encaminha a 3478 e a gama de relay. O coturn passa a correr com
  # `--external-ip=<externalIP>/<privateIP>`: anuncia o público e sabe que é o
  # privado. Sem isto, dois relays do mesmo coturn só se falam se o router
  # fizer hairpin (medido em 2026-10-13 num coturn 4.6: com o mapa, 60 de 60
  # mensagens entre dois relays; sem ele, 0 de 60).
  privateIP: ""
  # Reconhecimento explícito de uma instalação SÓ PARA A REDE LOCAL: em
  # produção o chart recusa um `externalIP` privado (10/8, 172.16/12,
  # 192.168/16), porque quem está fora dessa rede junta-se à sala e fica sem
  # áudio nem vídeo — sem um erro. `true` diz que é isso que se quer.
  lanOnly: false
  realm: delonix
  port: 3478
  relayPorts: { min: 49152, max: 59152 }
  totalQuota: 5000
  # Igual a `resources.limits.cpu`: o coturn conta os CPUs do NÓ.
  relayThreads: 4
  # Laboratório de um nó sem LoadBalancer: o relay usa a rede do nó.
  hostNetwork: false
  service:
    type: LoadBalancer
    loadBalancerIP: ""
    annotations: {}
    externalTrafficPolicy: Cluster
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { cpu: "4", memory: 1Gi }
  nodeSelector: {}
  tolerations: []

# ------------------------------------------------------------
#  Gateway API — para clusters que servem por Gateway e não por ingress-nginx.
#
#  EXCLUSIVO do `ingress`: um ou outro, nunca os dois. O chart recusa ambos.
#
#  O que se GANHA: funciona em clusters sem ingress-nginx, e a precedência dos
#  caminhos é da especificação em vez de três objectos Ingress separados.
#  O que se PERDE: desligar o registo de acessos numa só rota. No Envoy o
#  access log é do Gateway, não da rota — ver `acceptProvisioningInAccessLog`.
# ------------------------------------------------------------
gateway:
  enabled: false
  # own    — cria um Gateway NESTE namespace. Gasta um IP do LoadBalancer, e
  #          só aceita rotas deste namespace (`allowedRoutes: from: Same`).
  # attach — cola-se a um Gateway existente, possivelmente noutro namespace.
  #          CUIDADO: esse Gateway tem de permitir rotas do nosso namespace.
  #          Medido a 2026-10-07: o Gateway do `ngolacloud-system` está em
  #          `from: Same` e NÃO as aceita — ligar-se a ele exigiria mudar o
  #          recurso de outro inquilino.
  mode: own
  # Obrigatório em mode=own. No `ngola-lda` a GatewayClass chama-se `delonix`.
  className: ""
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
  tls:
    # Um Secret kubernetes.io/tls que já existe...
    certificateRefName: ""
    # ...ou deixa o cert-manager emitir (precisa de `--enable-gateway-api`).
    clusterIssuer: ""
  affinity:
    # `envoy` — emite a BackendTrafficPolicy com ConsistentHash por `room`,
    #           que é o que mantém a invariante do ADR-0001.
    # `none`  — NÃO emite política nenhuma. A afinidade por sala DESAPARECE e
    #           os pares de uma sala caem em pods diferentes: é a regressão R3,
    #           «media num só sentido». O chart recusa isto em produção.
    implementation: envoy
  # R278: o caminho `/api/public/extension-provisioning` leva um bilhete de uso
  # único — uma credencial. O Ingress tinha uma rota dedicada só para desligar
  # o registo de acessos nela. Em Gateway API isso NÃO existe: o access log é
  # do Gateway. Com `gateway.enabled`, esse caminho vai para o log.
  #
  # Põe `true` para reconhecer e seguir. O chart recusa-se a instalar sem isto,
  # em vez de perder a protecção em silêncio.
  acceptProvisioningInAccessLog: false

# ------------------------------------------------------------
#  Voz — bordo SIP (Kamailio) e gateway de media (FreeSWITCH).
#  O PBX do cliente (Issabel/FreePBX) NÃO é instalado: é do cliente e vive
#  fora do cluster. Aqui só se declara por onde ele entra.
# ------------------------------------------------------------
voice:
  enabled: false

  # Allowlist de origens do bordo — o `address_file` do Kamailio
  # (voice/kamailio/kamailio.cfg, `allow_source_address("1")`).
  # Vazia = o bordo recusa TODAS as origens (403). Os IPs reais de um tronco
  # não se escrevem num ficheiro versionado.
  #   - { group: 1, ip: 203.0.113.10, mask: 32, port: 0, tag: pbx-cliente-a }
  trunks: []

  # A central (PBX) de uma organização — ADR-0016. Quem não está em `trunks`
  # só entra por TLS (5061) e autenticado por digest com a conta SIP dessa
  # organização («Registo SIP»); o bordo pede o HA1 ao servidor e o IVR procura
  # a sala nessa organização. Desligado, quem não está em `trunks` leva 403.
  centrais:
    enabled: false
    # De onde o BORDO fala para o FreeSWITCH (DELONIX_EDGE_CIDRS). O IVR só
    # acredita em «esta chamada é da central de X» vindo daqui. Com o bordo num
    # pod, é a rede de pods (ou o IP do nó, com hostNetwork); obrigatório.
    edgeCidrs: []

  kamailio:
    image: { repository: ghcr.io/kamailio/kamailio, tag: "5.8.6-bookworm", pullPolicy: IfNotPresent }
    # Liga o `-A WITH_XHTTP_RPC` (TELEPHONY_KAMAILIO_RPC_URL). O /rpc fica na
    # MESMA porta TCP 5060 do bordo — README §Achados antes de ligar.
    xhttpRpc: false
    hostNetwork: false
    tls:
      # Secret kubernetes.io/tls (tls.crt, tls.key). Obrigatório em produção.
      # Fora de produção, vazio = self-signed gerado e preservado.
      existingSecret: ""
    # O Service do BORDO — por onde o PBX do cliente entra (SIP 5060 UDP/TCP,
    # 5061 TLS). `Local` preserva o IP de origem, de que a allowlist depende.
    service:
      type: ClusterIP
      loadBalancerIP: ""
      annotations: {}
      externalTrafficPolicy: Local
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
    nodeSelector: {}
    tolerations: []

  freeswitch:
    # Produção: a imagem que o freeswitch-image.yml publica
    # (ghcr.io/<owner>/delonix-meet-freeswitch:1.11.3-<sha8>).
    image: { repository: delonix-meet/freeswitch, tag: "1.11.3", pullPolicy: IfNotPresent }
    hostNetwork: false
    ivrVoice: ""          # DELONIX_IVR_VOICE; vazio = pt/BR/karina
    ramaisSipPort: 5070
    # DELONIX_TRUNKS_RESCAN_SECS — de quanto em quanto tempo o FreeSWITCH volta
    # a ler os troncos do servidor (ADR-0009): um tronco criado na consola
    # regista-se sozinho, e um arranque com o servidor em baixo recupera.
    # 0 desliga. Sem `server.telephony.eslAddr` é o ÚNICO caminho, e só
    # acrescenta: um tronco alterado ou apagado fica como estava até um
    # reinício. Com ele, o servidor avisa o FreeSWITCH na hora (R300).
    trunksRescanSecs: 60
    # DELONIX_ESL_CIDRS — de onde o SERVIDOR fala para o Event Socket do
    # FreeSWITCH (8021). Só conta com `server.telephony.eslAddr`. Vazia, entram
    # todas as redes privadas (com a TELEPHONY_ESL_PASSWORD do Secret); com
    # redes, só essas. Quem lá entra manda em tudo (origina chamadas por
    # qualquer tronco): o mais estreito que a rede dos pods do servidor
    # permitir. Com `networkPolicy.enabled`, o 8021 fica além disso só para
    # esses pods — EXCEPTO em `hostNetwork`, onde a política não se aplica e o
    # ESL escuta nas interfaces do nó: aí o chart exige esta lista. Em
    # produção exige uma das duas (a política ou a lista).
    eslCidrs: []
    # DELONIX_EXTERNAL_IP — o endereço que o perfil dos ramais anuncia no SIP
    # e no SDP — e a gama RTP que se publica com ele.
    externalIP: ""
    rtp: { min: 20000, max: 20100 }
    # Service para ramais que se registam de FORA do cluster (5070/UDP).
    ramaisService:
      enabled: false
      type: LoadBalancer
      loadBalancerIP: ""
      annotations: {}
      externalTrafficPolicy: Local
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: "2", memory: 1Gi }
    nodeSelector: {}
    tolerations: []

  ramais:
    # DELONIX_RAMAIS_ACL — redes (CIDR) de onde um ramal se pode registar.
    # Vazia = a omissão do entrypoint (10/8, 172.16/12, 192.168/16).
    acl: []

  # PBX de cliente de LABORATÓRIO (Asterisk). Recusado em produção.
  labPbx:
    enabled: false
    image: { repository: delonix-meet/pbx-cliente, tag: "lab", pullPolicy: IfNotPresent }
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

# ------------------------------------------------------------
#  A IA in-cluster (templates/ai.yaml).
#
#  DESLIGADOS os dois por omissão: nem um laboratório nem uma instalação de
#  terceiros têm de carregar um LLM de 5,5GB e um ASR de 2GB para o Meet
#  servir reuniões. Sem eles o produto degrada por desenho, e diz a verdade:
#  a ata fica pela versão por regras (feita no cliente) e as legendas pelo
#  motor do browser.
# ------------------------------------------------------------

# LLM local — resumo da ata (MoM) e tradução das legendas. `server/src/ai.rs`.
#
# Ligado, o chart escreve o OLLAMA_URL no ConfigMap e aponta-o a este Service:
# o servidor nunca fala com um LLM de fora do cluster.
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    # Fixada por versão: artefacto imutável (doutrina do repo). A 0.40.2 é a
    # última estável confirmada a 2026-10-09 (ADR-0024).
    tag: "0.40.2"
    pullPolicy: IfNotPresent
  # Os modelos que o pod puxa no arranque, e os que o servidor pede.
  #
  # O par de 2026-10-13, decidido pelo dono SEM GPU no cluster: o 7b escreve a
  # ata (trabalho em lote, minutos em CPU, ninguém à espera) e o 1.5b traduz a
  # legenda (tempo real, no limite em CPU). Mudar aqui muda o que se puxa E o
  # que o servidor pede: são a mesma lista.
  models: ["qwen2.5:1.5b", "qwen2.5:7b"]
  modelSummary: "qwen2.5:7b"
  modelTranslate: "qwen2.5:1.5b"
  # Tarefas do Estúdio. Vazio = o mesmo do resumo (server/src/config.rs).
  modelStudio: ""
  # Tecto de uma tarefa do Estúdio em segundos (OLLAMA_TIMEOUT_SECS, 5..900).
  # Em CPU, 120 s não chegam a um resumo do 7b: 600 dá-lhe margem.
  timeoutSeconds: 600
  # A ATA (MoM): a janela de transcrição que entra no prompt, em caracteres, e
  # o tecto da chamada. A janela DECIDE o `num_ctx` que o servidor pede — são
  # a mesma decisão (`ai.rs::num_ctx_para`), e separá-las era o defeito: sem
  # `num_ctx`, o Ollama cortava o prompt em silêncio e a ata saía de ~2 048
  # tokens dos ~6 900 que a janela de 24 000 caracteres produz.
  #
  # ENCURTAR A JANELA É A MAÇANETA DE UM CPU LENTO, e o número que a justifica
  # é medido: as VMs desta produção vêem um vCPU `x86-64-v2` (sem AVX2, ver
  # `delonix-deploy/tofu/modules/vm/main.tf`) e o modelo processa prompt a
  # **0,59 tokens/s**. A 24 000 caracteres são mais de três horas só para ler
  # o prompt — a ata expira sempre. Com GPU, ou com vCPU `v3`, isto volta ao
  # que é: a janela cheia em minutos.
  momWindowChars: 24000
  momSummaryTimeoutSeconds: 600
  # Quantos modelos ficam carregados ao mesmo tempo. 2 = o da ata e o da
  # legenda, para que uma legenda não descarregue o modelo da ata (e o
  # contrário). Custa memória: é o que os 8Gi de limit abaixo cobrem.
  maxLoadedModels: 2
  keepAlive: 30m
  # Quanto tempo o Kubernetes dá ao Deployment para progredir antes de o dar
  # por falhado. A omissão (600 s) NÃO chega: medido a 2026-10-13 na primeira
  # instalação em produção, o nó não acabou de puxar os 3,5GB da imagem nesse
  # prazo e o `helm upgrade --wait` desistiu com o release em `failed` — com
  # tudo aplicado e o pod a puxar por trás. 2700 s = 45 minutos, que cobre uma
  # ligação má sem esconder uma avaria a sério.
  #
  # Quem serve a imagem de um registo na própria rede (recomendado, e é o que o
  # `delonix-server` e a `delonix-web` já fazem) pode baixar isto.
  progressDeadlineSeconds: 2700
  # Tentativas do puxão no arranque, de 10 em 10 s. 60 = 10 minutos de rede
  # intermitente antes de desistir (sem matar o pod: ver templates/ai.yaml).
  pullRetries: 60
  # ~5,5GB de modelos (1,0 + 4,7) mais margem para trocar de modelo sem
  # reinstalar. O PVC é RWO e há UM pod.
  storage: 10Gi
  storageClassName: ""
  # Uid não privilegiado qualquer: a imagem não tem utilizador próprio, e o
  # volume chega-lhe pelo fsGroup (ver templates/ai.yaml).
  runAsUser: 1000
  resources:
    # O request é baixo de propósito: fora de uma reunião o Ollama não faz
    # nada, e num cluster partilhado reservar 4 CPU para esperar é tirá-los a
    # quem os usa. O limit é o tecto de quando está a gerar.
    requests: { cpu: 250m, memory: 2Gi }
    limits: { cpu: "4", memory: 8Gi }
  priorityClassName: ""
  # GPU (ADR-0024): com hardware, é aqui que ele entra — nodeSelector,
  # toleration e runtimeClass. Os limits de `nvidia.com/gpu` põem-se em
  # `resources.limits`. Vazio = CPU, que é o que o cluster tem hoje.
  nodeSelector: {}
  tolerations: []
  runtimeClassName: ""

# ASR soberano (`whisper-server/`) — as legendas da sala sem passar pela Web
# Speech do Chrome, que envia o áudio para a Google.
#
# A IMAGEM NÃO SAI DO `make image`: embute o modelo (~2GB) e constrói-se com
# `BUILD_WHISPER=1 deploy/build-images.sh`. Por isso tem repositório e tag
# PRÓPRIOS — não acompanham a tag do servidor e da web, que mudam a cada
# commit.
whisper:
  enabled: false
  replicas: 1
  image:
    repository: delonix-whisper
    tag: ""
    pullPolicy: IfNotPresent
  # base|small|medium|large-v3 — tem de ser o modelo EMBUTIDO na imagem
  # (`--build-arg MODEL=`). `small` int8 é o aceitável em CPU.
  model: small
  device: cpu
  compute: int8
  # O uid do `whisper-server/Dockerfile`.
  runAsUser: 65532
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "4", memory: 4Gi }
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []

# Rastos por OTLP (ADR-0020, fase 5). Vazio = desligado, que é o que um
# laboratório quer: sem colector, nada a exportar.
otel:
  endpoint: ""

# ResourceQuota e LimitRange do namespace (templates/quota.yaml).
#
# DESLIGADA por omissão: os números são a escala do `values-production.yaml`, e
# num laboratório de um nó ou num cluster dedicado seriam um tecto inventado.
# O `values-production.yaml` liga-a, porque o ADR-0021 pôs a produção num
# cluster PARTILHADO e sem quota um pico do Meet come o que é dos vizinhos.
#
# A conta está escrita no topo do `templates/quota.yaml`: é o pico com o HPA no
# máximo MAIS o surge do rollout (34,6 CPU / 34,1 Gi medidos no render), com
# ~20% de folga. QUEM MUDAR RÉPLICAS OU LIMITES REFAZ A CONTA — e o
# `check-helm.sh` recalcula-a do render e falha se a quota não a cobrir.
quota:
  enabled: false
  # Chart + plataforma no mesmo namespace (Postgres e Redis do
  # deploy/k8s/plataforma). A conta está no topo de templates/quota.yaml e o
  # `check-helm.sh` refá-la a partir do render e dos ficheiros da plataforma.
  requests:
    cpu: "13"
    memory: 28Gi
  limits:
    cpu: "62"
    memory: 80Gi
  maxPods: "40"
  # 12 e não 9 (os 8 da conta + 1): a 2026-10-13 o namespace de produção tinha
  # 10 PVCs vivos, e TRÊS deles — `redis-data-redis-node-0/1/2` — são órfãos
  # da topologia de Sentinel que saiu a 2026-10-11 (os pods são
  # `redis-master-0` e `redis-replicas-0/1`). Com o tecto em 10, o PVC do
  # Ollama era RECUSADO pela admissão, e o sintoma seria o pod em Pending.
  # Quem apagar os órfãos pode baixar isto; apagar um PVC em produção é ordem
  # do dono, não efeito secundário de um upgrade.
  maxPvcs: "12"
  maxLoadBalancers: "2"
  container:
    # Para o que aterra no namespace SEM `resources` — um pod de depuração, um
    # Job avulso. Os pods do chart já os declaram todos.
    defaultRequest: { cpu: 100m, memory: 128Mi }
    defaultLimit: { cpu: "1", memory: 1Gi }
    # Barra por contentor: um zero a mais no `values` não esgota a quota num
    # pod. Acima do maior que temos — o coturn, com 4 CPU, e o Postgres da
    # plataforma, com 8Gi — e se ficasse IGUAL, a admissão passava a rejeitar
    # um deles no primeiro aumento.
    max: { cpu: "6", memory: 10Gi }

# Prioridade de agendamento dos pods — VAZIO por omissão, de propósito.
#
# Num cluster PARTILHADO (ADR-0021) é isto que decide quem é desalojado quando
# um nó aperta: sem prioridade, o SFU e o Postgres são tão desalojáveis como
# qualquer coisa. MAS o nome da classe é do operador do cluster, e um
# `priorityClassName` que não exista no cluster faz o API server **recusar o
# pod** — por isso o chart nunca inventa um nome.
#
# Este valor é o default para os oito workloads. Para dar mais prioridade ao
# caminho da chamada do que ao resto, basta sobrepor por workload:
#
#   --set priorityClassName=meet-normal \
#   --set server.priorityClassName=meet-critico \
#   --set postgresql.priorityClassName=meet-critico \
#   --set coturn.priorityClassName=meet-critico
#
# As classes `system-cluster-critical` e `system-node-critical` são do
# Kubernetes e, por omissão, só se usam no `kube-system` — não servem aqui.
priorityClassName: ""
