# ============================================================
#  Produção — meet.ngolacloud.com
#
#  Este ficheiro fixa a TOPOLOGIA. O que é próprio de cada instalação entra
#  por --set ou por um ficheiro privado, e o chart FALHA se faltar:
#
#    helm upgrade --install meet deploy/helm/delonix-meet -n ngolacloud-meet \
#      -f deploy/helm/delonix-meet/values-production.yaml \
#      --set image.tag=<git describe> \
#      --set secrets.existingSecret=<nome do Secret> \
#      --set coturn.externalIP=<IP público do relay> \
#      --set server.image.repository=<registo>/delonix-server \
#      --set web.image.repository=<registo>/delonix-web
#
#  Não há aqui nenhum segredo, nenhum IP real e nenhuma tag.
# ============================================================
production: true
host: meet.ngolacloud.com
edition: saas

# OBRIGATÓRIO por --set: a tag `git describe` das imagens publicadas.
image:
  tag: ""

# OBRIGATÓRIO por --set: o Secret criado fora do chart (README §Segredos).
secrets:
  existingSecret: ""

# Postgres e Redis: externos. O DATABASE_URL (e o REDIS_URL, que leva
# password) vêm do Secret.
externalRedis:
  fromSecret: true

server:
  # O caminho da chamada: desalojar o SFU derruba reuniões a decorrer.
  # O Job de migração herda esta classe (bloqueia o release).
  priorityClassName: meet-critico
  replicas: 3
  migrations:
    mode: job
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  # Armazenamento de OBJECTOS (ADR-0020, D2). Entra pelo ambiente e não pela
  # tabela `platform_storage`: as chaves são um Secret do cluster, e guardá-las
  # na base da aplicação é o que a S5 mandou parar de fazer.
  #
  # Com isto, o botão «testar» do painel do operador escreve e apaga um objecto
  # de prova no MinIO. O que ele NÃO faz ainda é mudar onde as gravações ficam:
  # elas continuam no volume abaixo, e o painel diz isso em letra grande. Ver o
  # ADR-0020 e o `objectos.rs`.
  extraEnv:
    - name: OBJECT_STORE_ENDPOINT
      value: "http://minio.minio.svc.cluster.local:9000"
    - name: OBJECT_STORE_BUCKET
      value: "meet-gravacoes"
    - name: OBJECT_STORE_REGION
      value: "us-east-1"
    # O MESMO Secret que o chart do MinIO consome (`meet-minio-credenciais`),
    # copiado para este namespace — um Secret não se lê de outro namespace.
    - name: OBJECT_STORE_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: meet-minio-credenciais, key: ACCESS_KEY_ID }
    - name: OBJECT_STORE_SECRET_KEY
      valueFrom:
        secretKeyRef: { name: meet-minio-credenciais, key: SECRET_ACCESS_KEY }

# Várias réplicas em vários nós: o volume tem de ser ReadWriteMany.
# A StorageClass é da infra-estrutura; vazia = a por omissão do cluster,
# que tem de suportar RWX.
#
# ISTO AINDA É NECESSÁRIO, e o ADR-0020 diz porquê: o cliente de objectos já
# existe (`objectos.rs`) mas o gravador continua a escrever aqui e o servidor a
# servir daqui. O RWX só sai destes valores no dia em que o caminho da media
# for ligado ao MinIO e medido contra ele — não no dia em que o cliente nasceu.
recordings:
  accessMode: ReadWriteMany
  storageClassName: ""
  size: 100Gi

web:
  replicas: 3

# ------------------------------------------------------------
#  A ENTRADA — Gateway API, e não Ingress.
#
#  O ADR-0021 pôs esta produção no `ngola-lda`, e esse cluster NÃO TEM
#  IngressClass nenhuma: serve por Envoy Gateway, GatewayClass `delonix`
#  (medido a 2026-10-11: `kubectl get ingressclass` devolve «No resources
#  found»). Um Ingress aqui criava um objecto que nada programa — e o sintoma
#  seria um host que não responde, sem erro em sítio nenhum.
# ------------------------------------------------------------
ingress:
  enabled: false
  # Lido pelo `gateway.yaml` mesmo com o Ingress desligado: com nome, o /asr é
  # encaminhado para o serviço de transcrição. Vazio = sem rota /asr.
  asr:
    serviceName: ""

gateway:
  enabled: true
  # `attach` E NÃO `own`, e a razão é o router e não o Kubernetes.
  #
  # Com `own` o Gateway pede um IP à gama do MetalLB (`192.168.1.73-100`) e
  # recebe o seguinte livre — o `.74`. O router da instalação encaminha 80/443
  # para UM endereço, e esse endereço é o `.73` do Gateway da plataforma: o
  # `.74` nunca vê tráfego de fora. Um Gateway próprio ficaria PROGRAMMED,
  # verde, e invisível da internet.
  #
  # Colar-se ao `.73` exige que ESSE Gateway aceite rotas deste namespace: ele
  # nasce em `allowedRoutes: from: Same` e o role `gateway_api` do
  # `delonix-deploy` passou-o a um selector por rótulo. Sem isso as HTTPRoutes
  # ficam `Accepted=False` com `NotAllowedByListeners` — visível em
  # `kubectl -n ngolacloud-meet describe httproute delonix-meet`.
  mode: attach
  parentRef:
    name: delonix
    namespace: delonix-system
  # Sem `tls` nenhum, de propósito: quem termina o TLS é o listener do Gateway
  # da plataforma, com o certificado `delonix-wildcard-tls` — que já cobre
  # `meet.ngolacloud.com` e `meet.ngolacloud.ao` (18 nomes, verificado a
  # 2026-10-11). Pedir aqui um certificado novo era um segundo desafio ACME
  # para um nome que já está emitido.
  affinity:
    # A `BackendTrafficPolicy` com ConsistentHash por `room` — é o que mantém
    # a invariante do ADR-0001 e o portão recusa `none` em produção.
    implementation: envoy
  # R278 reconhecido: em Gateway API o registo de acessos é do GATEWAY e não da
  # rota, logo o `/api/public/extension-provisioning` — que leva um bilhete de
  # uso único — entra no log do Gateway da plataforma. O Ingress tinha uma rota
  # dedicada só para o desligar e isso não tem equivalente aqui. Fica DITO em
  # vez de perdido em silêncio.
  acceptProvisioningInAccessLog: true

networkPolicy:
  enabled: true
  # O Prometheus desta produção vive em `observabilidade`, não em `monitoring`
  # (deploy/k8s/observabilidade/instalar.sh). Sem isto a política fechava o
  # :8181 ao scrape, o ServiceMonitor ficava com o alvo em baixo e TODOS os
  # alertas sobre métricas do servidor ficavam sem dados — a falhar em silêncio,
  # que é a pior maneira de uma observabilidade falhar.
  metricsNamespace: observabilidade

# Rastos por OTLP (ADR-0020, fase 5). Vazio = o servidor arranca sem rastos,
# exactamente como antes. Com endereço, exporta para o colector — e se ele
# estiver em baixo o servidor arranca na mesma, com um aviso no log: perde-se
# observabilidade, não o serviço.
otel:
  endpoint: "http://otel-collector-opentelemetry-collector.observabilidade.svc.cluster.local:4317"

coturn:
  # Sem relay não há media atrás de NAT: é caminho da chamada.
  priorityClassName: meet-critico
  # OBRIGATÓRIO por --set: coturn.externalIP.
  externalIP: ""
  service:
    type: LoadBalancer

# A voz fica desligada até os achados do README §«Voz em produção» terem
# dono: o chart sabe instalá-la, mas o caminho de um PBX externo não foi medido.
voice:
  enabled: false

# Cluster partilhado (ADR-0021): a quota do namespace é obrigatória aqui. Os
# números por omissão estão dimensionados para ESTA escala — ver a conta no
# topo de `templates/quota.yaml`.
quota:
  enabled: true

# Prioridade de agendamento (ADR-0021: cluster PARTILHADO).
#
# PRÉ-REQUISITO: as duas classes têm de existir no cluster ANTES deste release —
# um `priorityClassName` que não exista faz o API server RECUSAR o pod, e o
# `helm upgrade` falha. Aplicam-se com
# `deploy/k8s/plataforma/priorityclasses.yaml`, que é o PRIMEIRO passo do
# `instalar.sh` dessa pasta.
#
# Este é o default; o `server` e o `coturn` sobrepõem-no com `meet-critico`
# (ver lá acima). O Postgres e o Redis não aparecem aqui porque em produção são
# EXTERNOS — o chart não os instala, e configurá-los aqui era config morta.
priorityClassName: meet-normal
