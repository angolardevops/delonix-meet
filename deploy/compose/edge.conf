# Borda do `compose.yaml`: o papel do ingress, numa máquina só.
# TLS em 8443 (rootless não escuta em 443); 8080 só redirecciona.
#
# É um MODELO: a imagem do nginx passa-o pelo envsubst ao arrancar e só troca
# ${NGINX_LOCAL_RESOLVERS} (o DNS da rede do compose, lido do resolv.conf).
#
# Os destinos vão numa variável para o nginx os resolver A CADA PEDIDO. Com o
# nome escrito no proxy_pass, o nginx resolve-o uma vez, ao arrancar: recriar
# só o servidor dava-lhe outro IP e a borda respondia 502 até ser recriada.
resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name meet.ngolacloud.local;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploads de gravações: o servidor impõe o seu próprio tecto.
    client_max_body_size 600m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Sinalização e tudo o que é WebSocket: ligações longas.
    location ~ ^/(ws|rtc) {
        set $destino http://delonix-server:8180;
        proxy_pass $destino;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # QR do Linphone (R278): o caminho leva o bilhete de uso único — a credencial.
    # Não se regista: sem isto o token ficava escrito no access log.
    location /api/public/extension-provisioning/ {
        proxy_pass http://delonix-server:8180;
        access_log off;
    }

    location /api {
        set $destino http://delonix-server:8180;
        proxy_pass $destino;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        set $destino http://delonix-web:8080;
        proxy_pass $destino;
    }
}

# ---- Kamailio: interface web de gestão (xhttp_rpc) -------------------------
# O módulo não tem autenticação: quem a exige é esta borda.
server {
    listen 8444 ssl;
    http2 on;
    server_name meet.ngolacloud.local;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    auth_basic           "Kamailio (laboratorio)";
    auth_basic_user_file /etc/nginx/voice.htpasswd;

    location = / { return 302 /rpc/; }
    location /rpc {
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection close;
        # A password da borda fica na borda: o Kamailio não precisa dela e
        # escreveria o cabeçalho no log se rejeitasse o pedido.
        proxy_set_header Authorization "";
        set $destino http://delonix-kamailio:5060;
        proxy_pass $destino;
    }
}

# ---- PBX de cliente: interface HTTP do Asterisk (ARI) -----------------------
# A autenticação é a do próprio ARI (utilizador «admin»), por isso a borda não
# acrescenta outra — as duas disputariam o mesmo cabeçalho Authorization.
server {
    listen 8445 ssl;
    http2 on;
    server_name meet.ngolacloud.local;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    location = / { return 302 /ari/api-docs/resources.json; }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $destino http://delonix-pbx:8088;
        proxy_pass $destino;
    }
}
