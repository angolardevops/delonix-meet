# Borda do `compose.yaml`: o papel do ingress, numa máquina só.
# TLS em 8443 (rootless não escuta em 443); 8080 só redirecciona.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name meet.ngolacloud.local;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploads de gravações: o servidor impõe o seu próprio tecto.
    client_max_body_size 600m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Sinalização e tudo o que é WebSocket: ligações longas.
    location ~ ^/(ws|rtc) {
        proxy_pass http://delonix-server:8180;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api {
        proxy_pass http://delonix-server:8180;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://delonix-web:8080;
    }
}
