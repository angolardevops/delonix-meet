# Delonix Whisper — ASR streaming soberano (whisper-server/). Substitui o
# whisper-tiny WASM do browser por um Whisper maior no servidor: precisão muito
# superior e o áudio nunca sai do datacenter (sem Web Speech/Google).
#
# CPU por defeito (modelo `small` int8 — aceitável em CPU). Em produção com GPU,
# ver o role Ansible (whisper_gpu=true) ou trocar image/env por CUDA + large-v3.
#
# Build: `BUILD_WHISPER=1 deploy/build-images.sh` (o `make image` NÃO constrói
# esta imagem — embute o modelo, ~2GB).
#
# EM PRODUÇÃO NÃO É ESTE O CAMINHO: a produção é servida pelo chart Helm
# (ADR-0021), onde isto é `whisper.enabled` e a rota /asr sai do mesmo valor —
# `deploy/helm/delonix-meet/templates/ai.yaml`.
#
# O modelo vem EMBUTIDO na imagem (o cluster kind é offline: os pods não têm
# DNS/internet, logo o download do modelo no arranque falharia). Sem PVC — a
# imagem é auto-contida. Trocar de modelo = rebuild com --build-arg MODEL=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delonix-whisper
  namespace: ngolacloud-meet
  labels:
    app: delonix-whisper
spec:
  replicas: 1
  strategy:
    type: Recreate # 1 réplica CPU-pesada; evita 2 pods a competir por CPU
  selector:
    matchLabels:
      app: delonix-whisper
  template:
    metadata:
      labels:
        app: delonix-whisper
    spec:
      securityContext:
        # MEDIDO a 2026-10-09, não assumido. O modelo vem EMBUTIDO na imagem
        # (`/models`, pelo build) e o `app.py` não escreve em disco nenhum —
        # logo basta dar-lho a ler, e o Dockerfile faz o `chown` para este uid.
        # Provado com o motor, `--user 65532:65532`: «MODELO CARREGADO como uid
        # 65532», o uvicorn arranca e o `/health` devolve
        # `{"ok":true,"model":"small","device":"cpu"}`.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: whisper
          image: delonix-whisper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # O /asr valida o MESMO access token do /rtc (auth.rs, HS256),
            # porque está no mesmo ingress público e antes aceitava qualquer
            # ligação sem autenticação nenhuma.
            #
            # A CHAVE VEM DO SECRET, por chave. Até 2026-10-13 estava escrito
            # aqui `envFrom: configMapRef: delonix-config` — e os segredos
            # saíram desse ConfigMap a 2026-10-04 (ver o cabeçalho do
            # 01-config.yaml). O whisper ficava com JWT_SECRET vazio e, por
            # ser fail-closed (`whisper-server/app.py:46`), RECUSAVA todas as
            # ligações: o browser caía em silêncio para o motor local e
            # ninguém via um erro.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: delonix-secrets, key: JWT_SECRET }
            - { name: WHISPER_MODEL, value: "small" }   # base|small|medium|large-v3
            - { name: WHISPER_DEVICE, value: "cpu" }     # cuda em GPU
            - { name: WHISPER_COMPUTE, value: "int8" }   # float16 em GPU
            - { name: HF_HOME, value: "/models" }
          # O 1º arranque descarrega o modelo (~0.5–1.5GB) para o PVC.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: delonix-whisper
  namespace: ngolacloud-meet
spec:
  selector:
    app: delonix-whisper
  ports:
    - port: 8000
      targetPort: 8000
