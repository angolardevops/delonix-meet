# Worker de IA server-side agendável em GPU — OPT-IN (fora da kustomization).
#
# CONTEXTO: a IA em tempo real (matting RVM, segmentação, transcrição ao vivo)
# corre no CLIENTE (WebGPU/WASM no browser) — o backend NÃO precisa de GPU para
# isso. Este worker faz IA em LOTE no servidor: reserva gravações pelo gRPC
# interno (TranscriptionService, ADR-0006 §3), transcreve-as com faster-whisper
# na GPU e entrega a transcrição + a ATA (MoM) ao servidor, que aplica o DLP e
# grava. O worker NÃO tem credenciais da base. Implementação: ai-worker/ (Python).
#
# Pré-requisitos no cluster:
#   - Um overlay aplicado (deploy/k8s-overlays/{saas,enterprise}): é ele que abre
#     o gRPC :9180 no Service delonix-server-internal, a NetworkPolicy que deixa
#     entrar `app: delonix-ai-worker`, e o Issuer `delonix-meet-internal` de que
#     o Certificate abaixo precisa. Sem overlay (só a base) não há gRPC.
#   - Pool de nós com GPU NVIDIA + NVIDIA device plugin (expõe nvidia.com/gpu).
#   - runtimeClass "nvidia" e (recomendado) taint dedicado nos nós GPU.
#   - PVC `recordings` (ReadWriteMany) partilhado com o backend, e `ai-models`
#     para persistir o modelo (~3GB) entre reinícios.
#
#   BUILD_AI_WORKER=1 deploy/build-images.sh   (contexto = raiz: os stubs saem de server/proto)
#   kubectl apply -f deploy/k8s/60-ai-gpu-worker.yaml
#
# Modo legado (DEPRECADO): sem DELONIX_GRPC_ADDR e com DATABASE_URL o worker
# volta a escrever directamente no Postgres, CONTORNANDO o DLP e as reservas.
# Não se usa aqui; existe só para instalações sem o gRPC interno.
---
# Certificado de CLIENTE do mTLS, emitido pela mesma CA interna que assina o do
# servidor (grpc-mtls.yaml). O cert-manager roda-o sozinho — sem passo manual.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: delonix-ai-worker-grpc
  namespace: delonix-meet
spec:
  secretName: delonix-ai-worker-grpc-tls
  duration: 2160h    # 90 dias
  renewBefore: 360h  # 15 dias
  commonName: delonix-ai-worker
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: delonix-meet-internal
    kind: Issuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delonix-ai-worker
  namespace: delonix-meet
  labels: { app: delonix-ai-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: delonix-ai-worker } }
  template:
    metadata: { labels: { app: delonix-ai-worker } }
    spec:
      runtimeClassName: nvidia # usa o NVIDIA container runtime (se configurado)
      # Só agenda em nós com GPU:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Tolera o taint típico dos pools de GPU:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # o uid da imagem (ai-worker/Dockerfile)
        # O Secret do mTLS monta como root:fsGroup 0440 — sem fsGroup o worker
        # não lê a própria chave. OnRootMismatch evita o chown recursivo do PVC.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/OWNER/delonix-ai-worker:latest
          # Sem envFrom de delonix-secrets: o worker não tem DATABASE_URL (ADR-0006 §3).
          env:
            - { name: DELONIX_GRPC_ADDR, value: "delonix-server-internal:9180" }
            - { name: GRPC_CLIENT_CERT, value: /etc/delonix/grpc-tls/tls.crt }
            - { name: GRPC_CLIENT_KEY, value: /etc/delonix/grpc-tls/tls.key }
            - { name: GRPC_CA, value: /etc/delonix/grpc-tls/ca.crt }
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Sem renovação no contrato: cobre a gravação mais longa (máx. 7200).
            - { name: LEASE_SECONDS, value: "3600" }
            - { name: RECORDINGS_DIR, value: /recordings }
            - { name: WHISPER_MODEL, value: large-v3 }
            - { name: WHISPER_DEVICE, value: cuda }
            - { name: WHISPER_COMPUTE, value: float16 }
            - { name: HF_HOME, value: /models }
            # O batimento: o único sinal de vida que este worker tem (não serve
            # HTTP, não tem Service). As sondas abaixo leem ESTE caminho pela
            # variável, não por um literal repetido.
            - { name: HEARTBEAT_FILE, value: /tmp/batimento }
          # `startupProbe`: espera que o batimento APAREÇA. O ficheiro só nasce
          # depois do modelo estar carregado, e o primeiro arranque descarrega o
          # large-v3 (~3 GB) para o PVC `ai-models`. 10 s × 180 = **30 minutos**
          # de folga; sem isto a liveness matava o pod a meio da descarga, e o
          # pod seguinte recomeçava a descarga — para sempre.
          startupProbe:
            exec: { command: ["sh", "-c", 'test -f "$HEARTBEAT_FILE"'] }
            periodSeconds: 10
            failureThreshold: 180
          # `livenessProbe`: já arrancou, agora conta a IDADE do batimento. O
          # pulso vem do PROGRESSO (uma volta do ciclo, cada segmento que o
          # faster-whisper produz — ver ai-worker/batimento.py), e é por isso que
          # isto detecta um worker PENDURADO: com um batimento por relógio, um
          # CUDA travado continuaria a tocar o ficheiro e a sonda não provaria
          # nada. 600 s cobre a maior folga legítima entre pulsos — o VAD antes
          # do primeiro segmento de uma gravação longa. 3 × 60 s ⇒ reinício
          # depois de ~12 min sem progresso.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y "$HEARTBEAT_FILE") )) -lt 600
            periodSeconds: 60
            failureThreshold: 3
          # SEM readinessProbe, de propósito: este worker não tem Service e não
          # recebe tráfego — não há de onde o tirar. A readiness aqui seria um
          # campo preenchido para o portão ver, e não para servir de nada.
          resources:
            # A GPU é um recurso agendável: 1 GPU inteira por pod.
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "12Gi"
            requests:
              cpu: "500m"
              memory: "4Gi"
          volumeMounts:
            - { name: recordings, mountPath: /recordings, readOnly: true }
            - { name: models, mountPath: /models }
            - { name: grpc-tls, mountPath: /etc/delonix/grpc-tls, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
      volumes:
        # MESMO volume onde o backend grava as gravações (RWX: NFS/CephFS/EFS…).
        - name: recordings
          persistentVolumeClaim: { claimName: recordings }
        # Cache do modelo faster-whisper (~3GB) — evita re-descarregar.
        - name: models
          persistentVolumeClaim: { claimName: ai-models }
        # Certificado de cliente mTLS (Certificate delonix-ai-worker-grpc acima).
        - name: grpc-tls
          secret:
            secretName: delonix-ai-worker-grpc-tls
            defaultMode: 0440 # legível pelo fsGroup, não pelo mundo
---
# Autoscale por profundidade de fila (ex.: KEDA) faz mais sentido que CPU para
# lotes. Exemplo com HPA de CPU (simples) — trocar por KEDA ScaledObject se
# usares uma fila de trabalhos:
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: delonix-ai-worker, namespace: delonix-meet }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: delonix-ai-worker }
  # HPA só escala a zero com o feature-gate HPAScaleToZero (alpha). Para
  # escala-a-zero real numa fila de lotes, usar KEDA (ScaledObject). Default: 1.
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
