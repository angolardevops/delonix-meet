# Backend (axum + SFU). ATENÇÃO: o SFU e o rate-limit são EM MEMÓRIA por pod
# (ver server/src/rate_limit.rs). Logo, todos os participantes de uma sala têm
# de aterrar NO MESMO pod. Por omissão corre com 1 réplica (correto e simples);
# o autoscale horizontal deste tier exige encaminhamento por-sala (ver
# 21-server-hpa.yaml + README). O tier WEB é que escala livremente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delonix-server
  namespace: delonix
  labels: { app: delonix-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: delonix-server }
  template:
    metadata:
      labels: { app: delonix-server }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: ghcr.io/OWNER/delonix-server:latest # sobrescrito pela kustomization
          ports:
            - { name: http, containerPort: 8180 }
          envFrom:
            - configMapRef: { name: delonix-config }
            - secretRef: { name: delonix-secrets }
          # fail-closed: SEM DELONIX_ALLOW_INSECURE — segredos fortes obrigatórios.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "2", memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: delonix-server
  namespace: delonix
  labels: { app: delonix-server }
spec:
  selector: { app: delonix-server }
  ports:
    - { name: http, port: 8180, targetPort: http }
---
# Service dedicado ao /ws (mesmos pods, backend distinto no ingress) — necessário
# para o consistent-hash por sala se aplicar só ao /ws. Ver 40-ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: delonix-server-ws
  namespace: delonix
  labels: { app: delonix-server }
spec:
  selector: { app: delonix-server }
  ports:
    - { name: http, port: 8180, targetPort: http }
