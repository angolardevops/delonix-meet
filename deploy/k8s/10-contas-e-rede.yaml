# ---------------------------------------------------------------------------
#  Contas de serviço e política de rede (boas práticas de k8s).
#
#  PORQUE EXISTE. Medido a 2026-10-07: o `deploy/k8s/` tinha `resources` nas
#  onze cargas e sondas em quase todas — mas **zero ServiceAccount** e **zero
#  NetworkPolicy**. Tudo corria na conta `default`, com o token da API do
#  Kubernetes montado em cada pod, e qualquer pod do namespace falava com
#  qualquer outro. O chart de produção já tinha duas NetworkPolicy; este
#  caminho não tinha nenhuma.
#
#  AS CONTAS. Uma por carga, todas com `automountServiceAccountToken: false`:
#  nenhuma destas cargas fala com a API do Kubernetes. Um token montado num pod
#  que não precisa dele é só superfície — é o primeiro que se usa quando se
#  entra num contentor.
#
#  A REDE. Uma política de omissão que FECHA a entrada no namespace, e depois o
#  que cada carga precisa. Uma NetworkPolicy que selecciona um pod fecha tudo o
#  que não estiver listado — por isso a ordem destas regras não é decorativa.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata: { name: delonix-server, namespace: ngolacloud-meet }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: delonix-web, namespace: ngolacloud-meet }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: delonix-data, namespace: ngolacloud-meet }
automountServiceAccountToken: false
---
# Nada entra, salvo o que as regras seguintes abrirem. Sem isto, as políticas
# abaixo seriam decorativas: o k8s só fecha o que alguma política selecciona.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fecha-a-entrada
  namespace: ngolacloud-meet
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Quem pode falar com os pods do delonix-server.
#
# Uma NetworkPolicy que selecciona um pod FECHA tudo o que não estiver listado,
# por isso as regras 1 e 2 são tão importantes como a 3 e a 4:
#
#   1. :8180/TCP de qualquer origem — o ingress-nginx (/api, /rtc, /ws) e os
#      Services da base. Igual a hoje.
#   2. UDP 50000-50200 de qualquer origem — a media do SFU (SFU_UDP_MIN/MAX).
#      Com FORCE_TURN_RELAY=1 chega do coturn; sem esta regra a sala liga e o
#      vídeo fica preto (a regressão R4, por outro caminho).
#   3. :8181 e :9180 só a partir dos consumidores internos, no mesmo namespace:
#      voz (FreeSWITCH), ai-worker e whisper.
#   4. :8181 a partir do namespace `monitoring` (scrape do /metrics).
#
# FreeSWITCH FORA do cluster (o caso comum hoje, instalado por host): uma
# NetworkPolicy não o vê por label. Acrescentar uma regra `ipBlock` com o IP do
# host de voz, num overlay próprio — nunca abrir o :8181 a `from: []`.
#
# Só `Ingress` em policyTypes: a saída (Postgres, Redis, Ollama, coturn) não é
# restringida aqui.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: delonix-server
  namespace: ngolacloud-meet
spec:
  podSelector:
    matchLabels:
      app: delonix-server
  policyTypes:
    - Ingress
  ingress:
    # 1. HTTP público (via ingress-nginx)
    - ports:
        - protocol: TCP
          port: 8180
    # 2. media do SFU
    - ports:
        - protocol: UDP
          port: 50000
          endPort: 50200
    # 3. consumidores internos (mesmo namespace)
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - delonix-freeswitch
                  - delonix-ai-worker
                  - delonix-whisper
      ports:
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 9180
    # 4. Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8181

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: delonix-web
  namespace: ngolacloud-meet
spec:
  podSelector:
    matchLabels: { app: delonix-web }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
---
# A base e o Redis: SÓ do namespace. É a regra que impede um pod comprometido
# de outro namespace falar directamente com o Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dados-so-de-dentro
  namespace: ngolacloud-meet
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [delonix-postgres, delonix-redis, postgres, redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: delonix-meet }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
