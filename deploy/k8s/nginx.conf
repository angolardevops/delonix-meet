# Nginx do pod web (rootless, porta 8080). Serve a SPA e faz proxy do API/WS
# para o Service do backend. TLS termina no Ingress (ver 40-ingress.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compressão (achado 1.1 do docs/ux-perf-review.md) ----
    # A imagem base do nginx traz `gzip` COMENTADO, por isso a app era servida
    # crua: 648 KB de JS + 178 KB de CSS = ~826 KB por primeiro acesso, onde os
    # mesmos ficheiros dão ~227 KB comprimidos.
    # `gzip_vary` é obrigatório com cache intermédio — sem ele um proxy pode
    # servir a resposta comprimida a um cliente que não a anunciou.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/manifest+json application/wasm
                      image/svg+xml;
    # NÃO comprimir: woff2/woff já são Brotli/zlib por dentro — recomprimir
    # gasta CPU e chega a crescer o ficheiro.

    # MIME types que não estão no mime.types base do Alpine nginx.
    # NOTA: não usar bloco types{} no server — substituiria o mime.types global.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Assets grandes de IA: cache longo e imutável.
    location ~* ^/(ort|ort-rvm|models|mediapipe-wasm)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Assets da app têm content-hash no nome (index-XXXX.css/js) → cache longo.
    # `expires` (não `add_header`) para NÃO quebrar a herança dos COOP/COEP abaixo.
    location ~* ^/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # PWA: o service worker e o index.html NUNCA são cacheados pelo browser, para
    # que uma nova versão (novo hash de assets) seja apanhada de imediato. Sem
    # isto, o browser serve index.html stale → CSS/JS antigos. `expires -1` =>
    # Cache-Control: no-cache. Mantém os COOP/COEP herdados do server.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # COOP+COEP: tornam a página "cross-origin isolated" → ativam SharedArrayBuffer
    # → WASM multi-thread do ONNX Runtime (RVM/Whisper) funciona a maior velocidade.
    # A app é 100% self-hosted (mesma origem), por isso não há recursos cross-origin
    # que possam ser bloqueados por COEP.
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # API REST -> backend
    location /api/ {
        proxy_pass http://delonix-server:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets de sinalização/SFU (/ws) e presença/chamadas (/rtc).
    location ~ ^/(ws|rtc) {
        proxy_pass http://delonix-server:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA: tudo o resto cai no index.html (routing do lado do cliente).
    # expires -1 => o HTML de entrada é sempre revalidado (PWA atualiza sozinho).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
