# coturn (TURN/STUN) — LoadBalancer com VIP metallb dedicado (172.30.0.201).
# Produção-robusto: VIP alcançável pelo mesmo mecanismo do ingress (metallb L2),
# independente do nó. O SFU (pod->VIP) e o browser (->VIP) relayam a media aqui,
# compatível com afinidade por sala + N réplicas. static-auth-secret = TURN_SECRET.
# Relay UDP 50300-50349 exposto no Service (expandir se precisares
# de mais streams simultâneos). externalTrafficPolicy: Local preserva o IP do cliente.
apiVersion: v1
kind: ConfigMap
metadata: { name: coturn-config, namespace: delonix-meet }
data:
  turnserver.conf: |
    listening-port=3478
    fingerprint
    use-auth-secret
    realm=delonix
    min-port=50300
    max-port=50349
    no-cli
    no-tlsv1
    no-tlsv1_1
    simple-log
    log-file=stdout
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coturn, namespace: delonix-meet, labels: { app: coturn } }
spec:
  replicas: 1
  selector: { matchLabels: { app: coturn } }
  template:
    metadata: { labels: { app: coturn } }
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          args: ["-c","/etc/coturn/turnserver.conf","--static-auth-secret=$(TURN_SECRET)","--external-ip=172.30.0.201"]
          env:
            - name: TURN_SECRET
              valueFrom: { secretKeyRef: { name: delonix-secrets, key: TURN_SECRET } }
          volumeMounts:
            - { name: cfg, mountPath: /etc/coturn }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: cfg
          configMap: { name: coturn-config }
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: delonix-meet
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.30.0.201"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: coturn }
  ports:
    - { name: turn-udp, port: 3478, targetPort: 3478, protocol: UDP }
    - { name: turn-tcp, port: 3478, targetPort: 3478, protocol: TCP }
    - { name: relay-50300, port: 50300, targetPort: 50300, protocol: UDP }
