# PostgreSQL para stage/kind — single node, sem pgpool nem repmgr.
# As imagens de bitnami/postgresql-ha (pgpool + postgresql-repmgr)
# foram removidas do Docker Hub em 2024; para stage usa-se o chart
# simples (bitnami/postgresql) cujas imagens continuam acessíveis em
# registry-1.docker.io/bitnami/postgresql.
#
# SEM password (R155): esteve aqui escrita e está queimada. O `make stage`
# passa-a com `--set auth.password=` a partir do Secret `delonix-secrets`
# (`make secrets-k8s`) — a MESMA que vai no DATABASE_URL da app.
auth:
  username: delonix
  database: delonix_meet
primary:
  extendedConfiguration: |
    max_connections = 200
