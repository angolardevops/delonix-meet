# Apps EXTERNAS ao cluster roteadas pelo mesmo ingress (porta de entrada única).
# O host é alcançável dos pods no gateway da rede docker kind (172.30.0.1).
#
# cloud.delonix.local → delonix-engine (NgolaCloud) em HTTPS :9443
#   O engine dev escuta só em 127.0.0.1:9443 → a ponte systemd (user)
#   `ngolacloud-bridge.socket` escuta em 172.30.0.1:9443 e encaminha para o
#   loopback (systemd-socket-proxyd). Alternativa: correr o engine com
#   `--bind 0.0.0.0:9443` e a ponte deixa de ser precisa.
#
# pdf.delonix.local → delonix-pdf em HTTP :3000
#   (~/workspaces/delonix/delonix-pdf — quando estiver a correr, publicar a
#   porta 3000 no host: `0.0.0.0:3000` ou `172.30.0.1:3000`).
#
# TLS: wildcard *.delonix.local (mkcert) no secret delonix-tls-secret.
---
apiVersion: v1
kind: Service
metadata:
  name: ngolacloud-engine
  namespace: delonix-meet
spec:
  clusterIP: None
  ports:
    - { name: https, port: 9443, targetPort: 9443 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ngolacloud-engine
  namespace: delonix-meet
subsets:
  - addresses: [{ ip: 172.30.0.1 }]
    ports: [{ name: https, port: 9443 }]
---
apiVersion: v1
kind: Service
metadata:
  name: delonix-pdf
  namespace: delonix-meet
spec:
  clusterIP: None
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: delonix-pdf
  namespace: delonix-meet
subsets:
  - addresses: [{ ip: 172.30.0.1 }]
    ports: [{ name: http, port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngolacloud-ingress
  namespace: delonix-meet
  annotations:
    # O engine fala TLS na 9443 (cert self-signed → sem verify, é dev).
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cloud.delonix.local]
      secretName: delonix-tls-secret
  rules:
    - host: cloud.delonix.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ngolacloud-engine
                port:
                  number: 9443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-pdf-ingress
  namespace: delonix-meet
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [pdf.delonix.local]
      secretName: delonix-tls-secret
  rules:
    - host: pdf.delonix.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: delonix-pdf
                port:
                  number: 3000
