# coturn (TURN/STUN) — relay de media WebRTC.
#
# DUAS TOPOLOGIAS (escolhe uma):
#
# (A) IN-CLUSTER + LoadBalancer  ← DEFAULT (stage/kind e prod com LB real)
#     coturn corre como pod normal; um Service LoadBalancer dá-lhe um IP
#     alcançável. O SFU (pod) relaya via ClusterIP/VIP e o browser via VIP —
#     ambos SEM o double-NAT do docker. PROVADO em kind: relay pod→VIP e
#     host→VIP a 0% perda (turnutils). É o padrão de produção K8s.
#     CRÍTICO: `--external-ip` E `--allowed-peer-ip` = o IP do LoadBalancer.
#       - external-ip: o coturn anuncia os candidatos relay nesse IP.
#       - allowed-peer-ip: em relay-only nos DOIS lados, o "peer" de cada
#         alocação é o próprio IP do coturn (hairpin) → sem este flag o coturn
#         nega (403 Forbidden IP) e o vídeo fica preto. Ver docs/reference/regressions.md R4.
#     Os clientes só precisam da porta 3478 (o relay-a-relay é interno ao
#     coturn), por isso o LB expõe apenas UDP 3478.
#
# (B) FORA DO CLUSTER (VM com IP público)  ← alternativa prod sem LB no cluster
#     Correr coturn numa VM (deploy/run-host-coturn.sh serve de base) e apontar
#     TURN_HOST para o IP público. NÃO usar coturn-no-host da MESMA máquina do
#     kind: o retorno UDP pod→bridge-docker é partido pelo SNAT (100% perda).
#
# Requisito comum: static-auth-secret = MESMO valor que TURN_SECRET da app
# (o backend assina credenciais TURN com esse segredo — rooms.rs/sfu.rs).
#
# Config da app (01-config.yaml / configmap): TURN_HOST=<IP-do-LB>:3478,
# FORCE_TURN_RELAY=1 (SFU e cliente relay-only), SFU_EXTERNAL_IP="" (vazio).
---
# HA — decisão consciente: replicas:1 é CORRETO para a topologia atual.
# Em relay-only nos dois lados, o SFU (pod) e o browser relayam UM pelo outro
# ATRAVÉS de alocações no MESMO turnserver (hairpin). Duas réplicas partiriam:
# o SFU (source IP A) e o browser (source IP B) podem cair em pods diferentes
# → relay-A e relay-B em turnservers distintos → sem entrega. `sessionAffinity:
# ClientIP` no Service NÃO resolve (afina por IP, e os dois lados TÊM IPs
# diferentes). Escalar coturn exige um REDESENHO (dar ao SFU um candidato
# alcançável não-relay via SFU_EXTERNAL_IP+porta exposta → o browser relaya e o
# peer passa a ser um IP real, não o próprio coturn → alocações independentes,
# aí sim N réplicas). Enquanto for hairpin: 1 réplica + liveness rápida. Sem PDB
# (com 1 réplica um PDB só bloquearia drains de nó sem dar proteção).
apiVersion: apps/v1
kind: Deployment
metadata: { name: coturn, namespace: delonix-meet, labels: { app: coturn } }
spec:
  replicas: 1
  selector: { matchLabels: { app: coturn } }
  template:
    metadata: { labels: { app: coturn } }
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          imagePullPolicy: IfNotPresent
          env:
            # TURN_SECRET tem de ser IGUAL ao da app (Secret delonix-secrets).
            - { name: TURN_SECRET, valueFrom: { secretKeyRef: { name: delonix-secrets, key: TURN_SECRET } } }
            # IP do LoadBalancer (metallb). MUDAR se o pool/VIP mudar, ou para
            # o IP público numa cloud com LB real.
            - { name: EXTERNAL_IP, value: "172.30.0.201" }
          command: ["/bin/sh", "-c"]
          args:
            # allowed-peer-ip=VIP autoriza o hairpin. denied-peer-ip fecha o
            # SSRF-via-TURN para alvos internos sensíveis SEM tocar no relay para
            # o VIP (que é o único peer real em relay-only): metadata cloud
            # (169.254) e loopback. O CIDR de pods (10.244) NÃO pode ser negado — o
            # próprio relay do coturn vive num IP de pod (hairpin). NÃO negar RFC1918 em
            # bloco — o VIP 172.30.0.201 é 172.16/12 e partiria a media.
            # total-quota + range largo de portas evitam esgotamento (DoS
            # cross-tenant). Ajustar o denied de pods se o podCIDR do cluster
            # não for 10.244.0.0/16.
            - >
              exec turnserver -n --no-cli --log-file=stdout --simple-log
              --use-auth-secret --static-auth-secret="$TURN_SECRET"
              --realm=delonix --external-ip="$EXTERNAL_IP"
              --allowed-peer-ip="$EXTERNAL_IP"
              --denied-peer-ip=169.254.0.0-169.254.255.255
              --no-multicast-peers
              --listening-port=3478 --min-port=49152 --max-port=59152
              --total-quota=5000
              --fingerprint --stale-nonce=600
          ports:
            - { name: turn-udp, containerPort: 3478, protocol: UDP }
          readinessProbe:
            tcpSocket: { port: 3478 }
            initialDelaySeconds: 2
            periodSeconds: 10
          # Liveness PROTOCOL-LEVEL: um STUN binding real (não só TCP accept)
          # — valida que o listener UDP responde. Reinicia o pod se o turnserver
          # travar mas mantiver o socket aberto. turnutils_stunclient devolve 0
          # e imprime o reflexive addr quando o STUN responde.
          livenessProbe:
            exec:
              command: ["sh", "-c", "turnutils_stunclient -p 3478 127.0.0.1 >/dev/null 2>&1"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          # A porta 3478 é >1024 e NÃO precisa de NET_BIND_SERVICE. O motivo de
          # `allowPrivilegeEscalation:true` é outro: o binário turnserver desta
          # imagem tem file-capabilities (setcap); com no-new-privs
          # (`allowPrivilegeEscalation:false`) o exec dá EPERM ("Operation not
          # permitted"). Mesmo assim dropamos TODAS as caps exceto a que o
          # binário precisa — coturn parseia UDP não confiável, limitar importa.
          securityContext:
            allowPrivilegeEscalation: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: delonix-meet
  labels: { app: coturn }
spec:
  type: LoadBalancer
  # Fixa o VIP para bater com EXTERNAL_IP acima e TURN_HOST na config.
  # Tem de estar dentro do pool metallb (deploy/k8s/metallb-pool.yaml).
  loadBalancerIP: "172.30.0.201"
  # externalTrafficPolicy fica em Cluster (default): com replicas:1 o SNAT extra
  # do kube-proxy é irrelevante e evita a armadilha do metallb L2. NÃO mudar
  # para Local sem antes escalar coturn (ver comentário do Deployment): em L2 o
  # metallb anuncia o VIP a partir de UM nó; com Local, tráfego que chegue a um
  # nó sem pod coturn seria descartado.
  externalTrafficPolicy: Cluster
  selector: { app: coturn }
  ports:
    - { name: turn-udp, port: 3478, targetPort: 3478, protocol: UDP }
