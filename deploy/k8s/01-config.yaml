apiVersion: v1
kind: ConfigMap
metadata:
  name: delonix-config
  namespace: delonix-meet
data:
  BIND_ADDR: "0.0.0.0:8180"
  # IP do LoadBalancer do coturn (51-coturn.yaml) — alcançável pelo SFU (pod)
  # E pelo browser. NÃO usar DNS de ClusterIP (o browser não o resolve) — ver
  # docs/reference/regressions.md R4. Em prod (LB de cloud), pôr o IP público.
  TURN_HOST: "172.30.0.201:3478"
  # SFU E cliente relay-only (contorna IPs de pod inalcançáveis + evita explosão
  # de candidatos ICE num host multi-homed). Exige coturn com --allowed-peer-ip.
  FORCE_TURN_RELAY: "1"
  SFU_EXTERNAL_IP: ""
  # Gravações no PVC partilhado (montado em 02-server.yaml).
  RECORDINGS_DIR: "/var/lib/delonix/recordings"
  # LLM local (07-ollama.yaml): tradução de legendas + resumo da ata. Vazio
  # desliga a IA (MoM volta a ser por regras no cliente).
  OLLAMA_URL: "http://delonix-ollama.delonix-meet.svc.cluster.local:11434"
  OLLAMA_MODEL_TRANSLATE: "qwen2.5:1.5b"
  OLLAMA_MODEL_SUMMARY: qwen2.5:7b
  # URL interno para a app interagir com Redis Sentinel (HA)
  REDIS_URL: "redis://delonix-redis-master.delonix-meet.svc.cluster.local:6379"
# ------------------------------------------------------------------------------
# NÃO HÁ Secret neste ficheiro (R154, R155).
#
# O Secret `delonix-secrets` (PROVISIONING_SECRET, DATABASE_URL, JWT_SECRET,
# TURN_SECRET, POSTGRES_PASSWORD/USER/DB) esteve escrito aqui, com valores, num
# repositório PÚBLICO. Esses valores estão queimados — o servidor recusa-os e o
# `scripts/check-repo-hygiene.sh` impede-os de voltar (ver
# scripts/leaked-secrets-accepted.txt). O `VOICE_INTERNAL_SECRET` vive no Secret
# `delonix-voice`.
#
# Os dois nascem FORA do repositório, aleatórios, no próprio cluster:
#   make secrets-k8s        # delonix-secrets — só gera o que falta
#   make voice-secret-k8s   # delonix-voice
# (o `make stage`/`make prod` chamam-nos; o Ansible `k8s_app` cria-os a partir
# de deploy/ansible/.secrets/). Com `kubectl apply -k deploy/k8s` corre-se
# `make secrets-k8s` ANTES. Rotação por segredo: docs/deployment.md §6.
#
# Atenção a um cluster antigo: tirar o Secret deste ficheiro NÃO o apaga do
# cluster — continua lá com os valores publicados até ser rodado.
