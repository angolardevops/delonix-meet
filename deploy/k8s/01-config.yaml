apiVersion: v1
kind: ConfigMap
metadata:
  name: delonix-config
  namespace: delonix-meet
data:
  BIND_ADDR: "0.0.0.0:8180"
  # IP do LoadBalancer do coturn (51-coturn.yaml) — alcançável pelo SFU (pod)
  # E pelo browser. NÃO usar DNS de ClusterIP (o browser não o resolve) — ver
  # docs/reference/regressions.md R4. Em prod (LB de cloud), pôr o IP público.
  TURN_HOST: "172.30.0.201:3478"
  # SFU E cliente relay-only (contorna IPs de pod inalcançáveis + evita explosão
  # de candidatos ICE num host multi-homed). Exige coturn com --allowed-peer-ip.
  FORCE_TURN_RELAY: "1"
  SFU_EXTERNAL_IP: ""
  # Gravações no PVC partilhado (montado em 02-server.yaml).
  RECORDINGS_DIR: "/var/lib/delonix/recordings"
  # LLM local (07-ollama.yaml): tradução de legendas + resumo da ata. Vazio
  # desliga a IA (MoM volta a ser por regras no cliente).
  OLLAMA_URL: "http://delonix-ollama.delonix-meet.svc.cluster.local:11434"
  OLLAMA_MODEL_TRANSLATE: "qwen2.5:1.5b"
  OLLAMA_MODEL_SUMMARY: qwen2.5:7b
  # Estúdio (POST /api/orgs/{org_id}/ai/suggestions). Por omissão: o modelo do resumo,
  # tecto de 120 s (5..900) e 1 tarefa em simultâneo por organização (1..8).
  # OLLAMA_MODEL_STUDIO: qwen2.5:7b
  # OLLAMA_TIMEOUT_SECS: "120"
  # AI_STUDIO_CONCURRENCY_PER_ORG: "1"
  # URL interno para a app interagir com Redis Sentinel (HA)
  REDIS_URL: "redis://delonix-redis-master.delonix-meet.svc.cluster.local:6379"
# O Secret `delonix-secrets` NÃO vive aqui.
#
# Esteve escrito neste ficheiro até 2026-10-04 (JWT_SECRET, TURN_SECRET,
# PROVISIONING_SECRET, DATABASE_URL e POSTGRES_PASSWORD), num repositório
# público. Esses valores estão queimados: o servidor recusa-os ao arrancar e o
# portão de higiene recusa que voltem (scripts/leaked-secrets-accepted.txt).
#
# O Secret nasce do `.env` desta máquina (`make bootstrap` gera-o, aleatório),
# por `scripts/k8s-app-secrets.sh` — é o que `make stage`, `make prod` e
# `make cluster` correm. Quem aplicar com `kubectl apply -k deploy/k8s` tem de
# o criar antes, ou de usar o chart Helm (deploy/helm/delonix-meet), que exige
# um Secret existente em produção.
#
# O VOICE_INTERNAL_SECRET vem do Secret `delonix-voice` (R154), também gerado
# fora do repo e referenciado por secretKeyRef em 02-server.yaml.
