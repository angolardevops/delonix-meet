apiVersion: v1
kind: ConfigMap
metadata:
  name: delonix-config
  namespace: delonix-meet
data:
  BIND_ADDR: "0.0.0.0:8180"
  # IP do LoadBalancer do coturn (51-coturn.yaml) — alcançável pelo SFU (pod)
  # E pelo browser. NÃO usar DNS de ClusterIP (o browser não o resolve) — ver
  # docs/reference/regressions.md R4. Em prod (LB de cloud), pôr o IP público.
  TURN_HOST: "172.30.0.201:3478"
  # SFU E cliente relay-only (contorna IPs de pod inalcançáveis + evita explosão
  # de candidatos ICE num host multi-homed). Exige coturn com --allowed-peer-ip.
  FORCE_TURN_RELAY: "1"
  SFU_EXTERNAL_IP: ""
  # Gravações no PVC partilhado (montado em 02-server.yaml).
  RECORDINGS_DIR: "/var/lib/delonix/recordings"
  # LLM local (07-ollama.yaml): tradução de legendas + resumo da ata. Vazio
  # desliga a IA (MoM volta a ser por regras no cliente).
  OLLAMA_URL: "http://delonix-ollama.delonix-meet.svc.cluster.local:11434"
  OLLAMA_MODEL_TRANSLATE: "qwen2.5:1.5b"
  OLLAMA_MODEL_SUMMARY: qwen2.5:7b
  # URL interno para a app interagir com Redis Sentinel (HA)
  REDIS_URL: "redis://delonix-redis-master.delonix-meet.svc.cluster.local:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: delonix-secrets
  namespace: delonix-meet
type: Opaque
stringData:
  # Segredo de plataforma: autoriza POST /api/v1/admin/orgs (provisão de orgs
  # pelo Odoo/nk_delonix_meet, header X-Provisioning-Secret). Vazio = endpoint
  # desativado (fail-closed). Em prod: gestor de segredos, NUNCA este ficheiro.
  PROVISIONING_SECRET: "dlxprov_bcdc13c52115d2b67942298b6d548b65f47980470090a2e0"
  # Stage: bitnami/postgresql single-node (svc: delonix-postgres-postgresql).
  # Prod: bitnami/postgresql-ha → delonix-postgres-primary (ver 10-config-secret.yaml).
  DATABASE_URL: "postgres://delonix:delonix_dev_pass@delonix-postgres-postgresql.delonix-meet.svc.cluster.local:5432/delonix_meet"
  JWT_SECRET: "stage-jwt-secret-min-32-chars-abcdef123456"
  TURN_SECRET: "stage-turn-secret-key"
  VOICE_INTERNAL_SECRET: "voice-internal-secret-for-pstn"
  POSTGRES_PASSWORD: "delonix_dev_pass"
  POSTGRES_USER: "delonix"
  POSTGRES_DB: "delonix_meet"
