# Ingress (ingress-nginx). TLS via cert-manager (ajustar o issuer/host).
# API/WS vão DIRETO ao Service do backend (não passam pelos pods web) para não
# quebrar a afinidade por-sala do SFU.
#
# IMPORTANTE — afinidade por sala:
#   O SFU é in-memory por pod (o fan-out de RTP vive na memória de UM pod; o
#   Redis só propaga sinalização/presença, NÃO media). Com várias réplicas, os
#   pares da MESMA sala TÊM de cair no MESMO pod, senão não trocam vídeo/áudio
#   (admissão, partilha de ecrã e media falham). Conseguimos isso com um Ingress
#   dedicado ao /ws que faz consistent-hash pelo argumento `room` do URL
#   (o cliente já envia `/ws?token=...&room=CODE`). O /rtc (presença) é
#   propagado por Redis (canal dlx:presence) e NÃO precisa de afinidade.
#
# NOTA TLS: `letsencrypt-prod` só emite para domínios PÚBLICOS. Num domínio
# interno (ex.: *.local) usa um cert local (mkcert) e importa a CA nos browsers
# — o Firefox NÃO confia na store do SO por omissão (ver deploy/k8s/README.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix
  namespace: delonix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [meet.example.com]
      secretName: delonix-tls
  rules:
    - host: meet.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: delonix-server, port: { number: 8180 } } }
          - path: /rtc
            pathType: Prefix
            backend: { service: { name: delonix-server, port: { number: 8180 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: delonix-web, port: { number: 80 } } }
---
# Ingress DEDICADO ao /ws com consistent-hash por sala (`$arg_room`). Mantém
# todos os pares de uma sala no mesmo pod → o SFU in-memory funciona com HA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-ws
  namespace: delonix
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Consistent-hash pela sala: mesmo `room` → mesmo pod (afinidade do SFU).
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_room"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [meet.example.com]
      secretName: delonix-tls
  rules:
    - host: meet.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            # Service dedicado → backend próprio no ingress-nginx → o hash aplica-se
            # (partilhar o Service com /api/rtc descarta o upstream-hash-by).
            backend: { service: { name: delonix-server-ws, port: { number: 8180 } } }
