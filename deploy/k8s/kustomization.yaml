apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sem `namespace:` global — cada recurso já declara o seu (delonix / delonix-data).

# Autoscale do backend (21-server-hpa.yaml) é OPT-IN — ver README antes de o
# adicionar (exige afinidade por-sala). Postgres/Redis/coturn assumem-se geridos
# ou externos (referenciados pelo Secret/ConfigMap).
resources:
  - 00-namespace.yaml
  - 10-config-secret.yaml
  - 20-server.yaml
  - 30-web.yaml
  - 40-ingress.yaml
  - 50-data.yaml # Postgres + Redis (remover se usares BD gerida)
  - 51-coturn.yaml # TURN (ou correr fora do cluster — ver README)

# Aponta para o teu registo/tag. Ex.: kustomize edit set image ...
images:
  - name: ghcr.io/OWNER/delonix-server
    newName: ghcr.io/OWNER/delonix-server
    newTag: latest
  - name: ghcr.io/OWNER/delonix-web
    newName: ghcr.io/OWNER/delonix-web
    newTag: latest
