apiVersion: apps/v1
kind: Deployment
metadata:
  name: delonix-server
  namespace: delonix-meet
  labels:
    app: delonix-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: delonix-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: delonix-server
      # Descoberta pelo Prometheus (scrape do POD diretamente em :8180/metrics —
      # NÃO exposto no ingress, que só encaminha /api,/ws,/rtc). Ver metrics.rs.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8180"
        prometheus.io/path: "/metrics"
    spec:
      # Espalhar as 3 réplicas por nó (e por zona, no servidor). `ScheduleAnyway`
      # e não `DoNotSchedule`: no laboratório de UM nó (kind, `make cluster`) isto
      # é um no-op, e um `DoNotSchedule` deixava pods `Pending` sem ninguém
      # perceber porquê. Onde conta é no artefacto de PRODUTO — os overlays
      # `k8s-overlays/saas` e `.../enterprise` (ADR-0006 §2), que um cliente
      # aplica com `kubectl apply -k` no SEU cluster, de vários nós. Sem isto, as
      # 3 réplicas podem aterrar todas no mesmo nó e a perda desse nó leva o
      # serviço inteiro. É o padrão que o chart de produção já usa.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: delonix-server }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: delonix-server }
      # Reforço do espalhamento por nó, em `preferred` — o scheduler tenta e não
      # falha se não puder. É o que o chart faz para o servidor.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: delonix-server }
      # Conta dedicada, sem token da API montado: o servidor não fala com o
      # Kubernetes. Ver deploy/k8s/10-contas-e-rede.yaml.
      serviceAccountName: delonix-server
      automountServiceAccountToken: false
      # O SFU é in-memory por pod: dar tempo para as sessões drenarem no SIGTERM
      # (rollout/drain) em vez de cortar abruptamente. Com maxUnavailable:0 +
      # afinidade por sala, os clientes reconectam à mesma sala/pod.
      # 60 s: tem de ser MAIOR que o DRAIN_GRACE_SECS do servidor (40) mais o
      # DRAIN_READINESS_SECS (12), senão o SIGKILL chega a meio do drain e as
      # salas caem à mesma — que era exactamente o que acontecia com 45 s.
      terminationGracePeriodSeconds: 60
      # Imagem distroless :nonroot (uid 65532) — hardening seguro. NÃO ligar
      # readOnlyRootFilesystem sem volume writable p/ RECORDINGS_DIR (gravações).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # uid numérico do :nonroot do distroless (o K8s não
        runAsGroup: 65532 # resolve o nome "nonroot" p/ verificar non-root)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: delonix-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8180
              name: http
          envFrom:
            - configMapRef:
                name: delonix-config
            - secretRef:
                name: delonix-secrets
          env:
            # Segredo da API interna de IVR (R154). Secret próprio, criado fora
            # do repositório — nunca em 01-config.yaml. `optional: true`: sem
            # ele o servidor arranca e só as rotas /internal/v1/voice/ivr/* dão 503.
            # `env` ganha ao `envFrom`, por isso um valor antigo que tenha
            # ficado no `delonix-secrets` é substituído quando este existe.
            - name: VOICE_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: delonix-voice, key: VOICE_INTERNAL_SECRET, optional: true }
            # A password do Event Socket do FreeSWITCH (o endereço, TELEPHONY_ESL_ADDR, vem do
            # delonix-config de quem liga o ESL). Sem a password o servidor recusa arrancar
            # com o endereço; sem os dois, a telefonia de troncos fica `not_configured`.
            - name: TELEPHONY_ESL_PASSWORD
              valueFrom:
                secretKeyRef: { name: delonix-voice, key: TELEPHONY_ESL_PASSWORD, optional: true }
          # READINESS aponta para /ready, NÃO para /health.
          #
          # Apontava para o /health, que devolve `ok` enquanto o processo
          # viver — incluindo durante o encerramento. O K8s mantinha o pod nos
          # endpoints do Service e continuava a mandar-lhe entradas novas, que
          # morriam com ele. O /ready devolve 503 assim que o SIGTERM chega.
          #
          # `failureThreshold: 1` para o pod sair dos endpoints à PRIMEIRA
          # falha: cada sonda a mais são 10 s de gente a entrar num pod que já
          # está a fechar.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 1
          # LIVENESS continua no /health: um pod a drenar está vivo e deve ser
          # DEIXADO TERMINAR, não reiniciado a meio.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # DIMENSIONAMENTO DE CPU — medido em docs/ops/teste-de-carga-2026-09-17.md:
          # ~1 núcleo por ~180 Mbps encaminhados (o SFU não descodifica), uma sala
          # de 30 pessoas com câmara pede 5,6 núcleos e 160 pessoas em chamadas de 4
          # pedem 4,8. Com `limits.cpu: 1000m` o CFS estrangulava o processo muito
          # antes de a rede ou a máquina serem o limite, e em media em tempo real
          # estrangular é jitter e perda, não só lentidão (o mesmo erro está
          # documentado no coturn, 51-coturn.yaml).
          #
          # 4 = a dimensão dos workers de referência (docs/ops/platform-engineering.md
          # §2.3); acima disso o limite não passa do que o nó tem. Os tectos de CPU
          # por tarefa (`FFMPEG_MAX_CONCURRENT`, `FFMPEG_THREADS`, `MAX_DIRECTOS`)
          # existem por causa deste limite: se o subires, revê-los. A memória NÃO foi
          # medida com carga e fica como estava.
          #
          # O Rust não precisa de `worker_threads`: o `tokio` usa
          # `available_parallelism`, que respeita a quota do cgroup.
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 1Gi
          volumeMounts:
            # Gravações PARTILHADAS entre as réplicas e persistentes a restarts.
            # kind = nó único → RWO serve (todos os pods no mesmo nó partilham o
            # PV local-path). Produção MULTI-NÓ: trocar por RWX (NFS/CephFS) ou
            # object storage (MinIO/S3) — RWO prenderia todas as réplicas a um nó.
            - name: recordings
              mountPath: /var/lib/delonix/recordings
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: delonix-recordings
---
# PVC das gravações (ver nota RWO/RWX acima).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delonix-recordings
  namespace: delonix-meet
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: delonix-server
  namespace: delonix-meet
spec:
  selector:
    app: delonix-server
  ports:
    - protocol: TCP
      port: 8180
      targetPort: http
---
# Service DEDICADO ao /ws — os MESMOS pods, mas um backend distinto no
# ingress-nginx. Sem isto, o /ws e o /api/rtc partilhavam o mesmo backend e o
# `upstream-hash-by: $arg_room` era descartado (o round-robin ganhava) → a
# afinidade por sala NÃO se aplicava e o SFU voltava ao split-brain.
apiVersion: v1
kind: Service
metadata:
  name: delonix-server-ws
  namespace: delonix-meet
spec:
  selector:
    app: delonix-server
  ports:
    - protocol: TCP
      port: 8180
      targetPort: http
---
# Drain de nó não pode tirar mais de 1 réplica de cada vez (o SFU é in-memory
# por pod; perder 2/3 em simultâneo cortava muitas salas). Exige replicas>=2.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delonix-server
  namespace: delonix-meet
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: delonix-server
