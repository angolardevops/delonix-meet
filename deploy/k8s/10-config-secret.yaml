# Configuração NÃO-secreta do backend. Os segredos vão no Secret abaixo
# (aqui só como EXEMPLO — em produção usar um gestor de segredos, ex.:
# External Secrets, Sealed Secrets ou Vault; nunca commitar segredos reais).
apiVersion: v1
kind: ConfigMap
metadata:
  name: delonix-config
  namespace: delonix
data:
  BIND_ADDR: "0.0.0.0:8180"
  # Domínios permitidos para CORS (o Ingress serve a SPA na mesma origem).
  CORS_ORIGINS: "https://meet.example.com"
  TURN_HOST: "turn.example.com:3478"
  # Cookies seguros (HTTPS obrigatório). NÃO definir COOKIE_INSECURE em produção.
  VOICE_TARIFF_INBOUND: "0.0"
---
# EXEMPLO — substituir por segredos reais fora do git.
#   kubectl -n delonix create secret generic delonix-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=TURN_SECRET="$(openssl rand -hex 24)" \
#     --from-literal=DATABASE_URL="postgres://user:pass@postgres:5432/delonix_meet" \
#     --from-literal=VOICE_INTERNAL_SECRET="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: delonix-secrets
  namespace: delonix
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_min_32_chars_use_openssl_rand_hex_48"
  # TURN_SECRET tem de ser IGUAL ao static-auth-secret do coturn (51-coturn.yaml).
  TURN_SECRET: "CHANGE_ME_min_16_chars"
  # Postgres in-cluster vive no namespace delonix-data → FQDN cross-namespace.
  # A password tem de ser IGUAL à POSTGRES_PASSWORD do Secret postgres-auth.
  DATABASE_URL: "postgres://delonix:CHANGE_ME@postgres.delonix-data.svc.cluster.local:5432/delonix_meet"
  VOICE_INTERNAL_SECRET: ""
