apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-ingress
  namespace: ngolacloud-meet
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "delonix-server"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.delonix.local
      secretName: delonix-tls-secret
  rules:
    - host: meet.delonix.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          - path: /rtc
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          # ASR streaming (Whisper server-side) — WS do browser para o serviço
          # de transcrição soberano (09-whisper.yaml). Sem afinidade por sala:
          # cada cliente tem a sua própria ligação de áudio.
          - path: /asr
            pathType: Prefix
            backend:
              service:
                name: delonix-whisper
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: delonix-web
                port:
                  number: 80
---
# Ingress DEDICADO ao /ws com afinidade por sala (consistent-hash pelo `room`).
# O SFU é in-memory por pod: todos os pares de uma sala TÊM de cair no mesmo pod,
# senão não trocam media (admissão/partilha/vídeo falham). O cliente envia
# /ws?token=...&room=CODE. O /rtc (presença) fica no ingress principal — é
# propagado por Redis e não precisa de afinidade.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-ws
  namespace: ngolacloud-meet
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_room"
    # O token vai no `?token=` deste caminho — o da sala, e o de FONTE de um
    # estúdio, que vive 12 h. O `log-format-upstream` por omissão do
    # ingress-nginx usa `$request`, que inclui a query: sem isto a credencial
    # fica escrita no log do ingress e, com o Loki do `observabilidade/`,
    # retida e pesquisável num cluster PARTILHADO (ADR-0021).
    #
    # Em K8s o `/ws` vem por AQUI — Ingress → Service `delonix-server-ws`,
    # directo. Não passa pelo nginx do pod web (`deploy/k8s/nginx.conf`), e
    # desligar o log lá não protege nada: foi o erro da primeira versão deste
    # commit. O `delonix-provisioning` abaixo já leva esta anotação, pela
    # mesma razão (R278).
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.delonix.local
      secretName: delonix-tls-secret
  rules:
    - host: meet.delonix.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: delonix-server-ws  # Service dedicado → backend próprio → hash aplica-se
                port:
                  number: 8180
---
# Ingress DEDICADO ao resgate do QR do Linphone (R278): o caminho leva o
# bilhete de uso único — a credencial. Sem isto o ingress-nginx escrevia-o no
# registo de acessos do controlador. O prefixo mais longo ganha ao /api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-provisioning
  namespace: ngolacloud-meet
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.delonix.local
      secretName: delonix-tls-secret
  rules:
    - host: meet.delonix.local
      http:
        paths:
          - path: /api/public/extension-provisioning
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
