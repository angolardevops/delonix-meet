apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-ingress
  namespace: delonix-meet
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "delonix-server"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.delonix.local
      secretName: delonix-tls-secret
  rules:
    - host: meet.delonix.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          - path: /rtc
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          # ASR streaming (Whisper server-side) — WS do browser para o serviço
          # de transcrição soberano (09-whisper.yaml). Sem afinidade por sala:
          # cada cliente tem a sua própria ligação de áudio.
          - path: /asr
            pathType: Prefix
            backend:
              service:
                name: delonix-whisper
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: delonix-web
                port:
                  number: 80
---
# Ingress DEDICADO ao /ws com afinidade por sala (consistent-hash pelo `room`).
# O SFU é in-memory por pod: todos os pares de uma sala TÊM de cair no mesmo pod,
# senão não trocam media (admissão/partilha/vídeo falham). O cliente envia
# /ws?token=...&room=CODE. O /rtc (presença) fica no ingress principal — é
# propagado por Redis e não precisa de afinidade.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-ws
  namespace: delonix-meet
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_room"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.delonix.local
      secretName: delonix-tls-secret
  rules:
    - host: meet.delonix.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: delonix-server-ws  # Service dedicado → backend próprio → hash aplica-se
                port:
                  number: 8180
