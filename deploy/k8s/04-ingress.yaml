apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delonix-ingress
  namespace: delonix-meet
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "delonix-server"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.delonix.local
      secretName: delonix-tls-secret
  rules:
    - host: meet.delonix.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          - path: /rtc
            pathType: Prefix
            backend:
              service:
                name: delonix-server
                port:
                  number: 8180
          - path: /
            pathType: Prefix
            backend:
              service:
                name: delonix-web
                port:
                  number: 80
