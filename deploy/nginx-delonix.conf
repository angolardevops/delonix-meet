# Delonix Meet — Nginx (produção)
# Serve a SPA compilada (/var/www/delonix) e faz proxy da API/WebSockets para o
# backend axum. Aplica cabeçalhos de segurança e limites de corpo.
#
# Instalar: copiar para /etc/nginx/sites-available/delonix, ajustar server_name
# e certificados, e `ln -s` para sites-enabled; `nginx -t && systemctl reload nginx`.
#
# ── Multi-nó (HA) ──────────────────────────────────────────────────────────────
# Para 2 ou mais instâncias do backend, descomenta e preenche o bloco `upstream`
# abaixo. O `ip_hash` garante sticky sessions: todas as ligações WebSocket de um
# mesmo cliente vão sempre ao mesmo nó (necessário para o SignalingHub local).
# A presença cross-nó usa Redis pub/sub (REDIS_URL nas envs do backend).
#
# upstream delonix_backend {
#     ip_hash;                        # sticky por IP de cliente
#     server 10.0.0.1:8180;          # nó 1
#     server 10.0.0.2:8180;          # nó 2
#     keepalive 32;
# }
#
# Depois substitui todos os `proxy_pass http://127.0.0.1:8180` por
# `proxy_pass http://delonix_backend`.
# ───────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    # `_` apanha QUALQUER host — inclui acesso por IP (ex.: http://172.16.31.207).
    # Sem isto, o acesso por IP em HTTP não redirecionava e a câmara/mic/WebRTC
    # ficavam bloqueados (HTTP não é contexto seguro fora de localhost).
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meet.delonix.local;

    ssl_certificate     /home/walter/workspaces/delonix-meet/deploy/certs/meet.delonix.local.crt;
    ssl_certificate_key /home/walter/workspaces/delonix-meet/deploy/certs/meet.delonix.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/delonix;
    index index.html;

    # ---- Compressão (achado 1.1 do docs/ux-perf-review.md) ----
    # A imagem base do nginx traz `gzip` COMENTADO, por isso a app era servida
    # crua: 648 KB de JS + 178 KB de CSS = ~826 KB por primeiro acesso, onde os
    # mesmos ficheiros dão ~227 KB comprimidos.
    # `gzip_vary` é obrigatório com cache intermédio — sem ele um proxy pode
    # servir a resposta comprimida a um cliente que não a anunciou.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/manifest+json application/wasm
                      image/svg+xml;
    # NÃO comprimir: woff2/woff já são Brotli/zlib por dentro — recomprimir
    # gasta CPU e chega a crescer o ficheiro.

    # ---- Cabeçalhos de segurança (aplicados a todas as respostas) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    # CSP: 'wasm-unsafe-eval' para onnxruntime/mediapipe; worker/blob para os
    # workers de E2EE e Whisper; connect a self + WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Corpo: pequeno por omissão; grande só no upload de gravações.
    client_max_body_size 1m;

    # ---- API REST ----
    location /api/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload de gravações: permite corpo grande.
    location ~ ^/api/rooms/[^/]+/recordings$ {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # ---- WebSockets (signaling + presença) ----
    location ~ ^/(ws|rtc)$ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        # Nota: os tokens em ?token= NÃO devem ser registados — desligar access_log
        # nesta location evita guardar JWTs nos logs.
        access_log off;
    }

    # ---- SPA (fallback para index.html) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
