# Delonix Meet — configuração Ansible do deploy zero-touch.
# Corre a partir de deploy/ansible/ (make deploy trata do cd).
[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
display_skipped_hosts = False
force_color          = True

[ssh_connection]
pipelining = False

[privilege_escalation]
# Cada play decide o become (single-host e k8s precisam de root; a preflight não).
become = False
