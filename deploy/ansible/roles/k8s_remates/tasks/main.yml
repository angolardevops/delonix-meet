---
- name: MetalLB
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: |
    set -o pipefail
    helm repo add metallb https://metallb.github.io/metallb >/dev/null
    helm upgrade --install metallb metallb/metallb --version {{ metallb_versao }} \
      --namespace metallb-system --create-namespace --wait --timeout 5m
  args: { executable: /bin/bash }
  changed_when: true

- name: O intervalo do MetalLB
  become_user: "{{ ansible_user }}"
  ansible.builtin.template: { src: metallb-pool.yaml.j2, dest: /tmp/metallb-pool.yaml, mode: "0644" }
- become_user: "{{ ansible_user }}"
  ansible.builtin.command: kubectl apply -f /tmp/metallb-pool.yaml
  changed_when: true

- name: O cluster está mesmo de pé?
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: kubectl get nodes -o wide
  register: nos
  changed_when: false

- ansible.builtin.debug:
    msg: "{{ nos.stdout_lines }}"

- name: Trazer o kubeconfig para esta máquina
  # Com o VIP lá dentro, não o IP deste nó: é o que torna o kubeconfig válido
  # quando este control-plane morrer.
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../../.kube/producao.conf"
    flat: true
