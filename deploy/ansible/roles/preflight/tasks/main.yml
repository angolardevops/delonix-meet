---
# Preflight — valida a config declarativa, resolve o IP público efetivo e
# decide o modo de TLS efetivo. Corre no controlador (play0) e também no
# host single-host (play1, para apanhar o IP real do servidor).

- name: "Config existe? (deploy/config.yml)"
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config.yml"
  register: _cfg_stat
  delegate_to: localhost
  run_once: true

- name: "Falhar cedo se faltar a config"
  ansible.builtin.fail:
    msg: >
      deploy/config.yml não existe. Copia o exemplo e preenche:
      cp deploy/config.example.yml deploy/config.yml
  when: not _cfg_stat.stat.exists

- name: "Validar deploy_mode"
  ansible.builtin.assert:
    that: deploy_mode in ['single-host', 'multi-host']
    fail_msg: "deploy_mode inválido ({{ deploy_mode }}) — usa 'single-host' ou 'multi-host'."

- name: "Let's Encrypt exige domínio + email"
  ansible.builtin.assert:
    that:
      - domain | length > 0
      - acme_email | length > 0
    fail_msg: >
      tls.mode=letsencrypt exige 'domain' e 'tls.acme_email' em config.yml.
      (Sem domínio público, usa tls.mode: selfsigned ou auto.)
  when: tls_mode_cfg == 'letsencrypt'

- name: "DNS Cloudflare exige zona + CLOUDFLARE_API_TOKEN"
  ansible.builtin.assert:
    that:
      - dns_cloudflare_zone | length > 0
      - lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | length > 0
    fail_msg: "dns.provider=cloudflare exige dns.cloudflare_zone e a env CLOUDFLARE_API_TOKEN."
  when: dns_provider == 'cloudflare'

- name: "DNS Route53 exige zona + credenciais AWS"
  ansible.builtin.assert:
    that:
      - dns_route53_zone | length > 0
      - lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') | length > 0
    fail_msg: "dns.provider=route53 exige dns.route53_zone e AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
  when: dns_provider == 'route53'

# ---- Resolver o IP público efetivo ----
- name: "Auto-detetar IP público (serviço externo)"
  ansible.builtin.uri:
    url: https://api.ipify.org
    return_content: true
    timeout: 5
  register: _ipify
  when:
    - public_ip_cfg == 'auto'
    - deploy_mode == 'single-host'
  failed_when: false

- name: "Definir public_ip_effective"
  ansible.builtin.set_fact:
    public_ip_effective: >-
      {{ (public_ip_cfg if public_ip_cfg != 'auto'
          else (_ipify.content | default('') if (_ipify.content | default('') | length > 0)
                else (ansible_default_ipv4.address | default('127.0.0.1')))) }}
    cacheable: true
  when: deploy_mode == 'single-host'

# Multi-host: o IP é o do LoadBalancer (MetalLB/cloud), resolvido em k8s_app.
- name: "Multi-host — IP diferido para o LoadBalancer"
  ansible.builtin.set_fact:
    public_ip_effective: "{{ public_ip_cfg if public_ip_cfg != 'auto' else '' }}"
    cacheable: true
  when: deploy_mode == 'multi-host'

# ---- Decidir o modo de TLS efetivo ----
- name: "Decidir tls_effective_mode"
  ansible.builtin.set_fact:
    tls_effective_mode: >-
      {{ 'letsencrypt' if (tls_mode_cfg == 'letsencrypt')
         else ('selfsigned' if (tls_mode_cfg == 'selfsigned')
         else ('letsencrypt' if (domain | length > 0 and acme_email | length > 0 and dns_provider != 'hosts')
               else 'selfsigned')) }}
    cacheable: true

- name: "Resumo do preflight"
  ansible.builtin.debug:
    msg:
      - "modo:        {{ deploy_mode }}"
      - "domínio:     {{ domain if domain else '(sem domínio → serve por IP)' }}"
      - "IP efetivo:  {{ public_ip_effective | default('(diferido p/ LoadBalancer)') }}"
      - "TLS:         {{ tls_effective_mode }}{{ ' (staging)' if (tls_effective_mode == 'letsencrypt' and acme_staging) else '' }}"
      - "DNS:         {{ dns_provider }}"
      - "TURN realm:  {{ turn_realm }}"
