---
# kind_host — Deploy Delonix Meet num servidor remoto com recursos limitados.

# public_ip_effective é definido no Play 0 (localhost). Em plays subsequentes
# noutros hosts o fact não está disponível — definir aqui diretamente do config.
- name: Definir public_ip_effective a partir do config
  ansible.builtin.set_fact:
    public_ip_effective: "{{ cfg.public_ip }}"
    cacheable: true
# Instala Docker + kind + kubectl + Helm; corre coturn no host como systemd;
# cria cluster kind com port-mapping 80/443; aplica manifests K8s com overrides
# de recursos (1 réplica, postgres/redis standalone).
#
# Pré-requisito: as imagens Docker (delonix-server, delonix-web) foram construídas
# localmente com `make image` e estão disponíveis em /tmp/dlx-images/ como .tar.gz
# (gerados pelo play de preflight via `make export-images`).

# ============================================================
# 1. PACOTES BASE
# ============================================================

- name: Instalar dependências base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - coturn
      - openssl
      - python3-cryptography
    state: present
    update_cache: true

# ============================================================
# 2. MOTOR DE CONTAINERS ({{ container_engine }})
# ============================================================
# Era Docker CE fixo (repo + GPG + grupo). Passou a sair do role
# `container_engine` — `container_engine: delonix|docker|podman` no group_vars
# decide, e o `docker` continua a ser uma das opções (instalado por esse role).

- name: "Motor de containers ({{ container_engine }})"
  ansible.builtin.include_role:
    name: container_engine

# ============================================================
# 3. KIND + KUBECTL + HELM
# ============================================================

# O binário `kind` é um CLIENTE DOCKER — só faz sentido quando o motor é
# docker/podman. Com `container_engine: delonix` o cluster é criado pelo próprio
# motor (`delonix cluster create`, modo kind nativo), e instalar o kind aqui só
# poria no host uma ferramenta que não teria provider nenhum para falar.
- name: kind binary (motores docker/podman)
  ansible.builtin.get_url:
    url: https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
    dest: /usr/local/bin/kind
    mode: "0755"
  when: container_engine != 'delonix' 

- name: kubectl binary
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Helm (instalar se ausente)
  ansible.builtin.shell:
    cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    creates: /usr/local/bin/helm

# ============================================================
# 4. COTURN NO HOST (relay TURN para WebRTC em kind)
# Padrão stage do projecto: coturn no host físico, não no cluster.
# O servidor Delonix usa FORCE_TURN_RELAY=1 + TURN_HOST={{ public_ip_effective }}.
# ============================================================

- name: Diretório de coturn
  ansible.builtin.file:
    path: /etc/coturn
    state: directory
    mode: "0750"

- name: Configuração do coturn
  ansible.builtin.template:
    src: coturn.conf.j2
    dest: /etc/turnserver.conf
    mode: "0640"
  notify: restart coturn

- name: Coturn activo
  ansible.builtin.systemd:
    name: coturn
    state: started
    enabled: true

# ============================================================
# 5. TLS — certificado self-signed wildcard local
#    SANs: domínio principal + domínio externo + IP
# ============================================================

- name: Diretório TLS
  ansible.builtin.file:
    path: /etc/ssl/delonix
    state: directory
    mode: "0755"

- name: Chave privada TLS
  community.crypto.openssl_privatekey:
    path: /etc/ssl/delonix/privkey.pem
    size: 2048
    mode: "0640"

- name: CSR wildcard (ambos os domínios + IP)
  community.crypto.openssl_csr:
    path: /etc/ssl/delonix/delonix.csr
    privatekey_path: /etc/ssl/delonix/privkey.pem
    common_name: "{{ domain }}"
    subject_alt_name: "{{ _san }}"
  vars:
    _san: >-
      {{
        ['DNS:' + domain, 'DNS:*.' + (domain | regex_replace('^[^.]+\\.', ''))]
        + (['DNS:' + domain_external,
            'DNS:*.' + (domain_external | regex_replace('^[^.]+\\.', ''))]
           if domain_external | length > 0 else [])
        + ['IP:' + public_ip_effective, 'DNS:localhost', 'IP:127.0.0.1']
      }}

- name: Certificado self-signed (10 anos, preprod)
  community.crypto.x509_certificate:
    path: /etc/ssl/delonix/fullchain.pem
    privatekey_path: /etc/ssl/delonix/privkey.pem
    csr_path: /etc/ssl/delonix/delonix.csr
    provider: selfsigned
    selfsigned_not_after: +3650d
    mode: "0644"

# ============================================================
# 6. KIND CLUSTER
# ============================================================

- name: Verificar se o cluster já existe
  ansible.builtin.command: >-
    {{ 'delonix cluster ls' if container_engine == 'delonix' else 'kind get clusters' }}
  register: _kind_clusters
  changed_when: false

- name: Render kind-cluster.yaml (só o kind lê este ficheiro)
  ansible.builtin.template:
    src: kind-cluster.yaml.j2
    dest: /tmp/kind-cluster.yaml
    mode: "0644"
  when: container_engine != 'delonix'

# Com delonix: modo kind NATIVO (sem binário kind, sem docker). O
# `systemd-run --user --scope -p Delegate=yes` NÃO é decoração — sem delegação de
# cgroup2 o kubelet do nó entra em crash-loop no `create-kubelet-cgroup-v2.sh`
# (EBUSY a escrever `cgroup.subtree_control` numa raiz com processos) e o cluster
# nunca fica Ready. Custou uma sessão a diagnosticar; não tirar.
- name: "Criar cluster (idempotente, {{ container_engine }})"
  ansible.builtin.command: >-
    {{ 'systemd-run --user --scope -q -p Delegate=yes delonix cluster create --name ' ~ kind_cluster_name
       if container_engine == 'delonix'
       else 'kind create cluster --name ' ~ kind_cluster_name ~ ' --config /tmp/kind-cluster.yaml' }}
  when: kind_cluster_name not in _kind_clusters.stdout
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"

- name: kubeconfig acessível para o utilizador
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

# `delonix cluster create` já escreve o kubeconfig em
# `<root>/clusters/<nome>-kubeconfig.yaml` — copia-se de lá em vez de pedir um
# `export` que só o binário kind tem.
- name: Copiar kubeconfig para o utilizador
  ansible.builtin.shell: |
    set -e
    if [ "{{ container_engine }}" = "delonix" ]; then
      cp "$HOME/.local/share/delonix/clusters/{{ kind_cluster_name }}-kubeconfig.yaml" \
        /home/{{ ansible_user }}/.kube/config
    else
      kind export kubeconfig --name {{ kind_cluster_name }} \
        --kubeconfig /home/{{ ansible_user }}/.kube/config
    fi
    chown {{ ansible_user }}:{{ ansible_user }} /home/{{ ansible_user }}/.kube/config
  changed_when: false

# ============================================================
# 7. INGRESS-NGINX (sabor kind)
# ============================================================

- name: Instalar ingress-nginx (sabor kind)
  ansible.builtin.command: >-
    kubectl apply -f
    https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  register: _ingress_apply
  changed_when: "'configured' in _ingress_apply.stdout or 'created' in _ingress_apply.stdout"

- name: Aguardar ingress-nginx pronto
  ansible.builtin.command: >-
    kubectl rollout status deployment/ingress-nginx-controller
    -n ingress-nginx --timeout=180s
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

# ============================================================
# 8. METALB (kind-compatible via manifests v0.14)
# ============================================================

- name: MetalLB — CRDs e controller
  ansible.builtin.command: >-
    kubectl apply -f
    https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  register: _metallb_apply
  changed_when: "'configured' in _metallb_apply.stdout or 'created' in _metallb_apply.stdout"

- name: Aguardar MetalLB controller
  ansible.builtin.command: >-
    kubectl rollout status deployment/controller -n metallb-system --timeout=120s
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

# A rede do cluster: `dlx-<nome>` no modo kind nativo do delonix (o
# `network ls` mostra a subnet), `kind` na rede docker homónima.
- name: Detectar subnet da rede do cluster (IPv4)
  ansible.builtin.shell: >-
    {{ "delonix network ls | awk '$1 == \"dlx-" ~ kind_cluster_name ~ "\" {print $4}' | head -1"
       if container_engine == 'delonix'
       else "docker network inspect kind 2>/dev/null | grep '\"Subnet\"' | awk -F'\"' '{print $4}' | grep -v ':' | head -1" }}
  register: _kind_subnet
  changed_when: false

- name: Calcular pool MetalLB (.200-.250)
  ansible.builtin.set_fact:
    _metallb_prefix: "{{ _kind_subnet.stdout.strip() | regex_replace('/\\d+$', '') | regex_replace('\\.\\d+$', '') }}"

- name: Definir intervalo MetalLB
  ansible.builtin.set_fact:
    _metallb_pool: "{{ _metallb_prefix }}.200-{{ _metallb_prefix }}.250"

- name: Aplicar IPAddressPool + L2Advertisement
  ansible.builtin.shell: |
    cat <<'MANIFEST' | kubectl apply -f -
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: delonix-pool
      namespace: metallb-system
    spec:
      addresses:
        - {{ _metallb_pool }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: delonix-l2
      namespace: metallb-system
    spec:
      ipAddressPools:
        - delonix-pool
    MANIFEST
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

# ============================================================
# 9. TRANSFERIR IMAGENS DOCKER (local → remoto → kind load)
# ============================================================

- name: Diretório para os tarballs no servidor
  ansible.builtin.file:
    path: /tmp/dlx-images
    state: directory
    mode: "0755"

- name: Copiar imagem server (tar.gz)
  ansible.builtin.copy:
    src: /tmp/dlx-images/delonix-server.tar.gz
    dest: /tmp/dlx-images/delonix-server.tar.gz
    mode: "0644"

- name: Copiar imagem web (tar.gz)
  ansible.builtin.copy:
    src: /tmp/dlx-images/delonix-web.tar.gz
    dest: /tmp/dlx-images/delonix-web.tar.gz
    mode: "0644"

# Os `.tar.gz` chegam do lado local (`make export-images`, que usa o MESMO motor).
# O `delonix image load`/`docker load`/`podman load` leem todos o mesmo arquivo:
# desde delonix v0.35.1 o `image save` escreve OCI layout + `manifest.json` legado.
- name: "Descomprimir os tarballs (o load lê `.tar`)"
  ansible.builtin.command: "gunzip -kf /tmp/dlx-images/{{ item }}.tar.gz"
  loop: [delonix-server, delonix-web]
  changed_when: true

- name: "Carregar as imagens no motor do servidor ({{ container_engine }})"
  ansible.builtin.command: "{{ engine_load }} /tmp/dlx-images/{{ item }}.tar"
  loop: [delonix-server, delonix-web]
  become: "{{ not engine_rootless }}"
  changed_when: true

# A tag é OBRIGATÓRIA e vem do `make` (`-e image_tag=$(IMAGE_TAG)`, o mesmo
# `git describe` com que as imagens foram construídas e exportadas).
#
# BUG CORRIGIDO AQUI: isto usava `image_tag | default('latest')` e `image_tag`
# não estava definido em lado nenhum — logo carregava sempre `:latest`. Só que o
# `make export-images` deste mesmo PR deixou de exportar `:latest` DE PROPÓSITO
# (é o "imagem stale" documentado no HARNESS.md): ou a tarefa falha, ou injecta
# uma imagem velha que por acaso ainda esteja no nó. Um default silencioso para
# a tag errada é precisamente o que a regra "nunca confiar no :latest" proíbe.
- name: "A tag das imagens tem de ser explícita"
  ansible.builtin.assert:
    that: image_tag is defined and image_tag | length > 0
    fail_msg: >-
      `image_tag` não definido. O deploy injecta a tag versionada com que as
      imagens foram construídas — corre `make deploy-kaeso` (que a passa), ou
      `ansible-playbook site.yml -e image_tag=$(git describe --tags --always)`.

- name: "Injectar as imagens no cluster ({{ container_engine }})"
  ansible.builtin.command: >-
    {{ 'delonix cluster load ' ~ item ~ ':' ~ image_tag ~ ' --name ' ~ kind_cluster_name
       if container_engine == 'delonix'
       else 'kind load docker-image ' ~ item ~ ':' ~ image_tag ~ ' --name ' ~ kind_cluster_name }}
  loop: [delonix-server, delonix-web]
  become: "{{ not engine_rootless }}"
  changed_when: true

# ============================================================
# 10. MANIFESTS K8S
# ============================================================

# ---- Copiar manifests K8s para o servidor remoto ----
- name: Copiar manifests K8s para o servidor
  ansible.builtin.copy:
    src: "{{ _k8s_dir }}/"
    dest: /tmp/dlx-k8s/
    mode: "0644"

- name: Namespace
  ansible.builtin.command: kubectl apply -f /tmp/dlx-k8s/00-namespace.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Secret TLS (wildcard self-signed)
  ansible.builtin.shell: |
    kubectl create secret tls delonix-tls \
      --cert=/etc/ssl/delonix/fullchain.pem \
      --key=/etc/ssl/delonix/privkey.pem \
      -n delonix-meet --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: ConfigMap + Secret da app (overrides preprod)
  ansible.builtin.template:
    src: app-configmap.yaml.j2
    dest: /tmp/dlx-configmap.yaml
    mode: "0600"

- name: Aplicar ConfigMap e Secret
  ansible.builtin.command: kubectl apply -f /tmp/dlx-configmap.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Aplicar manifestos de dados (PVCs, storage)
  ansible.builtin.command: kubectl apply -f /tmp/dlx-k8s/50-data.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Helm repos (bitnami)
  ansible.builtin.shell: |
    helm repo add bitnami https://charts.bitnami.com/bitnami 2>/dev/null || true
    helm repo update bitnami
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

# Pré-pull das imagens infra + kind load — evita timeout do Helm em ligações lentas
# Infra (postgres/redis): o containerd do kind faz pull diretamente do registry.
# Não usar kind load docker-image/image-archive — ambos usam --all-platforms
# e falham com imagens multi-arch do bitnami (digest das outras arch não existe localmente).

- name: Instalar Postgres standalone via Helm
  ansible.builtin.shell: |
    helm upgrade --install delonix-postgres bitnami/postgresql \
      -n delonix-meet \
      --set auth.database=delonix_meet \
      --set auth.username=delonix \
      --set auth.password="{{ postgres_password }}" \
      --set primary.resources.requests.memory=256Mi \
      --set primary.resources.requests.cpu=100m \
      --set primary.resources.limits.memory=512Mi \
      --wait --timeout 600s
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Instalar Redis standalone via Helm
  ansible.builtin.shell: |
    helm upgrade --install delonix-redis bitnami/redis \
      -n delonix-meet \
      --set auth.enabled=false \
      --set architecture=standalone \
      --set master.resources.requests.memory=128Mi \
      --set master.resources.requests.cpu=50m \
      --set master.resources.limits.memory=256Mi \
      --wait --timeout 300s
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Aplicar manifesto server (1 réplica)
  ansible.builtin.shell: |
    cat /tmp/dlx-k8s/02-server.yaml \
      | sed 's/replicas: [0-9]*/replicas: {{ k8s_server_replicas }}/' \
      | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Aplicar manifesto web (1 réplica)
  ansible.builtin.shell: |
    cat /tmp/dlx-k8s/03-web.yaml \
      | sed 's/replicas: [0-9]*/replicas: {{ k8s_web_replicas }}/' \
      | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Aplicar Ollama (se habilitado)
  ansible.builtin.command: kubectl apply -f /tmp/dlx-k8s/07-ollama.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  when: ollama_enabled | bool
  changed_when: false

- name: Ingress (dual-domain)
  ansible.builtin.template:
    src: ingress.yaml.j2
    dest: /tmp/dlx-ingress.yaml
    mode: "0644"

- name: Aplicar ingress
  ansible.builtin.command: kubectl apply -f /tmp/dlx-ingress.yaml
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

# ============================================================
# 11. PIN IMAGES + ROLLOUT
# ============================================================

# Recreate evita maxSurge em nó com poucos recursos (single-replica preprod)
- name: Estratégia Recreate em single-replica
  ansible.builtin.command: >-
    kubectl patch deployment {{ item }} -n delonix-meet
    -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  when: k8s_server_replicas | int == 1
  loop:
    - delonix-server
    - delonix-web
  changed_when: false

# Remover deployment Ollama quando desligado (pode ter ficado de deploy anterior)
- name: Remover Ollama quando desligado
  ansible.builtin.command: kubectl delete deployment delonix-ollama -n delonix-meet --ignore-not-found
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  when: not (ollama_enabled | bool)
  changed_when: false

- name: Aguardar server rollout
  ansible.builtin.command: >-
    kubectl rollout status deployment/delonix-server -n delonix-meet --timeout=600s
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Aguardar web rollout
  ansible.builtin.command: >-
    kubectl rollout status deployment/delonix-web -n delonix-meet --timeout=300s
  environment:
    KUBECONFIG: "{{ kind_kubeconfig }}"
  changed_when: false

- name: Resumo do deploy
  ansible.builtin.debug:
    msg:
      - ✓ Delonix Meet preprod activo
      - "  Interno:  https://{{ domain }}"
      - "  Externo:  https://{{ domain_external }}"
      - "  IP:       {{ public_ip_effective }}"
      - "  Cluster:  {{ kind_cluster_name }}"
      - "  TLS:      self-signed (adicionar CA ao browser para eliminar aviso)"
      - "  TURN:     {{ public_ip_effective }}:3478 (coturn no host)"
      - "  Ollama:   {{ 'activo (' + ollama_model_summary + ')' if ollama_enabled | bool else 'desligado' }}"
