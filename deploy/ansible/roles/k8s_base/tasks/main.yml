---
# O que TODO o nó precisa, control-plane ou trabalho. O cloud-init já desligou
# a swap e pôs os sysctl; isto confirma-os (uma VM recriada à mão não passou
# por lá) e instala o que o kubeadm exige.
- name: A swap fica desligada
  ansible.builtin.command: swapoff -a
  changed_when: false
  when: ansible_swaptotal_mb | default(0) > 0

- name: Módulos do kernel para o containerd e o k8s
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]

- name: sysctl que o kubeadm confere no pré-voo
  ansible.posix.sysctl:
    name: "{{ item.k }}"
    value: "{{ item.v }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop:
    - { k: net.ipv4.ip_forward, v: "1" }
    - { k: net.bridge.bridge-nf-call-iptables, v: "1" }
    - { k: net.bridge.bridge-nf-call-ip6tables, v: "1" }
    # Uma sala com muitos pares abre muitos sockets; o valor por omissão (4096)
    # chega para um laboratório e não para produção.
    - { k: net.core.somaxconn, v: "65535" }
    - { k: fs.inotify.max_user_instances, v: "8192" }
    - { k: fs.inotify.max_user_watches, v: "524288" }

- name: Dependências
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, containerd, nfs-common]
    state: present
    update_cache: true

- name: Configuração do containerd
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false

- name: O containerd usa o cgroup do systemd
  ansible.builtin.copy:
    # SystemdCgroup=true: sem isto, o kubelet e o containerd gerem cgroups por
    # caminhos diferentes e os limites de memória não são respeitados — os pods
    # são mortos por OOM com o cluster a dizer que há folga.
    content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: reiniciar containerd

- name: Chave do repositório do Kubernetes
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_serie }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Repositório do Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_serie }}/deb/ /"
    filename: kubernetes
    state: present

- name: kubelet, kubeadm e kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true

- name: As três ficam presas à série escolhida
  # Sem `hold`, um `apt upgrade` sobe o kubelet para a série seguinte e o nó
  # deixa de falar com o control-plane. Já aconteceu a muita gente.
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]
