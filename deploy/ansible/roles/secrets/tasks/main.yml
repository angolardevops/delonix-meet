---
# Segredos — a geração/persistência acontece nos lookup('password', ...) de
# group_vars/all.yml (cria na 1ª vez, reusa depois → idempotente, zero-touch).
# Esta role só garante permissões e reporta. Corre no controlador.

- name: "Garantir diretório de segredos com permissões restritas"
  ansible.builtin.file:
    path: "{{ _secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: "Materializar segredos (força a avaliação dos 4 lookups persistentes)"
  ansible.builtin.set_fact:
    _secrets_ready: >-
      {{ (jwt_secret | length) > 0 and (turn_secret | length) > 0
         and (postgres_password | length) > 0 and (voice_secret | length) > 0 }}

- name: "Proteger ficheiros de segredo (0600)"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop:
    - "{{ _secrets_dir }}/jwt_secret"
    - "{{ _secrets_dir }}/turn_secret"
    - "{{ _secrets_dir }}/postgres_password"
    - "{{ _secrets_dir }}/voice_secret"
  delegate_to: localhost
  run_once: true

- name: "Segredos prontos"
  ansible.builtin.debug:
    msg: >
      Segredos gerados/reusados em {{ _secrets_dir }} (gitignored).
      JWT/TURN/DB/VOICE persistidos — re-deploy não os regenera.
