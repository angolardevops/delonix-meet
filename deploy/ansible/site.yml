---
# ============================================================
#  Delonix Meet — deploy zero-touch (single-host | multi-host | kind)
#
#  Modo escolhido em deploy/config.yml (deploy_mode). Correr via:
#     make deploy               (lê deploy/config.yml)
#     make deploy-kaeso         (preprod kaeso — kind remoto)
#  ou  cd deploy/ansible && ansible-playbook site.yml --ask-become-pass
#
#  Idempotente: IPs, DNS, TLS e segredos gerados sem intervenção humana.
# ============================================================

# ---- Play 0: preflight + segredos (no controlador) ----
- name: "Preflight — validar config, resolver IP, decidir TLS/segredos"
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - preflight
    - secrets

# ---- Play 1: SINGLE-HOST (docker infra + TLS + DNS + systemd + nginx) ----
- name: "Single-host — deploy da stack"
  hosts: single_host
  become: true
  gather_facts: true
  roles:
    - role: preflight            # resolve public_ip_effective NESTE host também
      when: deploy_mode == 'single-host'
    - role: dns
      when: deploy_mode == 'single-host'
    - role: tls
      when: deploy_mode == 'single-host'
    - role: single_host
      when: deploy_mode == 'single-host'

# ---- Play 2: MULTI-HOST — provisionar o cluster (kubeadm + MetalLB + ingress) ----
# (Grupos estáticos; as roles são gated por deploy_mode. Em single-host estes
#  plays correm mas saltam as roles — inofensivo.)
- name: "Multi-host — provisionar cluster Kubernetes"
  hosts: kube_control_plane:kube_node
  become: true
  gather_facts: true
  roles:
    - role: k8s_infra
      when: deploy_mode == 'multi-host'

# ---- Play 3: MULTI-HOST — deploy da app (secrets, config, cert-manager, DNS, manifests) ----
- name: "Multi-host — deploy da aplicação Delonix"
  hosts: kube_control_plane
  become: true
  gather_facts: true
  roles:
    - role: dns
      when: deploy_mode == 'multi-host'
    - role: k8s_app
      when: deploy_mode == 'multi-host'

# ---- Play 4: KIND — servidor remoto com recursos limitados (preprod/stage) ----
# Imagens exportadas localmente antes do play via `make export-images`.
- name: Kind — deploy preprod num servidor remoto
  hosts: kind_host
  become: true
  gather_facts: true
  roles:
    - role: kind_host
      when: deploy_mode == 'kind'
