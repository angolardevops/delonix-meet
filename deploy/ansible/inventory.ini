# ============================================================
#  Delonix Meet — inventário de deploy
#
#  single-host : preenche [single_host] com o servidor alvo.
#  multi-host  : preenche [kube_control_plane] + [kube_node].
#
#  O MODO é escolhido em deploy/config.yml (deploy_mode), não aqui.
#  Por omissão tudo aponta para localhost (deploy na própria máquina).
# ============================================================

# ---- SINGLE-HOST ----
# O host onde corre a stack (docker infra + systemd + nginx).
[single_host]
localhost ansible_connection=local
# Remoto:  meet01 ansible_host=203.0.113.10 ansible_user=root

# ---- MULTI-HOST (Kubernetes / kubeadm) ----
# metallb_ip_range: sub-range da rede física para LoadBalancer services.
# (também configurável em config.yml → kubernetes.metallb_ip_range)
[kube_control_plane]
localhost ansible_connection=local metallb_ip_range=192.168.1.200-192.168.1.250

[kube_node]
# node1 ansible_host=10.0.0.11 ansible_user=root metallb_ip_range=192.168.1.200-192.168.1.250

[k8s_cluster:children]
kube_control_plane
kube_node
