#!KAMAILIO
# Delonix Meet — SIP proxy / SBC de borda para dial-in PSTN.
# Recebe inbound do SIP trunk (após ACL de IP), normaliza, e faz LOAD-BALANCE
# (dispatcher) para o pool de nós FreeSWITCH — chave para escalar 300+ canais.
# TLS obrigatório na sinalização; media (SRTP) é ponta-a-ponta com o FreeSWITCH.
#
# Segredos/IPs NÃO em claro no repo: os IPs do trunk vêm de dispatcher/permissions
# e o certificado TLS é montado por volume (ver compose.yaml).
#
# ---------------------------------------------------------------------------
# NOTA (Fase 1 dos ramais internos, ver server/src/ramais.rs): este ficheiro
# NÃO foi alterado para a chamada ramal-a-ramal, de propósito.
#
# Hoje só carrega tm/sl/rr/pv/textops/siputils/sanity/dispatcher/permissions/
# tls — sem usrloc, sem registrar, sem auth_db, e sem NENHUMA ligação a uma
# base de dados. Dar-lhe capacidade de registo SIP (para os ramais fazerem
# REGISTER e serem encontrados uns pelos outros) exigia módulos novos e uma
# ligação Postgres que ele não tem hoje — maior risco do que esta fase pede,
# e tocaria exactamente o caminho do dial-in PSTN que a tarefa pede para não
# tocar.
#
# A decisão tomada: os ramais registam-se e ligam-se DIRECTAMENTE a um perfil
# Sofia novo no FreeSWITCH (porta distinta desta, ver
# voice/freeswitch/sip_profiles/internal.xml e DELONIX_RAMAIS_SIP_PORT em
# compose.yaml), usando o directório dinâmico do FreeSWITCH
# (mod_xml_curl → control plane Rust) em vez de um subscriber table aqui.
# Este ficheiro continua a servir SÓ o trunk PSTN, tal como antes.
#
# Se uma fase futura quiser os ramais alcançáveis pela MESMA porta pública
# que o trunk (ex.: para funcionar através de um firewall que só deixa
# 5060/5061 saírem), a forma correcta é dar a este Kamailio usrloc+registrar+
# auth_db novos, com uma ligação Postgres própria (não reaproveitar a
# ligação do control plane) — decisão para um ADR, não para uma linha aqui.
# ---------------------------------------------------------------------------

####### Global #######
# Sem isto o módulo tls carrega-se mas fica desligado, e o listen=tls falha.
enable_tls=yes
# Escuta-se numa INTERFACE, não em 0.0.0.0. Com 0.0.0.0 o Kamailio punha
# literalmente `0.0.0.0` no Record-Route — o endereço para onde quem liga manda
# o ACK e o BYE. O ACK nunca saía, o FreeSWITCH repetia o 200 OK e desligava a
# chamada aos 32 s: TODAS as chamadas pelo bordo morriam aí (R277, medido a
# 2026-10-04 com uma central e com um softphone). As chamadas de prova duravam
# 4 s e nunca o viram.
#
# DELONIX_SIP_IFACE muda a interface (omissão: eth0, a de um contentor ou pod).
# DELONIX_SIP_ADVERTISE dá o endereço a anunciar quando não é o da interface —
# um bordo atrás de NAT ou com endereço público noutro equipamento.
#!trydefenv DELONIX_SIP_IFACE
#!ifndef DELONIX_SIP_IFACE
#!define DELONIX_SIP_IFACE eth0
#!endif
#!trydefenv DELONIX_SIP_ADVERTISE
#!ifdef DELONIX_SIP_ADVERTISE
listen=udp:DELONIX_SIP_IFACE:5060 advertise DELONIX_SIP_ADVERTISE:5060
listen=tcp:DELONIX_SIP_IFACE:5060 advertise DELONIX_SIP_ADVERTISE:5060
listen=tls:DELONIX_SIP_IFACE:5061 advertise DELONIX_SIP_ADVERTISE:5061
#!else
listen=udp:DELONIX_SIP_IFACE:5060
listen=tcp:DELONIX_SIP_IFACE:5060
listen=tls:DELONIX_SIP_IFACE:5061
#!endif
tcp_connection_lifetime=3605
#!ifdef WITH_XHTTP_RPC
tcp_accept_no_cl=yes      # um pedido HTTP sem Content-Length não é SIP malformado
#!endif
auto_aliases=no

####### Modules #######
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "xlog.so"      # o routing usa xlog(); sem o módulo o parser recusa o ficheiro
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "dispatcher.so"
loadmodule "permissions.so"
loadmodule "tls.so"
loadmodule "ctl.so"       # socket de controlo: `kamcmd dispatcher.list` é como se vê o estado do pool

# ---- A central de uma organização (ADR-0016) ----
# Quem não é um tronco contratado só entra como CENTRAL de uma organização:
# por TLS, e autenticada por digest com a conta SIP dela («Registo SIP»,
# ADR-0009 §5). Este proxy continua sem base de dados: pede o HA1 da conta ao
# control plane (DELONIX_CONTROL_URL, com o VOICE_INTERNAL_SECRET) e verifica
# ele próprio a resposta. Sem DELONIX_CONTROL_URL nada disto se liga, e quem
# não está na allowlist leva 403 como sempre levou.
#!trydefenv DELONIX_CONTROL_URL
#!ifdef DELONIX_CONTROL_URL
loadmodule "auth.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "counters.so"
# Quantas chamadas de centrais o bordo autenticou e quantas recusou, desde que
# arrancou: `kamcmd cnt.get script centrais_autenticadas` (e `_recusadas`). O
# Kamailio corre sem L_INFO nem L_NOTICE — sem isto, uma central que entra não
# deixava rasto nenhum no bordo.
modparam("counters", "script_counter", "centrais_autenticadas")
modparam("counters", "script_counter", "centrais_recusadas")
# Um desafio vale 30 s: é o tempo que uma resposta capturada serviria a alguém.
modparam("auth", "nonce_expire", 30)
# Falhas de autenticação por origem, esquecidas ao fim de 5 minutos.
modparam("htable", "htable", "falhas=>size=8;autoexpire=300;initval=0;")
# O control plane responde em milissegundos ou não responde: um worker SIP não
# fica à espera dele.
modparam("http_client", "connection_timeout", 2)
modparam("http_client", "httpredirect", 0)
#!endif

# Dispatcher: pool de FreeSWITCH (grupo 1), com healthcheck por OPTIONS.
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 15)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "flags", 2)          # 2 = algoritmo round-robin com estado
# Permissions: allowlist de IPs do trunk. Sem base de dados, o módulo lê o
# `address_file` — grupo, IP, máscara, porta, etiqueta, uma origem por linha.
# (Havia aqui um `allow_suspicious_manips`, que não é parâmetro deste módulo:
# o ficheiro não passava do parser. Apanhado na primeira vez que arrancou, a
# 2026-10-03, no cluster local.)
modparam("permissions", "address_file", "/etc/kamailio/address")
# Interface WEB de gestão (xhttp_rpc), só em laboratório: liga-se com
# `kamailio -A WITH_XHTTP_RPC`. Responde em HTTP na porta TCP do SIP (5060),
# no caminho /rpc, e NÃO tem autenticação própria — só se expõe atrás de um
# proxy que a exija (a borda do compose.yaml). Em produção não se define.
#!ifdef WITH_XHTTP_RPC
loadmodule "xhttp.so"
loadmodule "xhttp_rpc.so"
modparam("xhttp_rpc", "xhttp_rpc_root", "rpc")
#!endif
# TLS: certificado montado por volume (nunca comitado).
modparam("tls", "config", "/etc/kamailio/tls.cfg")

####### Routing #######
request_route {
    # 1) Sanidade + limites básicos anti-flood.
    if (!sanity_check("1511", "7")) { exit; }

    # 2) CANCEL/ACK dentro de diálogo → seguir a rota gravada.
    if (has_totag()) {
        if (loose_route()) { route(RELAY); }
        else if (is_method("ACK")) { route(RELAY); }
        else { sl_send_reply("404", "Not here"); }
        exit;
    }

    # 3) Só INVITE inbound de conferência nos interessa aqui.
    if (!is_method("INVITE|OPTIONS")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }
    if (is_method("OPTIONS")) { sl_send_reply("200", "OK"); exit; }

    # 4) ANTI-TOLL-FRAUD: só se aceita inbound de IPs do trunk (allowlist).
    #    'ao_trunk.txt' contém os IPs/subnets do fornecedor aprovado (5.1).
    #    Quem não está lá só entra como central autenticada de uma organização.
    #
    #    Os cabeçalhos `X-Delonix-*` são NOSSOS — o que diz «esta chamada é da
    #    central de X» é um deles. Vindos de fora tiram-se sempre, esteja a
    #    origem na allowlist ou não.
    remove_hf_re("^X-Delonix-");
    if (!allow_source_address("1")) {
        route(CENTRAL);
    }

    # 5) Record-Route + dispatch para um nó FreeSWITCH saudável.
    record_route();
    if (!ds_select_dst("1", "4")) {   # grupo 1, alg 4 = round-robin
        sl_send_reply("503", "No media node available");
        exit;
    }
    xlog("L_INFO", "dial-in $rU → FreeSWITCH $du\n");
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

# A central de uma organização (ADR-0016). Volta daqui só quem se autenticou;
# todos os outros levam a resposta e a rota acaba.
route[CENTRAL] {
#!ifndef DELONIX_CONTROL_URL
    xlog("L_WARN", "SIP rejeitado de origem não autorizada: $si\n");
    sl_send_reply("403", "Forbidden");
    exit;
#!else
    # As chaves do SRTP (SDES) viajam no SDP: uma central só fala por TLS.
    if (proto != TLS) {
        xlog("L_WARN", "SIP rejeitado de origem não autorizada, sem TLS: $si\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    # Travão por origem: à décima falha em 5 minutos deixa-se de perguntar ao
    # control plane e de responder com desafios.
    if ($sht(falhas=>$si) >= 10) {
        xlog("L_WARN", "central: origem $si travada por falhas de autenticação\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    # Sem credenciais: o desafio. O realm é o domínio que a central apresenta —
    # é ele que diz de que organização é a conta.
    if ($au == $null || $ar == $null) {
        proxy_challenge("$fd", "1");
        exit;
    }
    # O utilizador e o realm vão dentro de um JSON: só o alfabeto de um AOR e
    # de um nome de host.
    if (!($au =~ "^[A-Za-z0-9._+@-]+$") || !($ar =~ "^[A-Za-z0-9.-]+$")) {
        $var(n) = $shtinc(falhas=>$si);
        sl_send_reply("403", "Forbidden");
        exit;
    }
    $var(corpo) = "{\"domain\":\"" + $ar + "\",\"username\":\"" + $au + "\"}";
    $var(rc) = http_client_query("$env(DELONIX_CONTROL_URL)/internal/v1/telephony/edge/sip-account",
        "$var(corpo)",
        "Content-Type: application/json\r\nX-Voice-Secret: $env(VOICE_INTERNAL_SECRET)",
        "$var(ha1)");
    if ($var(rc) == 200) {
        # "1": o segundo argumento já é o HA1, não a password.
        if (pv_proxy_authenticate("$ar", "$var(ha1)", "1")) {
            # As credenciais ficam aqui; para dentro segue só quem a central é.
            consume_credentials();
            append_hf("X-Delonix-Central: $ar\r\n");
            cnt_inc("centrais_autenticadas");
            xlog("L_NOTICE", "central $ar autenticada de $si\n");
            return;
        }
    } else if ($var(rc) != 404) {
        # Control plane em baixo ou a recusar o segredo: não é culpa de quem
        # liga, e não conta como falha dele.
        xlog("L_ERR", "central: o control plane respondeu $var(rc) ao pedido da conta\n");
        sl_send_reply("503", "Service Unavailable");
        exit;
    }
    # Conta que não existe e resposta errada levam o MESMO desafio: quem liga
    # não distingue «não há essa conta» de «a password está errada».
    $var(n) = $shtinc(falhas=>$si);
    cnt_inc("centrais_recusadas");
    xlog("L_WARN", "central: autenticação falhada de $si ($var(n) em 5 min)\n");
    proxy_challenge("$fd", "1");
    exit;
#!endif
}


#!ifdef WITH_XHTTP_RPC
event_route[xhttp:request] {
    if ($hu =~ "^/rpc") {
        dispatch_xhttp_rpc();
    } else {
        xhttp_reply("404", "Not Found", "text/plain", "so /rpc\n");
    }
}
#!endif
