; PBX de cliente (laboratório) — tronco PJSIP para o bordo do Meet (Kamailio).
; chan_pjsip, não chan_sip. Um endpoint por tronco, sem endpoint anónimo.
[global]
type = global
user_agent = pbx-cliente-lab

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---- o tronco para o Meet ----
[meet]
type = endpoint
transport = transport-udp
context = do-meet            ; o que vem do Meet NÃO alcança as rotas de saída
disallow = all
allow = alaw,ulaw             ; G.711: lei A primeiro
aors = meet
direct_media = no
dtmf_mode = rfc4733           ; DTMF fora de banda, payload 101
media_encryption = sdes       ; o dial-in do Meet exige SRTP
media_encryption_optimistic = no
from_domain = pbx-cliente
send_pai = yes

; Nome COMPLETO do serviço: o resolvedor do Asterisk não aplica os domínios de
; pesquisa do pod, e com o nome curto o tronco fica «Unavail».
[meet]
type = aor
contact = sip:kamailio.delonix-meet.svc.cluster.local:5060
qualify_frequency = 15        ; OPTIONS de vida ao bordo

[meet]
type = identify
endpoint = meet
match = kamailio.delonix-meet.svc.cluster.local

; ---- o tronco da CENTRAL para o Meet (ADR-0016) ----
; O mesmo PBX, como central autenticada da organização: o tronco `meet-central`,
; por TLS. Vem de voice/pbx-cliente/central.conf.tmpl, com o nome do bordo e a
; password postos pelo scripts/cluster-voice.sh — incluído se existir.
#tryinclude pbx-central.conf
