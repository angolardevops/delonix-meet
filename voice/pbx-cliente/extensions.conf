; PBX de cliente (laboratório).
[general]
static = yes
writeprotect = yes

; O que os ramais do cliente podem marcar: só números em E.164 vão ao Meet.
[ramais]
exten => _+X.,1,NoOp(para o Meet: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@meet,30)
 same => n,Hangup()

; O que chega do Meet fica aqui — sem acesso a nenhuma rota de saída.
[do-meet]
exten => _X.,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; Prova de laboratório: atende-se a chamada ao Meet, marca-se um PIN por DTMF
; (RFC 4733) e espera-se. O PIN é inventado — serve para ver o IVR a
; perguntar ao servidor e a ser recusado, não para entrar numa sala.
;   asterisk -rx "channel originate PJSIP/+244222000001@meet extension s@prova-pin"
[prova-pin]
exten => s,1,Wait(2)
 same => n,SendDTMF(123456#,200,150)
 same => n,Wait(8)
 same => n,Hangup()
