; PBX de cliente (laboratório).
[general]
static = yes
writeprotect = yes

; O que os ramais do cliente podem marcar: só números em E.164 vão ao Meet.
[ramais]
exten => _+X.,1,NoOp(para o Meet: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@meet,30)
 same => n,Hangup()

; O que chega do Meet fica aqui — sem acesso a nenhuma rota de saída.
[do-meet]
exten => _X.,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; Prova de laboratório: atende-se a chamada ao Meet, marca-se o PIN por DTMF
; (RFC 4733) e fica-se em linha. O PIN é a própria extensão marcada:
;   asterisk -rx "channel originate PJSIP/+244222000001@meet extension 123456@prova-pin"
; Com um PIN inventado vê-se o IVR a recusar; com o de uma sala, a entrar.
[prova-pin]
exten => _XXXXXX,1,Wait(3)
 same => n,SendDTMF(${EXTEN}#,200,150)
 same => n,Wait(20)
 same => n,Hangup()
