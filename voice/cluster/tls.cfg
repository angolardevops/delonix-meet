# TLS do Kamailio no cluster local: certificado self-signed gerado pelo
# scripts/cluster-voice.sh (Secret `kamailio-tls`).
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/tls.key
certificate = /etc/kamailio/tls/tls.crt

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
