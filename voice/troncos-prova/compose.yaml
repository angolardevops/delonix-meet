# Réplica para a prova dos troncos (scripts/troncos-prova.sh): o servidor, o
# FreeSWITCH do Meet arrancado como no compose.yaml da raiz, e uma operadora de
# ENSAIO. Projecto, rede e endereços próprios — nunca o laboratório.
#
# Nenhuma porta é publicada: a operadora de ensaio, que corre a configuração
# vanilla, só se alcança desta rede. Não é uma rede `internal` de propósito —
# sem rota por omissão o FreeSWITCH escolhe 127.0.0.1 para escutar, e os dois
# deixavam de se ver.
name: troncosprova

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: delonix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: delonix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delonix"]
      interval: 2s
      retries: 30
    networks: { troncos: { ipv4_address: 172.30.51.10 } }

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    networks: { troncos: { ipv4_address: 172.30.51.11 } }

  server:
    image: ${SERVER_IMAGE:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://delonix:${POSTGRES_PASSWORD}@172.30.51.10:5432/delonix
      REDIS_URL: redis://172.30.51.11:6379
      JWT_SECRET: ${JWT_SECRET:?}
      TURN_SECRET: ${TURN_SECRET:?}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET:?}
      VOICE_INTERNAL_SECRET: ${VOICE_INTERNAL_SECRET:?}
      BIND_ADDR: 0.0.0.0:8180
      INTERNAL_BIND_ADDR: 0.0.0.0:8181
      TURN_HOST: prova.invalid:3478
      CORS_ORIGINS: https://prova.invalid
      RECORDINGS_DIR: /tmp/recordings
      REGISTRATION_MODE: open
      # A API recusa — e bem — um tronco para um endereço interno (R213). A
      # operadora de ensaio vive nesta rede: é a excepção que o operador declara.
      OUTBOUND_ALLOW_HOSTS: 172.30.51.20
    networks: { troncos: { ipv4_address: 172.30.51.12 } }

  # O FreeSWITCH do Meet. Os ficheiros de /meet NÃO estão aqui: o script
  # copia-os a partir da lista do compose.yaml da raiz, para a prova correr
  # com o que a instalação corre e não com uma lista sua.
  freeswitch:
    image: ${FS_IMAGE:-delonix-meet/freeswitch:1.11.3}
    entrypoint: ["/bin/sh"]
    command: ["/entrypoint/freeswitch-entrypoint.sh"]
    environment:
      VOICE_INTERNAL_SECRET: ${VOICE_INTERNAL_SECRET:?}
      DELONIX_CONTROL_URL: http://172.30.51.12:8181
      DELONIX_RAMAIS_SIP_PORT: "5070"
      DELONIX_TRUNKS_RESCAN_SECS: ${RESCAN_SECS:-10}
    volumes:
      - ${ESTADO:?}/entrypoint:/entrypoint:ro
      - ${ESTADO:?}/meet:/meet:ro
    networks: { troncos: { ipv4_address: 172.30.51.13 } }

  operadora:
    image: ${FS_IMAGE:-delonix-meet/freeswitch:1.11.3}
    entrypoint: ["/bin/sh"]
    command: ["/operadora/operadora-entrypoint.sh"]
    environment:
      OPERADORA_PASSWORD: ${OPERADORA_PASSWORD:?}
    volumes:
      - ./operadora-entrypoint.sh:/operadora/operadora-entrypoint.sh:ro
      - ./operadora-dialplan.xml:/operadora/operadora-dialplan.xml:ro
    networks: { troncos: { ipv4_address: 172.30.51.20 } }

networks:
  troncos:
    ipam:
      config:
        - subnet: 172.30.51.0/24
          gateway: 172.30.51.1
