[package]
name = "delonix-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
webrtc = "0.17.1"
anyhow = "1.0.103"
aes-gcm = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
url = "2"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1.13.0"
# Limpeza de material de chave em memória (ver signaling::Secret).
zeroize = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"

# webrtc-ice 0.17.1 com UMA alteração: responde 487 (Role Conflict) autenticado
# a um pedido com o mesmo papel ICE que o do agente, em vez de o deitar fora
# (`send_role_conflict` em vendor/webrtc-ice/src/agent/agent_internal.rs).
# Sem ela o Chrome, que passa a CONTROLLED ao responder a cada oferta do SFU,
# perdia o consentimento ICE ~5 s depois de ligar — R157. Nem a 0.17.2 trata o
# conflito. Retirar este patch só quando o upstream o fizer (o teste
# `conflito_de_papel_ice_recebe_487_autenticado` diz se fez).
#
# webrtc 0.17.1 com UMA alteração: o processador de media não declarada deixa
# de sondar (e FECHAR) o stream SRTP de um SSRC que o SDP remoto declara
# (`ssrc_declared_in_remote_description` em
# vendor/webrtc/src/peer_connection/peer_connection_internal.rs). Sem ela, o
# primeiro pacote que chegasse antes do `start_rtp` matava a publicação com o
# publicador ainda a enviar — num nó carregado, 75–87 de 96 fluxos de vídeo em
# 8 salas × 4 (R172). A 0.17.2 não trata disto e a 0.20 é outra API. Retirar só
# quando o upstream o fizer.
[patch.crates-io]
webrtc-ice = { path = "vendor/webrtc-ice" }
webrtc = { path = "vendor/webrtc" }
