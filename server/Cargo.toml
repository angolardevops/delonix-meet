# Workspace do backend (ADR-0005 §1). O pacote na raiz (`delonix-server`) é o
# monólito em transição: o código sai dele para os crates em `crates/`, fatia a
# fatia, e nenhuma fatia nova volta a entrar nele. A regra da dependência entre
# crates é medida por `scripts/check-crate-deps.sh`.
[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
argon2 = "0.5"
base64 = "0.22"

[package]
name = "delonix-server"
version = "0.1.0"
edition = "2021"

[dependencies]
delonix-meet-core = { path = "crates/delonix-meet-core" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
webrtc = "0.17.1"
anyhow = "1.0.103"
aes-gcm = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
url = "2"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1.13.0"
# Limpeza de material de chave em memória (ver signaling::Secret).
zeroize = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
# Testes de integração em tests/: `#[sqlx::test]` dá a cada teste uma base
# própria, migrada, no Postgres de DATABASE_URL.
sqlx = { version = "0.8", features = ["macros"] }
