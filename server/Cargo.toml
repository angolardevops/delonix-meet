# Workspace do backend (ADR-0006 §1). O pacote na raiz (`delonix-server`) é o
# monólito em transição: o código sai dele para os crates em `crates/`, fatia a
# fatia, e nenhuma fatia nova volta a entrar nele. A regra da dependência entre
# crates é medida por `scripts/check-crate-deps.sh`.
[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
argon2 = "0.5"
base64 = "0.22"

[package]
name = "delonix-server"
version = "0.1.0"
edition = "2021"

[dependencies]
delonix-meet-core = { path = "crates/delonix-meet-core" }
delonix-meet-domain = { path = "crates/delonix-meet-domain" }
delonix-meet-protocol = { path = "crates/delonix-meet-protocol" }
delonix-meet-store = { path = "crates/delonix-meet-store" }
# Traits com métodos `async` usados como `dyn`: as portas da telefonia
# (`domain::telephony::ports`, ADR-0009) e a política de admissão do UA SIP da
# ponte (`phone_bridge::sip::BridgeAdmission`, ADR-0010).
async-trait = "0.1"
# gRPC interno (ADR-0006 §3): mTLS com rustls/ring, health e reflection.
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
# OpenAPI 3.1 gerado do código (ADR-0006 §3): o cliente TS do web gera-se daqui.
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Rastos por OTLP (ADR-0020, fase 5). A camada SÓ existe com
# `OTEL_EXPORTER_OTLP_ENDPOINT` definida: sem ela o servidor arranca como
# sempre arrancou, e isto não é peso no caminho de ninguém.
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.31"
tracing-opentelemetry = "0.32"
rand = "0.8"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
# MD5 é obrigatório pelo SIP Digest (RFC 2617/3261: HA1 = MD5(user:realm:pass)) —
# não é uma escolha de segurança nossa, é o que o registar do FreeSWITCH exige
# (ver ramais.rs). Nunca usado para nada que dependa de resistência a colisão.
md-5 = "0.10"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
webrtc = "0.17.1"
anyhow = "1.0.103"
aes-gcm = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
url = "2"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1.13.0"
# Limpeza de material de chave em memória (ver signaling::Secret).
zeroize = "1"
# Traits com métodos `async` usados como `dyn`: a política de admissão do UA SIP
# da ponte (`phone_bridge::sip::BridgeAdmission`) e as portas da telefonia
# (`domain::telephony::ports`, ADR-0009).
# SMPP sobre TLS (ADR-0005, smpps://). `rustls`/`tokio-rustls` e `webpki-roots`
# já estavam na árvore (sqlx, reqwest/openidconnect via rustls-tls, e
# hyper-rustls) — aqui só se tornam dependências directas para o handshake
# `smpps://`. `pem` idem, já usado pelo `jsonwebtoken` e pelo `rcgen`, aqui
# para ler a CA própria de um operador (`SMS_<OPERADOR>_SMPP_CA`).
#
# `default-features = false` + `"ring"` EXPLÍCITO em vez do default do rustls
# 0.23 (`aws_lc_rs`): `dtls` (dependência do `webrtc`, o SFU desde sempre) e o
# `tls-rustls` do `sqlx` já trazem o backend `ring` para a árvore. Com o
# default daqui, o binário ficava com as DUAS crypto providers compiladas ao
# mesmo tempo e o rustls recusa-se a escolher sozinho —
# `Could not automatically determine the process-level CryptoProvider`, um
# panic em QUALQUER ligação TLS do processo (não só a do SMPP) — medido a
# rebentar testes do SFU sem nada a ver com SMPP (ver `pstn_bridge.rs`,
# `sfu_e2e.rs`). Ficar só com `ring`, já usado pelas outras duas dependências,
# resolve sem precisar de um `CryptoProvider::install_default()` espalhado
# por `main()` e por cada teste que toque TLS.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
webpki-roots = "1"
pem = "3"
# SRTP autónomo (fora de um RTCPeerConnection/DTLS) para as pernas da ponte
# telefone↔sala — a MESMA versão 0.17.1 que o `webrtc` já traz transitivamente
# (o SFU usa SRTP hoje só através do handshake DTLS de cada PeerConnection;
# esta é a primeira vez que este código constrói um `Context` SRTP à mão, com
# chaves efémeras geridas pelo control plane em vez de negociadas por DTLS).
webrtc-srtp = "0.17.1"
# Payload RTP partilhado sem cópia entre a bomba do SFU e a ponte, e o payload
# cru antes de cifrar — já transitivo (`webrtc`/`rtp`/`webrtc-srtp` usam-no),
# directo aqui pelo tipo `Bytes` do `rtp::packet::Packet::payload`.
bytes = "1"
# Ponte telefone↔sala (ADR-0010): Opus em Rust puro, sem libopus no sistema nem
# na imagem distroless. Interoperabilidade com a libopus medida nos dois
# sentidos (ADR-0010 §«Medições»).
opus-rs = "=0.1.33"
# statvfs seguro para o espaço livre do volume de gravações (ADR-0014 §2.3).
# Já vinha no Cargo.lock (via tempfile); só se liga a feature `fs`.
rustix = { version = "1", features = ["fs"] }
# Chaves de acesso (WebAuthn/passkeys) como segundo factor — ADR-0011. Crate do
# projecto Kanidm, auditada pela SUSE Product Security (README da crate), com os vectores da especificação.
# `danger-allow-state-serialisation`: o estado da cerimónia guarda-se na base
# (o «finish» pode cair noutro nó); é consumido uma vez e expira em 5 min.
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
# Exportação «os meus dados»: um ZIP sem compressão (gravações vão como links;
# o resto é texto pequeno). Sem `deflate`/`bzip2`/`aes`: menos código nativo.
zip = { version = "2", default-features = false }

[dev-dependencies]
tokio-tungstenite = "0.24"
# Testes de integração em tests/: `#[sqlx::test]` dá a cada teste uma base
# própria, migrada, no Postgres de DATABASE_URL.
sqlx = { version = "0.8", features = ["macros"] }
# Certificados de teste: mTLS do gRPC interno (tests/grpc.rs) e o SMSC falso
# do teste TLS de sms_smpp.rs. Já estava na árvore como dependência normal
# do `webrtc`/`dtls`.
rcgen = "0.13"
# IdP OIDC falso dos testes de segurança (`tests/security_identity.rs`): gera a
# chave RS256 em memória, a cada corrida — nenhuma chave privada no repositório.
# Já vinha no Cargo.lock pelo `openidconnect`.
rsa = "0.9"
# Autenticador WebAuthn em software para os testes das chaves de acesso
# (tests/account_passkeys.rs): regista e assina como um autenticador real.
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }

# webrtc-ice 0.17.1 com UMA alteração: responde 487 (Role Conflict) autenticado
# a um pedido com o mesmo papel ICE que o do agente, em vez de o deitar fora
# (`send_role_conflict` em vendor/webrtc-ice/src/agent/agent_internal.rs).
# Sem ela o Chrome, que passa a CONTROLLED ao responder a cada oferta do SFU,
# perdia o consentimento ICE ~5 s depois de ligar — R157. Nem a 0.17.2 trata o
# conflito. Retirar este patch só quando o upstream o fizer (o teste
# `conflito_de_papel_ice_recebe_487_autenticado` diz se fez).
#
# webrtc 0.17.2 com UMA alteração: um SSRC declarado no SDP remoto deixa de
# passar pela sonda de media não declarada (simulcast), em
# `vendor/webrtc/src/peer_connection/peer_connection_internal.rs`. Sem ela, um
# pacote que chegue entre a sessão SRTP nascer e o `start_rtp` abrir os
# receivers faz a sonda fechar o MESMO stream que o receiver usa: `read_rtp`
# devolve `buffer: closed` e a publicação morre com o publicador a enviar —
# R172. A 0.17.2 publicada não traz a correcção (não existe lá
# `ssrc_declared_in_remote_description`). Retirar este patch só quando o
# upstream o fizer (o teste `entradas_concorrentes_todos_recebem_todos` diz se
# fez).
[patch.crates-io]
webrtc-ice = { path = "vendor/webrtc-ice" }
webrtc = { path = "vendor/webrtc" }
