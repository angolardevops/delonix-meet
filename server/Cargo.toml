# Workspace do backend (ADR-0006 §1). O pacote na raiz (`delonix-server`) é o
# monólito em transição: o código sai dele para os crates em `crates/`, fatia a
# fatia, e nenhuma fatia nova volta a entrar nele. A regra da dependência entre
# crates é medida por `scripts/check-crate-deps.sh`.
[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
argon2 = "0.5"
base64 = "0.22"

[package]
name = "delonix-server"
version = "0.1.0"
edition = "2021"

[dependencies]
delonix-meet-core = { path = "crates/delonix-meet-core" }
delonix-meet-domain = { path = "crates/delonix-meet-domain" }
delonix-meet-protocol = { path = "crates/delonix-meet-protocol" }
delonix-meet-store = { path = "crates/delonix-meet-store" }
# gRPC interno (ADR-0006 §3): mTLS com rustls/ring, health e reflection.
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
# OpenAPI 3.1 gerado do código (ADR-0006 §3): o cliente TS do web gera-se daqui.
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
# MD5 é obrigatório pelo SIP Digest (RFC 2617/3261: HA1 = MD5(user:realm:pass)) —
# não é uma escolha de segurança nossa, é o que o registar do FreeSWITCH exige
# (ver ramais.rs). Nunca usado para nada que dependa de resistência a colisão.
md-5 = "0.10"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
webrtc = "0.17.1"
anyhow = "1.0.103"
aes-gcm = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
url = "2"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1.13.0"
# Limpeza de material de chave em memória (ver signaling::Secret).
zeroize = "1"
# Ponte de media FreeSWITCH↔SFU (pstn_bridge.rs, ver docs/pstn-sfu-bridge-design.md
# "Abordagem B"). O SFU nunca tinha descodificado Opus — reencaminha RTP sem
# tocar no conteúdo (ver cabeçalho de sfu.rs) — mas misturar N chamadores
# WebRTC para 1 stream PSTN exige decode→soma→encode real. `libopus-dev` tem
# de estar instalado no host de build (o crate liga-se à lib do sistema via
# pkg-config; falha a compilar sem ela).
audiopus = "0.2.0"
# SMPP sobre TLS (ADR-0005, smpps://). `rustls`/`tokio-rustls` e `webpki-roots`
# já estavam na árvore (sqlx, reqwest/openidconnect via rustls-tls, e
# hyper-rustls) — aqui só se tornam dependências directas para o handshake
# `smpps://`. `pem` idem, já usado pelo `jsonwebtoken` e pelo `rcgen`, aqui
# para ler a CA própria de um operador (`SMS_<OPERADOR>_SMPP_CA`).
#
# `default-features = false` + `"ring"` EXPLÍCITO em vez do default do rustls
# 0.23 (`aws_lc_rs`): `dtls` (dependência do `webrtc`, o SFU desde sempre) e o
# `tls-rustls` do `sqlx` já trazem o backend `ring` para a árvore. Com o
# default daqui, o binário ficava com as DUAS crypto providers compiladas ao
# mesmo tempo e o rustls recusa-se a escolher sozinho —
# `Could not automatically determine the process-level CryptoProvider`, um
# panic em QUALQUER ligação TLS do processo (não só a do SMPP) — medido a
# rebentar testes do SFU sem nada a ver com SMPP (ver `pstn_bridge.rs`,
# `sfu_e2e.rs`). Ficar só com `ring`, já usado pelas outras duas dependências,
# resolve sem precisar de um `CryptoProvider::install_default()` espalhado
# por `main()` e por cada teste que toque TLS.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
webpki-roots = "1"
pem = "3"
# SRTP autónomo (fora de um RTCPeerConnection/DTLS) para a ingress/egress da
# ponte PSTN↔SFU — a MESMA versão 0.17.1 que o `webrtc` já traz transitivamente
# (o SFU usa SRTP hoje só através do handshake DTLS de cada PeerConnection;
# esta é a primeira vez que este código constrói um `Context` SRTP à mão, com
# chaves efémeras geridas pelo control plane em vez de negociadas por DTLS).
webrtc-srtp = "0.17.1"
# Construir o payload RTP cru da mistura (pstn_bridge.rs) antes de o cifrar —
# já transitivo (o `rtp`/`webrtc-srtp` usam-no internamente), directo aqui só
# para o tipo `Bytes` do `rtp::packet::Packet::payload`.
bytes = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
# Testes de integração em tests/: `#[sqlx::test]` dá a cada teste uma base
# própria, migrada, no Postgres de DATABASE_URL.
sqlx = { version = "0.8", features = ["macros"] }
# Certificados de teste: mTLS do gRPC interno (tests/grpc.rs) e o SMSC falso
# do teste TLS de sms_smpp.rs. Já estava na árvore como dependência normal
# do `webrtc`/`dtls`.
rcgen = "0.13"
# IdP OIDC falso dos testes de segurança (`tests/security_identity.rs`): gera a
# chave RS256 em memória, a cada corrida — nenhuma chave privada no repositório.
# Já vinha no Cargo.lock pelo `openidconnect`.
rsa = "0.9"

# webrtc-ice 0.17.1 com UMA alteração: responde 487 (Role Conflict) autenticado
# a um pedido com o mesmo papel ICE que o do agente, em vez de o deitar fora
# (`send_role_conflict` em vendor/webrtc-ice/src/agent/agent_internal.rs).
# Sem ela o Chrome, que passa a CONTROLLED ao responder a cada oferta do SFU,
# perdia o consentimento ICE ~5 s depois de ligar — R157. Nem a 0.17.2 trata o
# conflito. Retirar este patch só quando o upstream o fizer (o teste
# `conflito_de_papel_ice_recebe_487_autenticado` diz se fez).
[patch.crates-io]
webrtc-ice = { path = "vendor/webrtc-ice" }
