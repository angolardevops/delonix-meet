# ============================================================
#  CI do Delonix Meet.
#
#  Nota que poupa meia hora a quem vier a seguir: o BUILD não precisa de
#  Postgres. O backend usa a API de RUNTIME do sqlx (`query`, `query_as`),
#  não as macros `query!`, por isso não há verificação de SQL em compile time
#  e não é preciso `DATABASE_URL` nem `.sqlx/` no build. Isso é uma limitação
#  real — um nome de coluna errado só falha em execução — e é exactamente por
#  isso que os TESTES precisam: os de integração em `server/tests/`
#  (ADR-0004 §6 passo 2) correm cada caso numa base própria (`#[sqlx::test]`)
#  e são o que apanha a coluna errada antes da produção.
# ============================================================
name: CI

# A `develop` é a branch default e é para onde as PRs fundem: sem `push` nela, o
# commit FUNDIDO nunca era medido — só a cabeça de cada PR, antes de se juntar às
# outras (medido a 2026-10-04: a cabeça da develop não tinha corrida nenhuma).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Cancelar a corrida anterior só faz sentido numa PR, onde o push novo a
# substitui. Num ramo de integração cada commit fundido tem de ficar com o seu
# veredicto: com `cancel-in-progress: true` em todo o lado, três commits da
# `main` ficaram sem CI concluído porque a fusão seguinte cancelou a corrida.
#
# Por isso o grupo é o RAMO numa PR e o COMMIT num push. Não chega pôr
# `cancel-in-progress: false` com o grupo por ramo: um grupo guarda no máximo
# uma corrida a correr e UMA à espera, e a terceira fusão cancela a que estava
# à espera. Medido a 2026-10-04, na própria noite em que a regra entrou: com
# três fusões seguidas na `develop`, a corrida do commit do meio (`4479dcc8`)
# ficou «cancelled».
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Nada de `RUSTFLAGS: -D warnings`: a árvore herda avisos (`dead_code` em
  # `redis_state.rs`, `rooms.rs`, …) e isso deixaria o CI vermelho no primeiro
  # dia sem nada de novo ter partido. Quem trata dos avisos é a catraca do
  # clippy — que já os conta, porque o clippy corre também os lints do rustc.

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: delonix
          POSTGRES_PASSWORD: delonix_dev
          POSTGRES_DB: delonix_meet
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U delonix -d delonix_meet"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Só para `server/tests/seat_redis.rs` (o lugar reservado partilhado entre
      # pods). Os outros testes não usam Redis: `TEST_REDIS_URL` é lida só ali.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Formatação (cargo fmt --check)
        run: cargo fmt --manifest-path server/Cargo.toml --check

      - name: Catraca do clippy (o número de avisos não sobe)
        run: bash scripts/check-clippy-ratchet.sh

      # E2E_TIMEOUT_FACTOR: os testes de media montam RTCPeerConnections a
      # sério (ICE, DTLS, primeiro RTP). Numa máquina de desenvolvimento
      # resolvem-se em ~0,1 s; num runner partilhado com 2 vCPU chegaram a
      # estourar os 30 s e a falhar sem nada estar partido. Um portão que falha
      # ao acaso perde a credibilidade toda.
      - name: Testes
        env:
          E2E_TIMEOUT_FACTOR: 4
          # Testes de integração (server/tests/): cada `#[sqlx::test]` cria e
          # migra a sua própria base neste servidor. Sem a variável falham —
          # não passam a verde por não terem corrido.
          DATABASE_URL: postgres://delonix:delonix_dev@localhost:5435/delonix_meet
          TEST_REDIS_URL: redis://localhost:6379
        # --test-threads=4: cada binário de testes partilha uma pool de ligações;
        # sem tecto, os testes esperam ligações e falham por PoolTimedOut num
        # runner de 2 vCPU, não por o produto estar partido.
        run: cargo test --manifest-path server/Cargo.toml --release --workspace -- --test-threads=4

      - name: Build de release
        run: cargo build --manifest-path server/Cargo.toml --release

      # Aqui e não no job de fitness: gerar o spec corre o binário, e este job
      # já o compilou.
      - name: Contrato OpenAPI (spec gerado = commitado; catraca da cobertura)
        run: mkdir -p ~/.cache && bash scripts/check-openapi.sh

  frontend:
    name: Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Tipos (tsc --noEmit)
        run: node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Testes (vitest — guarda as regressões R1/R2/R13)
        run: node_modules/.bin/vitest run

      # O `npm ci` traz a BIBLIOTECA do Playwright, não os browsers. Sem este
      # passo o portão abaixo morre com «Executable doesn't exist» — passou-me
      # ao princípio porque na máquina de desenvolvimento já lá estavam. O job
      # `isolamento` faz o mesmo, pela mesma razão.
      - name: Browser para o portão de layout
        run: npx playwright install chromium

      # Corre da RAIZ, como os outros e2e: o Node resolve `@playwright/test` a
      # partir da pasta do script (web/e2e → web/node_modules), não do cwd.
      - name: Barra da sala em ecrã estreito (R86 — desligar tem de caber)
        working-directory: .
        run: node web/e2e/bar-responsivo.mjs

      - name: Build de produção
        run: npm run build

  web_admin:
    name: Backoffice (web-admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - run: npm ci

      - name: Tipos (tsc --noEmit)
        run: node_modules/.bin/tsc --noEmit

      - name: Testes (vitest)
        run: node_modules/.bin/vitest run

      # Sem e2e ainda (R-nada registado): é a primeira versão do backoffice,
      # só tsc + vitest + build, como o resto desta fase documenta no PR.
      - name: Build de produção
        run: npm run build

  fitness:
    name: Fitness functions (arquitectura + higiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Higiene do repo (chaves, artefactos, dumps, migrações)
        run: bash scripts/check-repo-hygiene.sh

      - name: Capacidades vendidas (nada se vende sem código por trás)
        run: bash scripts/check-capability-claims.sh

      # O lint do frontend precisa das dependências; o job de fitness não as
      # instalava porque até 2026-10-06 não havia lint nenhum para correr.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências do frontend (para o lint)
        run: npm ci --prefix web --no-audit --no-fund
      - name: Lint do frontend (catraca — os problemas só descem)
        run: bash scripts/check-frontend-lint.sh

      - name: Drift documental (módulos, migrações, versões, SQL)
        run: bash scripts/check-docs-drift.sh

      - name: Autorização de rotas (nenhuma rota aberta por esquecimento)
        run: bash scripts/check-route-auth.sh

      - name: Afinidade por sala (ADR-0001 / regressão R3)
        run: bash scripts/check-room-affinity.sh

      # O Lua 5.2 é o que o mod_lua da imagem liga (liblua5.2).
      - name: Sintaxe dos scripts Lua do FreeSWITCH (R223 — o IVR está no caminho de quem liga)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lua5.2
          bash scripts/check-lua-sintaxe.sh

      - name: XML do FreeSWITCH (R226 — defeitos que só apareciam no arranque)
        run: bash scripts/check-fs-xml.sh

      - name: ffmpeg do servidor é LGPL, com versão e SHA-256 fixados (docs/tv/b3-ffmpeg-lgpl-2026-10-04.md)
        run: bash scripts/check-ffmpeg-licenca.sh

      - name: O bordo SIP anuncia um endereço real (R277 — sem ele, todas as chamadas caem aos 32 s)
        run: bash scripts/check-bordo-anuncia.sh

      - name: Só o bordo diz de que organização é uma central (ADR-0016)
        run: bash scripts/check-bordo-central.sh

      - name: Os compose das réplicas de prova lêem-se (uma chave repetida partiu uma sem ninguém ver)
        run: bash scripts/check-replicas-compose.sh

      - name: Manifestos K8s renderizam; portas internas fora do ingress (ADR-0006 §4)
        run: bash scripts/check-k8s-render.sh

      - name: Chart Helm renderiza, recusa o inseguro e respeita ADR-0001/ADR-0006
        run: bash scripts/check-helm.sh

      - name: A observabilidade aponta para coisas reais (um ServiceMonitor sem alvos é indistinguível de um produto saudável)
        run: bash scripts/check-observabilidade.sh

      - name: O Ansible da produção lê-se e os plays casam com o inventário do tofu (ADR-0020)
        run: bash scripts/check-ansible-producao.sh

      - name: Uma só crypto provider do rustls (as duas fazem QUALQUER TLS do processo entrar em panic — R308)
        run: bash scripts/check-crypto-provider.sh

      - name: Catraca da arquitectura (ADR-0004 — nenhuma cópia nova)
        run: bash scripts/check-arquitectura-catraca.sh

      - name: Toda a reivindicação de trabalho passa pela peça comum
        run: bash scripts/check-filas-reivindicacao.sh

      - name: Regra da dependência entre crates (ADR-0006 §1)
        run: bash scripts/check-crate-deps.sh

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Contratos gRPC (buf lint + breaking contra a main)
        run: bash scripts/check-proto.sh

      - name: Cobertura do isolamento (R95 — toda a rota de org é exercitada)
        run: bash scripts/check-isolamento-cobertura.sh

      - name: Browsers antes dos e2e (R97 — o mesmo erro, duas vezes)
        run: bash scripts/check-browser-antes-do-e2e.sh

      # O check-tenant-rls.sh exige um cluster vivo e faz skip sem ele. Não é
      # executado aqui de propósito: um teste que faz skip em silêncio no CI
      # dá luz verde sem ter provado nada. Corre onde há cluster (`make prod`).

  seguranca:
    name: Segurança das dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: cargo-audit (RustSec)
        run: cargo install cargo-audit --locked

      # Catraca, não portão absoluto: a árvore entra com 7 avisos altos/críticos
      # por transitividade das bibliotecas de IA no browser, cada um com a razão
      # escrita em scripts/dep-audit-accepted.txt. Um portão absoluto ficaria
      # vermelho no primeiro dia e seria desligado na semana seguinte — e depois
      # ninguém repararia no aviso NOVO, que é o que este passo existe para ver.
      - name: Catraca do audit (npm + cargo)
        run: bash scripts/check-dep-audit.sh

  # Isolamento entre inquilinos, contra um servidor A SÉRIO com Postgres a
  # sério. É o critério de saída do §5.4 do mandato — «nenhum endpoint
  # cross-tenant; testes automáticos de isolamento; testes de permissões
  # negativas» — e um teste de isolamento contra um duplo prova o duplo, não o
  # produto.
  isolamento:
    name: Isolamento, MFA, gravação e drain
    runs-on: ubuntu-latest
    # O mesmo factor que o job do backend já usa: os testes de media e de
    # WebCodecs correm num runner partilhado de 2 vCPU, onde o que na máquina de
    # desenvolvimento leva segundos pode levar minutos. Um portão que falha por
    # o runner estar lento não distingue produto partido de máquina ocupada —
    # e treina toda a gente a carregar em «repetir» (R90).
    env:
      E2E_TIMEOUT_FACTOR: 4
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: delonix
          POSTGRES_PASSWORD: delonix_dev
          POSTGRES_DB: delonix_meet
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U delonix -d delonix_meet"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Build do servidor
        run: cargo build --manifest-path server/Cargo.toml --release

      - name: Arrancar o servidor (migrações incluídas)
        run: |
          # AUTH_RATE_PER_MIN elevado SÓ AQUI: os três testes ponta-a-ponta
          # correm do mesmo IP (localhost) e esgotavam o limite de 20/min, com o
          # sintoma a aparecer como «o login não completou» no terceiro. O
          # default de produção não muda.
          # OUTBOUND_ALLOW_HOSTS=127.0.0.1: o `directo.mjs` aponta um destino a
          # 127.0.0.1:1 para ver a falha de ligação. Desde a guarda anti-SSRF
          # dos destinos RTMP (RFC-0001, B2) um destino interno é recusado, e
          # só o nome isento o deixa passar.
          DELONIX_ALLOW_INSECURE=1 COOKIE_INSECURE=1 AUTH_RATE_PER_MIN=2000 \
            OUTBOUND_ALLOW_HOSTS=127.0.0.1 \
            RECORDINGS_DIR=/tmp/gravacoes \
            DRAIN_READINESS_SECS=2 DRAIN_GRACE_SECS=25 DRAIN_RECONNECT_MS=1000 \
            ./server/target/release/delonix-server > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/api/status >/dev/null && exit 0
            sleep 2
          done
          echo "o servidor não arrancou:"; cat /tmp/servidor.log; exit 1

      - name: Isolamento e permissões negativas
        run: node web/e2e/isolamento.mjs

      # Convidado SEM conta, pela API e pelo /ws (sem interface — a consola vai
      # ser substituída e este é o contrato do ecrã novo): sala de espera,
      # admissão pelo anfitrião, nunca promovido, reentrada no mesmo lugar e a
      # sala a fechar a porta. Corre depois do isolamento, que usa IPs de teste
      # em X-Forwarded-For para não gastar a quota de entradas deste IP.
      - name: Convidado sem conta (sala de espera, admissão, recusas)
        run: node web/e2e/convidado.mjs

      # A auditoria é atacada DIRECTAMENTE por SQL, não pela API: um teste que
      # só usa a API prova que a API não deixa, não que os dados estão
      # protegidos. E o adversário que interessa numa auditoria é quem TEM
      # privilégios.
      - name: Auditoria imutável (ataque directo à base de dados)
        run: PG=$(docker ps --filter ancestor=postgres:17-alpine --format '{{.Names}}' | head -1) node web/e2e/auditoria.mjs

      # add_employee não pode capturar uma conta de outra org. A guarda só é
      # alcançável numa org LEGADA (email_domain vazio, que a API não cria), por
      # isso o teste esvazia o domínio por SQL e tenta a captura — como a
      # auditoria, ataca a base directamente. Ver S7 / R122.
      - name: Captura por add_employee (org legada, ataque directo à base)
        run: PG=$(docker ps --filter ancestor=postgres:17-alpine --format '{{.Names}}' | head -1) node web/e2e/captura-empregado.mjs

      # O MFA precisa do mesmo servidor a correr. O teste implementa o TOTP em
      # JavaScript de propósito: é uma segunda implementação independente do
      # RFC 6238, e vê-la concordar com a de Rust vale muito mais do que ver a
      # de Rust concordar consigo própria.
      - name: MFA por TOTP (fluxo completo, ao nível da API)
        run: node web/e2e/mfa.mjs


      # E o mesmo visto pelo UTILIZADOR. O backend estar certo não faz um
      # produto: sem interface, o MFA existe para quem sabe fazer POSTs. É este
      # teste que separa as duas coisas.
      # `working-directory: web` NÃO é decoração. Sem ele o `npx` corre na raiz,
      # onde não há `node_modules`, DESCARREGA o Playwright mais recente e
      # instala os browsers DESSA versão — enquanto os testes usam o
      # `web/node_modules`, que espera outra. O aviso está no log e passou
      # despercebido durante meses:
      #
      #   npm warn exec The following package was not found and will be
      #   installed: playwright@1.63.0
      #   WARNING: It looks like you are running 'npx playwright install'
      #   without first installing your project's dependencies.
      #
      # O sintoma é «Executable doesn't exist», que se lê como «faltou
      # instalar» quando o que faltou foi instalar NO SÍTIO CERTO. O job
      # `frontend` nunca teve o problema porque tem
      # `defaults.run.working-directory: web`.
      - name: Chromium para o teste de interface
        run: npx playwright install chromium
        working-directory: web
      - name: Interface do MFA (Chromium real)
        run: |
          (cd web && NO_HTTPS=1 npx vite --port 5174 > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 40); do
            curl -sf http://localhost:5174/ >/dev/null && break
            sleep 2
          done
          # Confirma que o PROXY do vite chega ao servidor: é por ele que o
          # browser fala com a API, e se estiver mudo o sintoma é «o login não
          # completou», que aponta para o sítio errado.
          curl -sf http://localhost:5174/api/status || { echo "o proxy do vite NÃO alcança a API"; cat /tmp/vite.log; exit 1; }
          APP=http://localhost:5174 node web/e2e/ui-mfa.mjs
          # Uma gravação que falha tem de ser VISTA. O CI não tem ffmpeg
          # instalado, o que torna este teste realista de graça: é exactamente a
          # falha de OPERAÇÃO que produzia o pior silêncio — o anfitrião via o
          # indicador aceso a reunião inteira e ficava sem nada nem aviso.
          # Precisa do vite (carrega o arnês de media), por isso corre aqui.
          # Tempos de entrada medidos numa entrada A SÉRIO. Um teste contra
          # duplos provaria a aritmética; o que interessa provar é que os
          # marcos disparam nos sítios certos de uma chamada verdadeira.
          #
          # Corre ANTES da gravação de propósito: é o único teste desta bateria
          # que MEDE em vez de verificar, e o estabelecimento de ICE degrada-se
          # com a carga da máquina — medido em local, `join_ms` passa de ~250 ms
          # a nunca ligar quando há browsers e servidores a mais (R65). Depois
          # de a gravação abrir um segundo Chromium com login e três vistas, o
          # runner deixou de conseguir. Mede-se com a máquina quieta.
          APP=http://localhost:5174 PG=$(docker ps --filter ancestor=postgres:17-alpine --format '{{.Names}}' | head -1) node web/e2e/tempos.mjs
          # Uma gravação que falha tem de ser VISTA — e as três vistas da
          # biblioteca não podem oferecer acções sobre ela (R59).
          APP=http://localhost:5174 node web/e2e/gravacao-falhada.mjs
          # E uma que o servidor ainda está a COMPOR não é uma falhada: lê-se
          # «a processar», com o progresso, nas mesmas vistas e sem acções. A
          # linha entra por SQL, como o gravador a insere, porque a janela real
          # é curta demais para um teste a apanhar.
          APP=http://localhost:5174 PG=$(docker ps --filter ancestor=postgres:17-alpine --format '{{.Names}}' | head -1) node web/e2e/gravacao-a-compor.mjs
          # A REENTRADA volta ao CI (R98). Esteve fora seis rondas por falhar só
          # no runner — e a causa era o PRODUTO: duas renovações de sessão
          # concorrentes revogavam-se uma à outra e punham o utilizador na
          # página de entrada. Aqui dentro porque precisa do vite, e depois do
          # `tempos.mjs`, que precisa da máquina quieta.
          APP=http://localhost:5174 API=http://localhost:8180 node web/e2e/reentrada.mjs
          # O ESTÚDIO grava ecrã, recorta região e corta — nada disso se prova
          # em unidades. O teste captura o ecrã a sério, mede a variação de
          # pixéis para saber que o canvas não está preto, e verifica a DURAÇÃO
          # do ficheiro cortado, não a existência dele.
          echo '::group::Estudio (Chromium real)'
          BASE=http://localhost:5174 node web/e2e/estudio.mjs 2>&1
          echo "estudio.mjs terminou com $?"
          echo '::endgroup::'
          # O DRAIN vai por último: manda SIGTERM ao servidor e espera que ele
          # feche. Qualquer teste depois deste ficaria sem servidor.
          # O ESTÚDIO grava ecrã, recorta região e corta. Nada disso se prova em
          # unidades: o teste captura o ecrã a sério, mede a variação de pixéis
          # para saber que o canvas não está preto, e verifica a DURAÇÃO do
          # ficheiro cortado — não a existência dele.
          # Duas pessoas encontram-se MESMO, pela interface real: criar →
          # pré-entrada → entrar → convidado por código → sala de espera →
          # admitir → retrato remoto. É a promessa central do produto e não
          # havia teste nenhum a cobri-la ponta a ponta.
          APP=http://localhost:5174 node web/e2e/reuniao.mjs
          # O painel de gravações DENTRO da sala é mais uma vista da gravação
          # (R59): nenhum botão sobre uma a compor, falhada, ou que quem vê não
          # pode descarregar; e uma gravação do servidor parada na sala entra na
          # lista sozinha. Sem ffmpeg, essa acaba falhada com a causa — é a
          # falha de operação que o runner dá de graça. Depois do `reuniao.mjs`,
          # que prova que se entra numa sala pela interface.
          APP=http://localhost:5174 PG=$(docker ps --filter ancestor=postgres:17-alpine --format '{{.Names}}' | head -1) node web/e2e/gravacao-na-sala.mjs
          # Um CONVIDADO SEM CONTA entra pela interface: o link, um nome, a
          # sala de espera, o anfitrião admite. É o caminho que decide a
          # adopção, e durante meses o servidor teve a rota e nenhum ecrã a
          # chamava — o `convidado.mjs` prova o servidor, este prova o ecrã.
          APP=http://localhost:5174 API=http://localhost:8180 node web/e2e/convidado-ecra.mjs
          # A MESMA pessoa entra duas vezes — portátil e telemóvel. A segunda
          # sessão tem de entrar SEM áudio: dois microfones e dois altifalantes
          # da mesma pessoa no mesmo espaço físico realimentam-se, e o ruído é
          # de toda a gente na reunião, não só de quem o causa (R114).
          APP=http://localhost:5174 node web/e2e/companion.mjs
          BASE=http://localhost:5174 node web/e2e/estudio.mjs
          # A GAVETA a 375px e o anel de foco vivem em `transform` e `outline`,
          # que só um motor de browser resolve.
          BASE=http://localhost:5174 node web/e2e/layout-consola.mjs
          # O DIRECTO: o painel, o WebSocket aceite pelo servidor, e a chave a
          # sair REDIGIDA do log. Não prova que a media chega ao YouTube — isso
          # é a linha 2 do portão do ADR-0003 e precisa de um destino a sério.
          BASE=http://localhost:5174 node web/e2e/directo.mjs
          APP=http://localhost:5174 node web/e2e/drain.mjs

      # Sem isto, uma falha de interface no CI é um timeout sem contexto. Com a
      # imagem do momento da falha, diagnostica-se sem ter de reproduzir.
      - name: PWA offline (build servido, rede cortada a sério)
        run: |
          # O SW NÃO se regista no servidor de desenvolvimento — de propósito,
          # senão a app serve módulos do Vite em cache e fica teimosa. Por isso
          # este é o único e2e que corre contra o `dist` construído.
          (cd web && npm run build > /tmp/build-pwa.log 2>&1)
          (cd web && NO_HTTPS=1 npx vite preview --port 5175 > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 40); do
            curl -sf http://localhost:5175/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5175/sw.js >/dev/null || { echo "o sw.js não é servido"; cat /tmp/preview.log; exit 1; }
          BASE=http://localhost:5175 node web/e2e/offline.mjs

      - name: Screenshots e log do vite (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-mfa-diagnostico
          path: |
            /tmp/mfa-*.png
            /tmp/vite.log
          if-no-files-found: ignore

      - name: Log do servidor (se falhar)
        if: failure()
        run: cat /tmp/servidor.log

  # SBOM: artefacto por build, para inventário e resposta a CVE. Não é um
  # portão — é prova do que foi enviado.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: SBOM do backend (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path server/Cargo.toml --format json

      - name: SBOM do frontend (CycloneDX)
        working-directory: web
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../delonix-web.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            server/*.cdx.json
            server/**/*.cdx.json
            delonix-web.cdx.json
          if-no-files-found: warn
