# ============================================================
#  Imagem FreeSWITCH do Meet (voice/freeswitch/image/, R223).
#
#  Só corre quando a imagem, a configuração de voz ou as suas provas mudam:
#  compilar o FreeSWITCH leva um quarto de hora (a cache poupa-o quando a
#  imagem não mudou), e não há razão para o pagar em cada PR.
#
#  PR   → build + prova de fumo + as provas com chamadas (softphone-prova.sh:
#         selftest, srtp-real, srtp-cluster); nada é publicado.
#  main → o mesmo, e depois publica em
#         ghcr.io/<owner>/delonix-meet-freeswitch:1.11.3-<sha8>, com SBOM e
#         proveniência. A tag é imutável: nunca :latest nem :1.11.3 sozinho —
#         quem a usa fixa-a, e promove-se por digest.
#
#  A R222 (a ponte com um FreeSWITCH real) continua FORA daqui: precisa
#  também do SFU e do cliente webrtc-rs — ver scripts/e2e-fora-do-ci.txt.
# ============================================================
name: Imagem FreeSWITCH

on:
  push:
    branches: [main]
    paths:
      # Toda a configuração de voz que as provas com chamadas exercitam (R226):
      # um perfil ou um dialplan que mude tem de voltar a passar por elas.
      - voice/freeswitch/**
      - voice/softphone/**
      - voice/cluster/**
      - compose.yaml
      - scripts/cluster-voice.sh
      - scripts/softphone-prova.sh
      - scripts/freeswitch-image-smoke.sh
      - scripts/check-lua-sintaxe.sh
      - .github/workflows/freeswitch-image.yml
  pull_request:
    paths:
      # Toda a configuração de voz que as provas com chamadas exercitam (R226):
      # um perfil ou um dialplan que mude tem de voltar a passar por elas.
      - voice/freeswitch/**
      - voice/softphone/**
      - voice/cluster/**
      - compose.yaml
      - scripts/cluster-voice.sh
      - scripts/softphone-prova.sh
      - scripts/freeswitch-image-smoke.sh
      - scripts/check-lua-sintaxe.sh
      - .github/workflows/freeswitch-image.yml
  workflow_dispatch:

concurrency:
  group: freeswitch-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  imagem:
    name: Build, prova de fumo e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      LOCAL: delonix-meet/freeswitch:1.11.3
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (carregada no docker local para a prova)
        uses: docker/build-push-action@v6
        with:
          context: voice/freeswitch/image
          file: voice/freeswitch/image/Containerfile
          tags: ${{ env.LOCAL }}
          load: true
          cache-from: type=gha,scope=freeswitch
          cache-to: type=gha,scope=freeswitch,mode=max

      - name: Prova de fumo (fontes fixadas, módulos carregam, mod_lua executa)
        run: bash scripts/freeswitch-image-smoke.sh "$LOCAL"

      # As provas com chamadas, contra a imagem acabada de construir: um
      # softphone (baresip) numa rede docker sem saída. Estavam fora do CI, e
      # «SRTP obrigatório» só se prova com a chamada em claro a ser recusada.
      - name: Softphone — PIN por DTMF, tons nos dois sentidos, e sem SRTP → 488
        run: FS_IMAGE="$LOCAL" bash scripts/softphone-prova.sh selftest

      # A configuração que CORRE: a que o arranque monta com os ficheiros do
      # compose.yaml e, a seguir, com os do ConfigMap do cluster.
      - name: Compose — sem SRTP → 488 nos ramais e no dial-in; segredo e PIN fora do log (R226, R227)
        run: FS_IMAGE="$LOCAL" bash scripts/softphone-prova.sh srtp-real

      - name: Cluster — a mesma prova, com os ficheiros do ConfigMap
        run: FS_IMAGE="$LOCAL" bash scripts/softphone-prova.sh srtp-cluster

      - name: Nome publicado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: nome
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "ref=ghcr.io/${owner}/delonix-meet-freeswitch:1.11.3-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.nome.outputs.ref != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesma cache: não recompila, só junta SBOM e proveniência e empurra.
      - name: Publicar (só na main)
        if: steps.nome.outputs.ref != ''
        id: push
        uses: docker/build-push-action@v6
        with:
          context: voice/freeswitch/image
          file: voice/freeswitch/image/Containerfile
          tags: ${{ steps.nome.outputs.ref }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=freeswitch

      - name: Digest publicado
        if: steps.nome.outputs.ref != ''
        run: |
          echo "### Imagem FreeSWITCH publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.nome.outputs.ref }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
